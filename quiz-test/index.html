<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f9f67">
<link rel="manifest" href="./manifest.webmanifest">
<title>理解型刷题 · 固定网页版</title>
<style>
:root{
  --bg:#f4f7f5;--surface:#ffffff;--text:#1d2521;--muted:#6e7872;
  --line:#e2e9e5;--green:#109965;--green2:#0a7249;--green-soft:#eaf7f0;
  --red:#c94545;--red-soft:#fff0f0;--amber:#b77700;--amber-soft:#fff7e6;
  --shadow:0 8px 28px rgba(24,45,34,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{overscroll-behavior-y:none}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{max-width:820px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;margin:0 -12px;padding:12px 14px 10px;background:rgba(244,247,245,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,233,229,.75)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#11ad71,#08764b);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 6px 16px rgba(16,153,101,.25)}
.top-action{border:0;background:var(--surface);padding:8px 11px;border-radius:11px;color:var(--green2);font-weight:700;box-shadow:var(--shadow)}
.content{padding:14px 0 18px}
.hero{background:linear-gradient(145deg,#0f9f67,#0b7c50);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(15,159,103,.2)}
.hero h1{font-size:24px;margin:0 0 8px}
.hero p{margin:0;opacity:.9;line-height:1.55}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.hero-stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:11px 8px;text-align:center}
.hero-stat b{display:block;font-size:21px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.section-title h2{font-size:18px;margin:0}
.section-title span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.chapter-card{display:flex;align-items:center;gap:14px}
.chapter-icon{width:50px;height:50px;border-radius:15px;background:var(--green-soft);color:var(--green2);display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto}
.chapter-info{flex:1;min-width:0}
.chapter-info h3{margin:0 0 5px;font-size:17px}
.chapter-info p{margin:0;color:var(--muted);font-size:13px}
.progress{height:8px;border-radius:999px;background:#e4ebe7;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--green);border-radius:999px}
.primary{border:0;background:var(--green);color:#fff;padding:12px 14px;border-radius:13px;font-weight:800}
.ghost{border:0;background:#eef2ef;color:#33413a;padding:12px 14px;border-radius:13px;font-weight:700}
.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.bottom-nav-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav-btn{border:0;background:transparent;padding:7px 4px 4px;color:#758079;border-radius:12px;font-size:12px}
.nav-btn .ico{display:block;font-size:21px;line-height:1.2;margin-bottom:2px}
.nav-btn.active{background:#edf8f2;color:var(--green2);font-weight:800}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:13px}
.qtitle{font-size:20px;line-height:1.65;font-weight:750;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{width:100%;border:1.5px solid var(--line);background:#fff;text-align:left;border-radius:15px;padding:14px 15px;line-height:1.5;font-size:16px}
.option.selected{border-color:var(--green);background:#f0faf5}
.option.correct{border-color:#158655;background:#eaf8f1}
.option.wrong{border-color:var(--red);background:var(--red-soft)}
.fill-row{display:flex;gap:8px}
.fill{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;background:#fff}
.fill:focus{border-color:var(--green)}
.answer-banner{margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.answer-banner.good{background:var(--green-soft);color:#0d6841}
.answer-banner.bad{background:var(--red-soft);color:#a53131}
.analysis{margin-top:14px;border-top:1px dashed #d6ded9;padding-top:10px}
.analysis h3{font-size:17px;margin:4px 0 10px}
.analysis-block{padding:13px 14px;border-radius:14px;margin:9px 0;line-height:1.68;font-size:15px}
.analysis-block b{display:block;margin-bottom:3px}
.analysis-block.principle{background:#eef8f3}
.analysis-block.why{background:#f5f7f6}
.analysis-block.mistake{background:#fff3ee}
.analysis-block.memory{background:var(--amber-soft)}
.qactions{display:flex;gap:9px;margin-top:15px}
.qactions button{flex:1}
.reinforce-note{margin-top:10px;color:var(--amber);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.metric b{display:block;font-size:26px;color:var(--green2);margin-bottom:4px}
.metric span{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px}
.wrong-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.wrong-card h4{margin:0 0 7px;font-size:15px;line-height:1.5}
.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f0;color:#536059}
.mini{font-size:13px;color:var(--muted);line-height:1.55}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.install-tip{background:#fff8e6;border:1px solid #f0dfb5;border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.55;color:#79530a;margin-top:10px}
.plan-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.plan-input{width:92px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:11px 12px;outline:none;text-align:center;font-weight:800}
.plan-input:focus{border-color:var(--green)}
.quick-counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.quick-counts button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 11px;font-size:13px}
.quick-counts button.active{background:var(--green-soft);border-color:#bde3d0;color:var(--green2);font-weight:800}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.backup-note{margin-top:10px;font-size:12px;line-height:1.65;color:var(--muted)}
.memory-card{border:1px solid #cfe9dc;background:linear-gradient(145deg,var(--surface),var(--green-soft));border-radius:18px;padding:16px}
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.memory-stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center}
.memory-stat b{display:block;font-size:21px;color:var(--green2)}
.memory-stat span{font-size:12px;color:var(--muted)}
.memory-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.memory-hint{margin-top:10px;padding:10px 11px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:12px;line-height:1.6;color:var(--muted)}
.status-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green-soft);color:var(--green2);font-size:12px;font-weight:800}


.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);background:#1f2924;color:#fff;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  .app-shell{padding-left:9px;padding-right:9px}
  .topbar{margin-left:-9px;margin-right:-9px}
  .hero{padding:18px 16px;border-radius:19px}
  .hero h1{font-size:22px}
  .qtitle{font-size:18px}
  .analysis-block{font-size:14px}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111814;--surface:#18211c;--text:#eaf2ed;--muted:#9aa79f;--line:#2a3730;--green-soft:#173328;--red-soft:#351f1f;--amber-soft:#332a18;--shadow:none}
  .topbar{background:rgba(17,24,20,.94)}
  .option,.fill{background:#18211c;color:var(--text)}
  .ghost{background:#25312b;color:#d7e1db}
  .analysis-block.why{background:#202a25}
  .analysis-block.mistake{background:#321f1b}
  .bottom-nav{background:rgba(24,33,28,.97)}
}

.study-timer{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;color:var(--green2);font-weight:800;font-size:13px}
.check-card{margin-top:10px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.check-stat{text-align:center;background:var(--green-soft);border-radius:12px;padding:10px 5px}
.check-stat b{display:block;font-size:20px;color:var(--green2)}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.calendar-nav button{border:0;background:#eef2ef;color:var(--text);border-radius:10px;padding:7px 12px;font-weight:800}
.calendar-nav b{font-size:15px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-head{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal-day{border:0;min-height:38px;border-radius:10px;background:#eef2ef;color:var(--text);font-size:12px}
.cal-day.done{background:var(--green);color:#fff;font-weight:800}
.cal-day.today{outline:2px solid var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
window.__EMBEDDED_QUESTIONS__=[{"id":1,"chapter":"第一章《绪论》","type":"choice","q":"基尔霍夫电压定律适用于对（ ）列电压方程。","options":["A. 回路","B. 节点","C. 支路","D. 干路"],"answer":"A","principle":"基尔霍夫电压定律（KVL）的研究对象是闭合回路。沿任意闭合回路绕行一周，各段电压的代数和恒为 0。","why":"它本质上来自能量守恒：电荷沿闭合路径走一圈后回到原点，单位电荷的总能量变化必须为 0。","mistake":"节点对应的是 KCL（基尔霍夫电流定律），不是 KVL。","memory":"KVL 看回路，KCL 看节点。","tag":"基尔霍夫定律"},{"id":2,"chapter":"第一章《绪论》","type":"choice","q":"理想变压器主要特性不包括（ ）。","options":["A. 变换电压","B. 变换电流","C. 变换功率","D. 变换阻抗"],"answer":"C","principle":"理想变压器可以按匝数比改变电压和电流，也可以把负载阻抗折算到原边。","why":"理想情况下没有铜耗、铁耗等损耗，因此输入功率等于输出功率，即 P₁=P₂。它不是把功率变大或变小，而是电压、电流反向变化来保持功率不变。","mistake":"看到“能变电压、能变电流”容易误以为功率也被变换。理想变压器只改变电压/电流比例，不改变总功率。","memory":"理想变压器：U 变、I 变、R 变，P 不变。","tag":"变压器"},{"id":3,"chapter":"第一章《绪论》","type":"choice","q":"正弦稳态电路中，R、L 和 C 串联，它们的电压有效值分别为 4V、3V 和 6V，则它们串联的总电压有效值为（ ）。","options":["A. 7V","B. 1V","C. 5V","D. 13V"],"answer":"C","principle":"RLC 串联交流电路中，U_R 与电流同相；U_L 超前电流 90°；U_C 滞后电流 90°。","why":"所以 U_L 与 U_C 方向相反，先相减，再与 U_R 做直角合成：U = √[U_R² + (U_L-U_C)²] = √[4² + (3-6)²] = √25 = 5V。","mistake":"不能直接 4+3+6=13V，因为交流电压存在相位关系，不能普通相加。","memory":"RLC 串联总电压：先 L-C，再和 R 勾股。","tag":"RLC"},{"id":4,"chapter":"第一章《绪论》","type":"choice","q":"对于一个具有 n 个节点、b 条支路的连通电路来说，可以列出独立的 KCL 方程的数目是（ ）。","options":["A. b−1","B. n−1","C. b−n+1","D. b−n−1"],"answer":"B","principle":"KCL 对每个节点都能列方程，但所有节点方程并不全部独立。","why":"如果 n 个节点都列 KCL，最后一个节点方程能由前 n−1 个方程相加得到，所以独立方程只有 n−1 个。","mistake":"b−n+1 是独立 KVL 回路数的常见表达式，不是独立 KCL 方程数。","memory":"节点 n 个 → 独立 KCL：n−1 个。","tag":"基尔霍夫定律"},{"id":5,"chapter":"第一章《绪论》","type":"choice","q":"在正弦稳态 RLC 串联电路发生谐振后，当 ω 增加时，电路呈现（ ）。","options":["A. 电阻性","B. 电容性","C. 电感性","D. 无法确定"],"answer":"C","principle":"RLC 串联电路的总电抗 X = X_L - X_C，其中 X_L=ωL，X_C=1/(ωC)。","why":"谐振时 X_L=X_C。继续增大 ω 后，X_L 随 ω 增大，而 X_C 随 ω 增大反而减小，于是 X_L>X_C，总电抗为正，表现为电感性。","mistake":"只记住“谐振时纯电阻”还不够；频率超过谐振点后会转为电感性，低于谐振点时则为电容性。","memory":"串联 RLC：低频容性，高频感性，谐振纯阻性。","tag":"RLC"},{"id":6,"chapter":"第一章《绪论》","type":"choice","q":"当实际电流源开路时，该电流源内部（ ）。","options":["A. 有电流，有功率损耗","B. 无电流，无功率损耗","C. 有电流，无功率损耗","D. 无法确定"],"answer":"A","principle":"实际电流源可近似看成理想电流源与内阻并联。","why":"外部开路时，负载支路没有电流，但理想电流源产生的电流仍可在内部并联电阻中流动，因此内阻上有功率损耗。","mistake":"“外部开路没有输出电流”不等于“电源内部没有电流”。要区分外部支路和内部等效支路。","memory":"外面开路，里面不一定没电流。","tag":"电源模型"},{"id":7,"chapter":"第一章《绪论》","type":"choice","q":"在换路瞬间，下列说法中正确的是（ ）。","options":["A. 电感电流不能跃变","B. 电感电压必然跃变","C. 电容电流必然跃变","D. 无法确定"],"answer":"A","principle":"换路定则：电感电流 i_L 在换路瞬间不能突变；电容电压 u_C 在换路瞬间不能突变。","why":"若电感电流瞬间突变，由 u_L=L·di/dt 可知需要无穷大电压；若电容电压瞬间突变，由 i_C=C·du/dt 可知需要无穷大电流。真实电路无法提供这种无限量。","mistake":"不能突变的是电感电流和电容电压，而不是电感电压、电容电流。","memory":"电感保电流，电容保电压。","tag":"换路定则"},{"id":8,"chapter":"第一章《绪论》","type":"choice","q":"换路定则的本质是遵循（ ）。","options":["A. 电荷守恒","B. 电压守恒","C. 电流守恒","D. 能量守恒"],"answer":"D","principle":"电感和电容都是储能元件：电感储磁场能，电容储电场能。","why":"如果 i_L 或 u_C 在瞬间发生有限幅度突变，就意味着储能在零时间内发生有限变化，需要无限大的瞬时功率，这不符合实际物理过程。因此换路定则的物理本质与能量连续性、能量守恒相关。","mistake":"很多人会把 KCL 的“电荷守恒”混到这里。换路定则重点是储能元件状态量不能无条件瞬变。","memory":"换路看储能，储能不能凭空瞬变。","tag":"换路定则"},{"id":9,"chapter":"第一章《绪论》","type":"choice","q":"为了从信号中提取高频部分，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"C","principle":"高通滤波器允许高于截止频率的信号通过，抑制低频和直流成分。","why":"题目明确要提取高频部分，因此最直接对应高通滤波器。","mistake":"若题目说“只取某一个中间频段”，才更符合带通滤波器。","memory":"取高频 → 高通；取低频 → 低通。","tag":"滤波器"},{"id":10,"chapter":"第一章《绪论》","type":"choice","q":"为防止 50Hz 电网电压干扰混入信号之中，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"D","principle":"带阻滤波器会压制某一段频率，而允许该频段两侧的信号通过。阻带很窄时又常称为陷波器。","why":"50Hz 电网干扰是一个已知、固定附近频率的干扰，最典型的做法就是在 50Hz 附近设置带阻/陷波。","mistake":"直接用高通或低通虽然也可能压掉 50Hz，但往往会同时损失一大片有用频率。","memory":"去掉一个指定频率 → 带阻/陷波。","tag":"滤波器"},{"id":11,"chapter":"第一章《绪论》","type":"choice","q":"为获取信号中的直流成分，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"A","principle":"直流分量的频率就是 0Hz，属于最低频部分。","why":"低通滤波器允许直流和低频通过，并抑制较高频率，因此适合保留直流分量。","mistake":"高通滤波器恰恰会把直流成分滤掉。","memory":"DC = 0Hz，所以要低通。","tag":"滤波器"},{"id":12,"chapter":"第一章《绪论》","type":"choice","q":"收音机用于选台的滤波器应为（ ）。","options":["A. 低通滤波器","B. 高通滤波器","C. 带通滤波器","D. 带阻滤波器"],"answer":"C","principle":"不同电台占据不同的载波频率或频道频带。","why":"选台就是从许多频率中挑出目标频率附近的一小段，同时压制其它频率，所以使用带通滤波器。","mistake":"不是只保留所有高频或所有低频，而是只保留某一段。","memory":"选一个频道 → 选一个频带 → 带通。","tag":"滤波器"},{"id":13,"chapter":"第一章《绪论》","type":"choice","q":"下列关于滞回比较器的说法，不正确的是（ ）。","options":["A. 滞回比较器有两个门限电压","B. 构成滞回比较器的集成运放工作在线性区","C. 滞回比较器电路一定外加了正反馈","D. 滞回比较器的输出电压只有两种可能，即正的最大值或负的最大值"],"answer":"B","principle":"滞回比较器又叫施密特触发器，利用正反馈形成两个不同的翻转门限。","why":"比较器工作时输出通常快速进入正饱和或负饱和，属于非线性工作状态，并非线性放大区。因此 B 错。","mistake":"运放既可以做线性放大，也可以做比较器。只要做比较器，就通常不再满足线性区的虚短条件。","memory":"滞回比较器：正反馈、双门限、输出饱和。","tag":"比较器"},{"id":14,"chapter":"第一章《绪论》","type":"fill","q":"自然界的各种物理量必须首先经过 ______ 将非电量转换为电量，即 ______。","answers":[["传感器"],["电信号","电量信号"]],"display_answer":"传感器；电信号","principle":"测量系统不能直接处理温度、压力、位移、光强等许多非电物理量，通常先要将它们转换成可测量、可传输、可处理的电信号。","why":"传感器负责完成这种“非电量 → 电量”的转换。例如光电探测器把光强转换成电流或电压。","mistake":"这类基础填空通常标准答案是传感器。","memory":"先传感，再处理。","tag":"传感器"},{"id":15,"chapter":"第一章《绪论》","type":"fill","q":"信号在频域中表示的图形或曲线称为信号的 ______。","answers":[["频谱"]],"display_answer":"频谱","principle":"一个信号既可以从时间角度看，也可以从频率角度看。","why":"把信号拆解成不同频率成分后，用频率作为横坐标表示其幅度或相位，就得到频谱。","mistake":"波形通常指时域图；频谱才是频域图。","memory":"时域看波形，频域看频谱。","tag":"频谱"},{"id":16,"chapter":"第一章《绪论》","type":"fill","q":"通过傅立叶变换可以实现信号从 ______ 到频域的变换。","answers":[["时域"]],"display_answer":"时域","principle":"傅立叶变换是时域与频域之间最核心的数学桥梁之一。","why":"输入一个随时间变化的信号 x(t)，傅立叶变换得到 X(ω)，从而看出信号中包含哪些频率以及各自的强弱和相位。","mistake":"傅立叶正变换一般说时域到频域；逆傅立叶变换则是频域回到时域。","memory":"FT：时 → 频；IFT：频 → 时。","tag":"傅立叶变换"},{"id":17,"chapter":"第一章《绪论》","type":"fill","q":"各种信号各频率分量的 ______ 随角频率变化的分布，称为该信号的幅度频谱。","answers":[["幅度","振幅"]],"display_answer":"幅度","principle":"傅立叶变换结果一般可以写成幅度 + 相位的形式。","why":"其中各个频率分量的幅度 |X(ω)| 随 ω 的变化关系，就是幅度频谱。","mistake":"不要把幅度频谱和相位频谱混淆；一个看大小，一个看相位角。","memory":"幅度频谱看 |X(ω)|。","tag":"频谱"},{"id":18,"chapter":"第一章《绪论》","type":"fill","q":"各种信号各频率分量的 ______ 随角频率变化的分布，称为该信号的相位频谱。","answers":[["相位"]],"display_answer":"相位","principle":"频域中的每一个频率成分除了有大小，还具有相位信息。","why":"各频率分量的相位角 ∠X(ω) 随角频率 ω 的变化关系，就是相位频谱。","mistake":"只看幅度频谱无法完整描述一般信号，相位信息也会影响时域波形。","memory":"相位频谱看 ∠X(ω)。","tag":"频谱"},{"id":19,"chapter":"第一章《绪论》","type":"fill","q":"周期信号的频谱都由 ______、______以及______组成。","answers":[["直流分量"],["基波分量"],["无穷多项高次谐波分量","无穷多项高次谐波"]],"display_answer":"直流分量；基波分量；无穷多项高次谐波分量","principle":"周期信号可用傅里叶级数分解为直流分量、基波分量以及各次谐波分量。","why":"其中基波频率是原信号的基本频率，高次谐波频率为基波频率的整数倍。","mistake":"不要把“基波”和“高次谐波”混为一谈。","memory":"周期频谱：直流 + 基波 + 高次谐波。","tag":"信号频谱"},{"id":20,"chapter":"第一章《绪论》","type":"fill","q":"在时间上和幅值上均是连续的信号 ______。","answers":[["称为模拟信号","模拟信号"]],"display_answer":"称为模拟信号","principle":"时间连续、幅值连续是模拟信号的基本特征。","why":"模拟信号在时间轴上连续取值，幅值也连续变化。","mistake":"不要与数字信号混淆。","memory":"时间连续 + 幅值连续 → 模拟信号。","tag":"信号分类"},{"id":21,"chapter":"第一章《绪论》","type":"fill","q":"在时间上和幅值上均是离散的信号 ______。","answers":[["称为数字信号","数字信号"]],"display_answer":"称为数字信号","principle":"时间离散、幅值离散是数字信号的典型特征。","why":"数字系统通常以离散时刻和离散数值表示信息。","mistake":"只时间离散而幅值连续的信号不属于这里所说的典型数字信号定义。","memory":"时间离散 + 幅值离散 → 数字信号。","tag":"信号分类"},{"id":22,"chapter":"第一章《绪论》","type":"fill","q":"放大电路分为 ______、______、______以及______四类。","answers":[["电压放大电路"],["电流放大电路"],["互阻放大电路"],["互导放大电路"]],"display_answer":"电压放大电路；电流放大电路；互阻放大电路；互导放大电路","principle":"按输入输出信号的电压、电流关系，放大电路可分为四类基本模型。","why":"分别对应电压→电压、电流→电流、电流→电压和电压→电流的变换关系。","mistake":"互阻与互导的输入输出量方向容易记反。","memory":"电压放大、电流放大、互阻、互导。","tag":"放大电路"},{"id":23,"chapter":"第一章《绪论》","type":"fill","q":"______、______、______、______和______等主要性能指标是衡量放大电路的标准。","answers":[["输入电阻"],["输出电阻"],["增益"],["频率响应"],["非线性失真"]],"display_answer":"输入电阻；输出电阻；增益；频率响应；非线性失真","principle":"放大电路不能只看“放大多少”，还要考察输入输出特性、频率特性以及失真。","why":"这些指标共同反映放大电路的信号传输、带负载和保真能力。","mistake":"性能指标不只包括增益。","memory":"输入、输出、增益、频响、失真。","tag":"放大电路"},{"id":24,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的增益实际上反映了______的能力。","answers":[["电路在输入信号控制下，将供电电源能量转换为信号能量","将供电电源能量转换为信号能量"]],"display_answer":"电路在输入信号控制下，将供电电源能量转换为信号能量","principle":"放大并不是凭空产生能量，而是输入信号控制电路，把电源提供的能量转换到输出信号中。","why":"因此增益反映的是能量转换能力，而不是简单的“制造能量”。","mistake":"不要把放大理解成输出能量凭空增加。","memory":"放大：小信号控制电源能量。","tag":"放大电路"},{"id":25,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的电压增益和电流增益在工程上常用“分贝”表示，其表达式分别是 ______、______。","answers":[["20lg|Av|","20lgAv","20 lg|Av|","20lg|A_v|"],["20lg|Ai|","20lgAi","20 lg|Ai|","20lg|A_i|"]],"display_answer":"20lg|Av|；20lg|Ai|（dB）","principle":"电压增益和电流增益用分贝表示时采用20lg形式。","why":"电压、电流属于幅值量，分贝表达式为20倍常用对数；功率增益则使用10lg。","mistake":"不要把功率增益的10lg与电压、电流增益的20lg混淆。","memory":"电压/电流：20lg；功率：10lg。","tag":"增益与分贝"},{"id":26,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的频率响应指的是，在输入正弦信号情况下，输出随______的稳态响应。","answers":[["输入信号频率连续变化","输入信号频率","频率连续变化"]],"display_answer":"输入信号频率连续变化","principle":"频率响应描述放大电路在不同输入频率下的稳态输出特性。","why":"输入信号保持为正弦形式，只连续改变其频率，再观察输出如何变化。","mistake":"频率响应不是单纯指某一个固定频率下的输出。","memory":"改输入频率，看稳态输出。","tag":"频率响应"},{"id":27,"chapter":"第一章《绪论》","type":"fill","q":"幅频响应是指______之间的关系。","answers":[["电压增益的模与角频率","电压增益模与角频率"]],"display_answer":"电压增益的模与角频率","principle":"幅频响应关注增益幅值随角频率的变化。","why":"对复数电压增益取模，得到幅值，再观察它随ω的变化。","mistake":"相位随频率变化属于相频响应。","memory":"幅频看大小，相频看相位。","tag":"频率响应"},{"id":28,"chapter":"第一章《绪论》","type":"fill","q":"相频响应是指______之间的关系。","answers":[["放大电路输出与输入正弦电压信号的相位差与角频率","输出与输入正弦电压信号的相位差与角频率"]],"display_answer":"放大电路输出与输入正弦电压信号的相位差与角频率","principle":"相频响应描述输出相对于输入的相位差随角频率的变化。","why":"同一频率下，输入和输出可能存在相位超前或滞后；改变ω后观察这种相位差如何变化。","mistake":"不要把相位差和幅值变化混在一起。","memory":"相频看相位差随ω。","tag":"频率响应"},{"id":29,"chapter":"第一章《绪论》","type":"truefalse","q":"在一阶电路中，时间常数的大小不影响电路过渡过程持续的时间。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"一阶电路的时间常数τ直接决定过渡过程快慢。τ越大，达到稳态所需时间通常越长。","why":"时间常数不是只影响幅值，它还决定过渡过程的时间尺度。","mistake":"时间常数不是只影响幅值，它还决定过渡过程的时间尺度。","memory":"τ大 → 变化慢；τ小 → 变化快。","tag":"一阶电路"},{"id":30,"chapter":"第一章《绪论》","type":"truefalse","q":"三要素法可以计算一阶电路中各处的电压和电流。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"三要素法通过初始值、最终值和时间常数描述一阶电路响应。","why":"只要电路可等效为一阶动态电路，就可用三要素法求相关响应。","mistake":"只要电路可等效为一阶动态电路，就可用三要素法求相关响应。","memory":"三要素：初始值、最终值、时间常数。","tag":"一阶电路"},{"id":31,"chapter":"第一章《绪论》","type":"truefalse","q":"当两个线圈的耦合系数等于1时为全耦合。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"耦合系数k反映两个线圈磁耦合程度，k=1表示理想全耦合。","why":"此时一个线圈产生的磁通全部链过另一个线圈。","mistake":"此时一个线圈产生的磁通全部链过另一个线圈。","memory":"k=1 → 全耦合。","tag":"耦合电路"},{"id":32,"chapter":"第一章《绪论》","type":"truefalse","q":"无源线性二端口无论是否对称，Z参数中只有2个参数是独立的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"一般线性二端口的Z参数有4个参数；只有在满足互易、对称等附加条件时才可能减少独立参数。","why":"题目说“无论是否对称”过于绝对。","mistake":"题目说“无论是否对称”过于绝对。","memory":"一般二端口：4参数；附加条件才减少。","tag":"二端口网络"},{"id":33,"chapter":"第一章《绪论》","type":"truefalse","q":"非正弦周期量的有效值等于它各次谐波有效值之和。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"非正弦周期量的有效值应按各谐波有效值的平方和开方计算，而不是直接相加。","why":"不同谐波正交，不能把有效值直接做算术加法。","mistake":"不同谐波正交，不能把有效值直接做算术加法。","memory":"有效值：平方和开方。","tag":"非正弦周期量"},{"id":34,"chapter":"第一章《绪论》","type":"truefalse","q":"对称三相电路中，线电压与相电压相等。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"对称三相系统中，线电压与相电压的幅值通常相差√3，且存在30°相位差。","why":"不要把线量和相量直接等同。","mistake":"不要把线量和相量直接等同。","memory":"Y接：线电压=√3相电压。","tag":"三相电路"},{"id":35,"chapter":"第一章《绪论》","type":"truefalse","q":"空心变压器副边如接感性负载，则反映到原边的引入电抗一定呈容性。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"感性负载反映到原边仍表现为相应的感性性质，不会因为反映就必然变成容性。","why":"反射阻抗会按匝数比折算，性质不会无故从感性变为容性。","mistake":"反射阻抗会按匝数比折算，性质不会无故从感性变为容性。","memory":"感性负载 → 反射仍为感性。","tag":"变压器"},{"id":36,"chapter":"第一章《绪论》","type":"truefalse","q":"叠加定理只适用于线性电路求电压和电流，不适用于求功率。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"叠加定理适用于线性电路中的电压和电流响应，功率与电压、电流的平方有关，一般不能直接叠加。","why":"不能把各独立源单独作用得到的功率直接相加。","mistake":"不能把各独立源单独作用得到的功率直接相加。","memory":"叠加：电压、电流可叠加；功率不能直接叠加。","tag":"叠加定理"},{"id":37,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数仅与网络的结构和参数有关，与激励的函数形式无关。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"在线性时不变网络中，网络函数由网络结构和参数决定，而与具体激励信号形式无关。","why":"激励决定输出的具体波形，但网络函数本身是系统特性。","mistake":"激励决定输出的具体波形，但网络函数本身是系统特性。","memory":"网络函数看系统，不看具体激励。","tag":"网络函数"},{"id":38,"chapter":"第一章《绪论》","type":"truefalse","q":"当两互感线圈的电流同时流出同名端时，两个电流所产生的磁场是互相削弱的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"两个电流同时流出同名端时，其磁场作用属于助磁关系，而不是削弱。","why":"判断互感正负和助磁/反磁要结合同名端与电流方向。","mistake":"判断互感正负和助磁/反磁要结合同名端与电流方向。","memory":"同名端：同进或同出 → 助磁。","tag":"互感"},{"id":39,"chapter":"第一章《绪论》","type":"truefalse","q":"有效值、角频率和初相位称为正弦量的三要素。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"正弦量的三要素通常是最大值（或有效值）、角频率和初相位。题目把有效值列入三要素在有些教材表述中可成立，但本题按题库语境需结合原教材定义。","why":"如果教材把幅值用有效值表示，则需特别注意题库的原始定义。","mistake":"如果教材把幅值用有效值表示，则需特别注意题库的原始定义。","memory":"三要素核心：幅值、角频率、初相位。","tag":"正弦量"},{"id":40,"chapter":"第一章《绪论》","type":"truefalse","q":"电压、电流的参考方向可任意指定，指定的参考方向不同，不影响问题最后的结论。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"参考方向是分析电路时人为规定的正方向。只要整个计算过程保持一致，改变参考方向只会改变符号表示。","why":"参考方向改变后，相关量的正负号会相应变化，但物理结论不变。","mistake":"参考方向改变后，相关量的正负号会相应变化，但物理结论不变。","memory":"参考方向可任意选，但必须前后一致。","tag":"参考方向"},{"id":41,"chapter":"第一章《绪论》","type":"truefalse","q":"在使用节点电压法对电路做分析时，与电流源串联的电阻不计入自电导或互电导。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"理想电流源串联电阻时，外部端口电流由理想电流源确定，串联电阻不参与节点导纳关系。","why":"节点电压法建立的是节点电流与节点电压之间的导纳关系。","mistake":"节点电压法建立的是节点电流与节点电压之间的导纳关系。","memory":"理想电流源串联电阻：节点导纳计算中不计该电阻。","tag":"节点电压法"},{"id":42,"chapter":"第一章《绪论》","type":"truefalse","q":"一个实际的电感线圈，在任何情况下呈现的电特性都是感性的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"实际线圈存在寄生电容等因素，在一定高频条件下可能呈现容性。","why":"实际器件不是理想电感，频率升高后寄生参数会影响性质。","mistake":"实际器件不是理想电感，频率升高后寄生参数会影响性质。","memory":"实际电感：低频偏感性，高频可能转为容性。","tag":"实际电感"},{"id":43,"chapter":"第一章《绪论》","type":"truefalse","q":"某感性负载，电压的初相位一定小于电流的初相位，即U滞后于I。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"感性负载中电压超前电流，理想电感中电压超前电流90°。","why":"“感性”对应U领先I，而不是U滞后I。","mistake":"“感性”对应U领先I，而不是U滞后I。","memory":"感性：U超前I。","tag":"正弦交流电路"},{"id":44,"chapter":"第一章《绪论》","type":"truefalse","q":"中线的作用就是使不对称Y接负载的端电压保持对称。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"三相四线制中，中线可以提供不对称负载的零序电流通路，使各相端电压保持对称。","why":"不对称Y接负载没有可靠中性点时，各相端电压可能发生偏移。","mistake":"不对称Y接负载没有可靠中性点时，各相端电压可能发生偏移。","memory":"中线：稳定不对称Y接负载的相电压。","tag":"三相电路"},{"id":45,"chapter":"第一章《绪论》","type":"truefalse","q":"负载作星形连接时，必有线电流等于相电流。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"星形连接中，每条线与对应相负载串联，因此线电流就是相电流。","why":"这是星形连接电流关系的基本特点。","mistake":"这是星形连接电流关系的基本特点。","memory":"Y接：I线=I相。","tag":"三相电路"},{"id":46,"chapter":"第一章《绪论》","type":"truefalse","q":"两个串联互感线圈的感应电压极性，取决于电流流向，与同名端无关。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"互感电压极性不仅与电流变化方向有关，还必须根据同名端判断正负。","why":"忽略同名端会导致互感项正负号判断错误。","mistake":"忽略同名端会导致互感项正负号判断错误。","memory":"互感极性：电流方向 + 同名端共同决定。","tag":"互感"},{"id":47,"chapter":"第一章《绪论》","type":"truefalse","q":"不同频率的电压和电流不能构成平均功率，也不能构成瞬时功率。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"任意时刻电压和电流都可以相乘得到瞬时功率p(t)=u(t)i(t)。不同频率信号的平均功率还要结合具体波形和平均区间判断。","why":"不能因为频率不同就否定瞬时功率的定义。","mistake":"不能因为频率不同就否定瞬时功率的定义。","memory":"瞬时功率永远看p(t)=u(t)i(t)。","tag":"功率"},{"id":48,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数分母部分多项式等于零的根，称为网络函数的极点，它恰好为网络的固有频率。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"网络函数的极点是其分母多项式的根，并与系统的自然响应、固有模态密切相关。","why":"零点来自分子，极点来自分母。","mistake":"零点来自分子，极点来自分母。","memory":"分母根 → 极点。","tag":"网络函数"},{"id":49,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数的原函数即为该电路的单位冲激响应。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"在线性时不变网络的零初始条件下，网络函数与单位冲激响应的拉普拉斯变换互为对应关系。","why":"网络函数是冲激响应的拉普拉斯变换，反变换可得到冲激响应。","mistake":"网络函数是冲激响应的拉普拉斯变换，反变换可得到冲激响应。","memory":"H(s) ↔ h(t)，反变换得到冲激响应。","tag":"网络函数"},{"id":50,"chapter":"第二章《运算放大器》","type":"choice","q":"为了工作在线性工作区，应使集成运放电路处于（ ）状态。","options":["A. 正反馈","B. 负反馈","C. 正反馈或无反馈","D. 负反馈或无反馈"],"answer":"B","principle":"集成运放要在线性放大区稳定工作，通常必须引入负反馈。","why":"负反馈把输出的一部分送回输入端并抵消输入变化，使运放不易进入饱和，从而保持线性放大关系。","mistake":"正反馈会强化输入差值，常用于比较、迟滞等非线性电路。","memory":"线性区 → 负反馈。","tag":"运放工作区"},{"id":51,"chapter":"第二章《运算放大器》","type":"choice","q":"为了工作在非线性区，应使集成运放电路处于（ ）状态。","options":["A. 正反馈","B. 负反馈","C. 正反馈或无反馈","D. 负反馈或无反馈"],"answer":"C","principle":"集成运放的非线性应用通常工作在开环（无反馈）或正反馈状态。","why":"此时运放很容易因极小的输入差模电压而进入正、负饱和，输出不再与输入保持线性比例关系。","mistake":"不要把线性区的负反馈条件套到比较器等非线性电路。","memory":"非线性区 → 正反馈或无反馈。","tag":"运放工作区"},{"id":52,"chapter":"第二章《运算放大器》","type":"choice","q":"关于理想集成运放的输入电阻和输出电阻论述正确的是（ ）","options":["A. 输入电阻为∞，输出电阻为0","B. 输入电阻为0，输出电阻为∞","C. 输入电阻和输出电阻均为∞","D. 输入电阻和输出电阻均为0"],"answer":"A","principle":"理想运放的输入电阻趋于无穷大，输出电阻趋于零。","why":"输入电阻无限大意味着输入端几乎不吸收电流；输出电阻为零意味着输出电压不受负载电流影响。","mistake":"输入电阻与输出电阻的理想化方向正好相反。","memory":"输入∞，输出0。","tag":"理想运放"},{"id":53,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运算放大器能处理（ ）","options":["A. 直流信号","B. 交流信号","C. 交流信号和直流信号"],"answer":"C","principle":"集成运放通常采用直接耦合结构，因此既能放大直流信号，也能处理交流信号。","why":"没有隔直电容限制时，从零频到一定高频范围内的信号都可以被运放处理。","mistake":"不要把运放只理解成交流放大器。","memory":"运放：交、直流都能处理。","tag":"运放基本特性"},{"id":54,"chapter":"第二章《运算放大器》","type":"choice","q":"为使电路输入电阻高、输出电阻低，应引入（ ）","options":["A. 电压串联负反馈","B. 电压并联负反馈","C. 电流串联负反馈","D. 电流并联负反馈"],"answer":"A","principle":"串联负反馈提高输入电阻；电压负反馈降低输出电阻。","why":"要同时得到高输入电阻和低输出电阻，应选择“电压串联负反馈”。","mistake":"可把反馈类型拆成两部分判断：串联/并联决定输入电阻，电压/电流决定输出电阻。","memory":"高入低出 → 电压串联负反馈。","tag":"负反馈"},{"id":55,"chapter":"第二章《运算放大器》","type":"choice","q":"在由运放组成的电路中，运放工作在非线性状态的电路是（ ）","options":["A. 反相放大器","B. 差值放大器","C. 有源滤波器","D. 电压比较器"],"answer":"D","principle":"电压比较器通常让运放工作在开环或正反馈状态，属于非线性应用。","why":"比较器输出主要取正、负饱和值，不再与输入按固定比例变化。","mistake":"反相放大、差值放大、有源滤波通常利用负反馈在线性区工作。","memory":"比较器 → 非线性。","tag":"非线性应用"},{"id":56,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放工作在线性放大区，由理想工作条件得出两个重要规律是（ ）","options":["A. U+=U−=0，i+=i−","B. U+=U−=0，i+=i−=0","C. U+=U−，i+=i−=0","D. U+=U−=0，i+≠i−"],"answer":"C","principle":"理想运放在线性区满足“虚短”和“虚断”。","why":"开环增益趋于无穷大且输出有限，所以两输入端电压近似相等；输入电阻趋于无穷大，所以两个输入端电流近似为零。","mistake":"虚短只是 U+≈U−，并不意味着两个输入端都一定为0；只有特定电路中才会出现虚地。","memory":"线性理想运放：U+=U−，i+=i−=0。","tag":"虚短虚断"},{"id":57,"chapter":"第二章《运算放大器》","type":"choice","q":"分析集成运放的非线性应用电路时，不能使用的概念是（ ）","options":["A. 虚地","B. 虚短","C. 虚断"],"answer":"B","principle":"“虚短”成立的前提是运放工作在线性区，并且通常存在深度负反馈。","why":"非线性区中输出可能已经饱和，输入端电压不再近似相等，因此不能使用虚短。输入端电流仍近似为零，所以虚断仍可用。","mistake":"不要把虚短、虚断当成所有运放电路都同时成立。","memory":"非线性：可虚断，不可虚短。","tag":"虚短虚断"},{"id":58,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放的线性应用存在（ ）现象。","options":["A. 虚地","B. 虚断","C. 虚断和虚短"],"answer":"C","principle":"理想运放在线性负反馈条件下同时满足虚断和虚短。","why":"输入电阻趋于无穷大形成虚断；开环增益趋于无穷大且输出有限形成虚短。","mistake":"“虚地”只是在某些具体电路中由虚短进一步得到，不是所有线性应用都有。","memory":"线性应用：虚断＋虚短。","tag":"虚短虚断"},{"id":59,"chapter":"第二章《运算放大器》","type":"choice","q":"非线性应用存在（ ）现象。","options":["A. 虚地","B. 虚断","C. 虚断和虚短"],"answer":"B","principle":"理想运放即使工作在非线性区，输入电阻仍可近似无穷大。","why":"因此输入端电流仍近似为零，即存在虚断；但由于不再处于线性放大状态，虚短不成立。","mistake":"比较器等非线性电路中不能套用 U+≈U−。","memory":"非线性：只保留虚断。","tag":"虚短虚断"},{"id":60,"chapter":"第二章《运算放大器》","type":"choice","q":"理想运放的两个重要结论是（ ）","options":["A. 虚短与虚地","B. 虚断与虚短","C. 断路与短路"],"answer":"B","principle":"理想运放在线性区分析中最常用的两个结论是虚短和虚断。","why":"虚短描述两输入端电压近似相等；虚断描述两个输入端电流近似为零。","mistake":"虚地不是普遍结论，只出现在某些具体拓扑中。","memory":"理想运放两结论：虚短、虚断。","tag":"虚短虚断"},{"id":61,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放一般分为两个工作区，它们分别是（ ）","options":["A. 正反馈与负反馈","B. 线性与非线性","C. 虚断和虚短"],"answer":"B","principle":"按输入输出关系，集成运放通常分为线性工作区和非线性工作区。","why":"在线性区输出与输入保持近似线性关系；在非线性区输出通常趋向饱和值。","mistake":"正反馈、负反馈是反馈方式，不是工作区名称。","memory":"运放两区：线性、非线性。","tag":"运放工作区"},{"id":62,"chapter":"第二章《运算放大器》","type":"choice","q":"有两个空载放大倍数相同，输入和输出电阻不同的放大器甲和乙，对同一信号源进行放大，在负载开路的情况下，测得甲的输出电压小，这说明甲的（ ）","options":["A. 输入电阻大","B. 输入电阻小","C. 输出电阻大","D. 输出电阻小"],"answer":"B","principle":"负载开路时，输出端几乎不受输出电阻影响，实际输出大小主要取决于信号源与放大器输入电阻之间的分压。","why":"两者空载电压增益相同而甲输出更小，说明甲从信号源取得的输入电压更小，即甲的输入电阻更小、对信号源负载作用更强。","mistake":"题目已经说明负载开路，因此不能优先从输出电阻差异解释。","memory":"空载比较输出 → 看输入端分压。","tag":"输入输出电阻"},{"id":63,"chapter":"第二章《运算放大器》","type":"fill","q":"理想运算放大器的性能参数均被理想化，即输入电阻为 ______，输出电阻为 ______，开环电压增益为 ______，输出电压为 ______。","answers":[["∞","无穷大","无穷"],["0","零"],["∞","无穷大","无穷"],["有限值","有限","有限的值"]],"display_answer":"∞；0；∞；有限值","principle":"理想运放常取输入电阻趋于无穷大、输出电阻趋于零、开环电压增益趋于无穷大。在线性工作条件下，输出电压应为有限值。","why":"正因为开环增益趋于无穷大而输出仍是有限值，差模输入电压必须趋近于0，从而得到“虚短”；输入电阻趋于无穷大则得到“虚断”。","mistake":"最后一空不是说理想运放的输出一定为无穷大；在线性分析中输出是有限值。","memory":"输入∞、输出0、增益∞、输出有限。","tag":"理想运放"},{"id":64,"chapter":"第二章《运算放大器》","type":"fill","q":"运算放大器有两个工作区。在 ______ 区工作时，放大器放大小信号；当输入为大信号时，它工作在 ______ 区，输出电压扩展到 ______。","answers":[["线性","线性区"],["非线性","非线性区"],["正负饱和电压","正、负饱和电压","正负饱和值","正、负饱和值","正负饱和电压值"]],"display_answer":"线性；非线性；正、负饱和电压","principle":"小信号且有适当负反馈时，运放通常工作在线性区；输入过大后会离开线性区进入饱和。","why":"进入非线性区后，输出电压不再按比例增大，而是接近正、负饱和电压。","mistake":"输出达到饱和后再增加输入，并不会继续按原增益放大。","memory":"小信号线性，大信号非线性，输出到饱和。","tag":"运放工作区"},{"id":65,"chapter":"第二章《运算放大器》","type":"fill","q":"运算放大器工作在线性区时，具有 ______ 和 ______ 两个特点，凡是线性电路都可以利用这两个概念来分析电路的输入、输出关系。","answers":[["虚短"],["虚断"]],"display_answer":"虚短；虚断","principle":"理想运放在线性区的核心分析规则是虚短和虚断。","why":"虚短表示两输入端电位近似相等，虚断表示输入端电流近似为零。","mistake":"顺序不影响理解，但答题时按教材顺序填写更稳妥。","memory":"线性运放：虚短＋虚断。","tag":"虚短虚断"},{"id":66,"chapter":"第二章《运算放大器》","type":"fill","q":"反相比例运算电路中集成运放反相输入端为 ______ 点，而同相比例运算电路中集成运放两个输入端对地的电压基本上 ______。","answers":[["虚地","虚地点"],["相等","相同","相等的"]],"display_answer":"虚地；相等","principle":"反相比例电路的同相端接地，在虚短条件下反相端电位也近似为0，因此形成虚地；同相比例电路两输入端满足虚短。","why":"虚地并不是实际接地，只是电位近似为0。","mistake":"虚地≠真实接地，反相输入端与地之间没有直接导线连接。","memory":"反相端常见虚地；同相比例两端电压相等。","tag":"比例运算"},{"id":67,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 比例运算电路的输入电流等于零，而 ______ 比例运算电路的输入电流等于流过反馈电阻的电流。","answers":[["同相","同相比例"],["反相","反相比例"]],"display_answer":"同相；反相","principle":"同相比例运算的信号直接加在运放同相输入端，理想运放输入端电流为0；反相比例运算中电流经输入电阻流入虚地点，并通过反馈电阻流走。","why":"反相端本身不吸收电流，因此根据KCL，输入支路电流等于反馈支路电流。","mistake":"“运放输入端电流为0”不等于反相电路的输入电阻中没有电流。","memory":"同相输入端不取流；反相输入流=反馈流。","tag":"比例运算"},{"id":68,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 运算电路的电压增益 Au≥1；______ 运算电路的电压增益 Au<0。","answers":[["同相比例","同相"],["反相比例","反相"]],"display_answer":"同相比例；反相比例","principle":"同相比例运算的闭环电压增益为 1+Rf/R1，因此至少为1；反相比例运算的闭环增益为 −Rf/R1，因此小于0。","why":"增益符号反映输出与输入的相位关系：反相电路输出与输入相反。","mistake":"Au<0不是说幅值小于0，而是表示相位反相。","memory":"同相≥1；反相<0。","tag":"比例运算"},{"id":69,"chapter":"第二章《运算放大器》","type":"fill","q":"反相求和运算电路中集成运放的反相输入端为虚地点，流过反馈电阻的电流等于各输入端电流的 ______。","answers":[["代数和","代数之和"]],"display_answer":"代数和","principle":"反相输入端为虚地点且运放输入端近似不吸收电流，因此可直接对该节点列KCL。","why":"各输入支路电流汇聚到反相输入节点后都流经反馈支路，所以反馈电流等于各输入电流的代数和。","mistake":"如果定义的电流参考方向不同，应按代数关系处理，不能只看数值大小相加。","memory":"反相求和：反馈电流=各输入电流代数和。","tag":"求和运算"},{"id":70,"source_no":21,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 比例运算电路的输入电阻大，而 ______ 比例运算电路的输入电阻小。","answers":[["同相","同相比例","同相比例运算"],["反相","反相比例","反相比例运算"]],"display_answer":"同相；反相","principle":"同相比例运算电路的信号直接加到运放同相输入端，理想运放输入电阻很大；反相比例运算电路的输入端通过输入电阻接到虚地点，等效输入电阻主要由输入电阻决定。","why":"因此同相比例运算电路输入电阻大，而反相比例运算电路输入电阻相对小。","mistake":"不要把“运放本身输入电阻很大”和“整个闭环电路的输入电阻”混为一谈。","memory":"同相高输入，反相看输入电阻。","tag":"比例运算"},{"id":71,"source_no":22,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 运算电路可实现函数 Y=aX1+bX2+cX3，a、b 和 c 均小于零。","answers":[["反相求和","反相求和运算","反相加法","反相加法运算"]],"display_answer":"反相求和","principle":"反相求和运算电路的输出是各输入量按电阻比加权后的负和。","why":"其典型形式为 Y=-(k1X1+k2X2+k3X3)，因此各输入项系数都为负。","mistake":"若系数为正，需要进一步采用反相级或其他加法结构。","memory":"系数全负 → 反相求和。","tag":"求和运算"},{"id":72,"source_no":23,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 运算电路可将三角波电压转换成方波电压；______ 运算电路可将方波电压转换成三角波电压。","answers":[["微分","微分运算"],["积分","积分运算"]],"display_answer":"微分；积分","principle":"三角波各线性斜坡段的导数为常量，因此微分后得到正、负恒定电平；方波积分后则得到线性上升或下降的斜坡。","why":"所以三角波经过微分电路可得到方波，方波经过积分电路可得到三角波。","mistake":"最容易把微分和积分的转换方向记反。","memory":"三角→微分→方；方→积分→三角。","tag":"积分与微分"},{"id":73,"source_no":24,"chapter":"第二章《运算放大器》","type":"fill","q":"集成运算放大器工作在线性区时，两输入端的电位可以近似为 U+ ______ U−。","answers":[["≈","=","近似等于","等于"]],"display_answer":"≈","principle":"理想运放在线性负反馈状态下具有“虚短”特性。","why":"开环增益极大而输出保持有限，因此差模输入电压必须趋近于零，即 U+≈U−。","mistake":"这里是电位近似相等，并不表示两个输入端真正短接。","memory":"虚短：U+≈U−。","tag":"虚短"},{"id":74,"source_no":25,"chapter":"第二章《运算放大器》","type":"fill","q":"理想运算放大器的“虚短”和“虚断”的概念，就是流进运放的电流为 ______，两个输入端的电压为 ______，为保证运放工作在线性状态，必须引入 ______ 反馈。","answers":[["0","零"],["相等","近似相等","相同"],["负","负反馈"]],"display_answer":"0；相等；负","principle":"理想运放输入电阻趋于无穷大，因此输入电流近似为零；在线性负反馈条件下，两输入端电位近似相等。","why":"负反馈把运放稳定在线性放大区，从而可同时使用虚短和虚断。","mistake":"虚短成立需要线性工作条件；非线性区不能直接套用虚短。","memory":"虚断：I+=I−=0；虚短：U+=U−；线性靠负反馈。","tag":"虚短虚断"},{"id":75,"source_no":26,"chapter":"第二章《运算放大器》","type":"fill","q":"为了工作在线性工作区，应使集成运放电路处于 ______ 状态；为了工作在非线性区，应使集成运放电路处于 ______ 状态。","answers":[["负反馈"],["正反馈或无反馈","无反馈或正反馈","正反馈或开环","开环或正反馈"]],"display_answer":"负反馈；正反馈或无反馈","principle":"负反馈通常使运放稳定在线性区；正反馈或开环工作时，运放容易进入饱和，属于非线性应用。","why":"这也是线性运算电路和比较器等非线性电路的基本区别。","mistake":"无反馈就是开环状态。","memory":"线性负反馈；非线性正反馈/开环。","tag":"运放工作区"},{"id":76,"source_no":27,"chapter":"第二章《运算放大器》","type":"fill","q":"输入电阻很大的运算电路是 ______ 比例运算放大器，电路中引入的是 ______ 负反馈。","answers":[["同相","同相比例"],["电压串联","电压串联负反馈"]],"display_answer":"同相；电压串联","principle":"同相比例运算电路采用电压串联负反馈。","why":"串联反馈能够提高输入电阻，电压反馈能够降低输出电阻，因此同相比例运算放大器具有较大的输入电阻。","mistake":"反相比例运算电路的输入端通过电阻接虚地，输入电阻通常约等于输入电阻本身。","memory":"同相比例 → 电压串联负反馈 → 输入电阻大。","tag":"负反馈"},{"id":77,"source_no":28,"chapter":"第二章《运算放大器》","type":"fill","q":"电压比较器中的集成运放通常工作在 ______ 区，电路工作在 ______ 状态或引入 ______ 反馈。","answers":[["非线性","非线性区"],["开环","无反馈"],["正","正反馈"]],"display_answer":"非线性；开环；正","principle":"电压比较器利用运放很大的开环增益，使输出快速进入高、低饱和状态。","why":"因此比较器属于非线性应用，通常采用开环结构，或用正反馈构成具有迟滞特性的比较器。","mistake":"比较器不使用线性负反馈的虚短条件。","memory":"比较器：非线性、开环或正反馈。","tag":"电压比较器"},{"id":78,"source_no":29,"chapter":"第二章《运算放大器》","type":"fill","q":"在模拟运算电路时，集成运算放大器工作在 ______ 区，而在比较器电路中，集成运算放大器工作在 ______ 区。","answers":[["线性","线性区"],["非线性","非线性区"]],"display_answer":"线性；非线性","principle":"模拟运算要求输出与输入保持确定的线性运算关系，因此运放工作在线性区；比较器只判断输入大小关系，输出通常饱和。","why":"这两个工作区分别对应负反馈运算电路和开环/正反馈比较器。","mistake":"不要把“运算放大器”这个器件名称误认为它在所有电路里都工作在线性区。","memory":"运算→线性；比较→非线性。","tag":"运放工作区"},{"id":79,"source_no":30,"chapter":"第二章《运算放大器》","type":"fill","q":"过零比较器可将正弦波变为 ______ 波，积分器可将方波变为 ______ 波。","answers":[["方","方波","矩形","矩形波"],["三角","三角波"]],"display_answer":"方波；三角波","principle":"过零比较器根据正弦输入的正负极性切换输出高低电平；积分器对方波的恒定正负电平积分形成线性斜坡。","why":"所以正弦波经过过零比较器形成方波，方波经过积分器形成三角波。","mistake":"积分器不是把正弦波直接变成方波。","memory":"正弦→比较→方波；方波→积分→三角波。","tag":"比较与积分"},{"id":80,"source_no":31,"chapter":"第二章《运算放大器》","type":"truefalse","q":"在运算电路中，同相输入端和反相输入端均为“虚地”。","options":["A. 对","B. 错"],"answer":"B","principle":"“虚地”是特定电路条件下产生的节点特性，并不是运放两个输入端的普遍状态。","why":"在线性区只能普遍得到两输入端电位近似相等；只有当其中一端实际接地时，另一端才可能因虚短而成为虚地。","mistake":"虚短不等于虚地。","memory":"虚短是两端相等；虚地还要求参考端接地。","tag":"判断题"},{"id":81,"source_no":32,"chapter":"第二章《运算放大器》","type":"truefalse","q":"运算电路中一般均引入负反馈。","options":["A. 对","B. 错"],"answer":"A","principle":"常见模拟运算电路需要运放工作在线性区，因此通常采用负反馈。","why":"负反馈稳定闭环增益，并使虚短条件成立，从而实现比例、加减、积分、微分等运算关系。","mistake":"比较器等非线性应用不是这里所说的线性运算电路。","memory":"线性运算通常靠负反馈。","tag":"判断题"},{"id":82,"source_no":33,"chapter":"第二章《运算放大器》","type":"truefalse","q":"电压比较器的阈值电压是使集成运放同相输入端电位和反相输入端电位相等的输入电压。","options":["A. 对","B. 错"],"answer":"A","principle":"比较器输出发生翻转的临界条件是两输入端电位相等。","why":"使 U+=U− 时对应的输入电压就是比较器的阈值电压。","mistake":"阈值电压不是输出的饱和电压。","memory":"比较器翻转临界：U+=U−。","tag":"判断题"},{"id":83,"source_no":34,"chapter":"第二章《运算放大器》","type":"truefalse","q":"电压比较器电路中集成运放的净输入电流为零。","options":["A. 对","B. 错"],"answer":"A","principle":"理想运放输入电阻趋于无穷大，因此输入端电流近似为零。","why":"这一“虚断”性质与运放是否工作在线性区无关，所以在比较器中也可近似认为输入电流为零。","mistake":"非线性区失效的是虚短，不是虚断。","memory":"比较器仍可用虚断。","tag":"判断题"},{"id":84,"source_no":35,"chapter":"第二章《运算放大器》","type":"truefalse","q":"集成运放在开环情况下，一定工作在非线性区。","options":["A. 对","B. 错"],"answer":"A","principle":"集成运放开环增益极高，实际应用中极小的差模输入就会使输出进入正或负饱和。","why":"因此教材分析通常把开环运放归入非线性工作状态，用作比较器等电路。","mistake":"线性放大通常需要负反馈限制闭环增益。","memory":"开环高增益 → 易饱和 → 非线性。","tag":"判断题"},{"id":85,"source_no":36,"chapter":"第二章《运算放大器》","type":"truefalse","q":"当集成运放工作在非线性区时，输出电压不是高电平，就是低电平。","options":["A. 对","B. 错"],"answer":"A","principle":"运放非线性应用中输出通常处于正、负饱和值附近。","why":"在比较器模型中可把这两个饱和值视为高电平和低电平。","mistake":"这不同于线性区中输出随输入连续变化。","memory":"非线性输出：高/低两态。","tag":"判断题"},{"id":86,"source_no":37,"chapter":"第二章《运算放大器》","type":"truefalse","q":"一般情况下，在电压比较器中，集成运放不是工作在开环状态，就是仅仅引入了正反馈。","options":["A. 对","B. 错"],"answer":"A","principle":"基本电压比较器常采用开环结构，迟滞比较器则通过正反馈改变翻转阈值。","why":"两种情况都使运放工作在非线性区，而不是采用线性负反馈。","mistake":"正反馈在比较器中不是为了线性放大，而是为了形成迟滞或加速翻转。","memory":"比较器：开环或正反馈。","tag":"判断题"},{"id":87,"source_no":38,"chapter":"第二章《运算放大器》","type":"truefalse","q":"凡是运算电路都可以利用“虚短”和“虚断”的概念求解运算关系。","options":["A. 对","B. 错"],"answer":"A","principle":"本章所称运算电路是在线性负反馈条件下工作的比例、求和、积分、微分等模拟运算电路。","why":"这些电路在线性区满足理想运放的虚短、虚断条件，因此可据此建立输入输出运算关系。","mistake":"不要把比较器等非线性应用混入这里的“运算电路”概念。","memory":"线性运算电路：虚短＋虚断。","tag":"判断题"},{"id":88,"source_no":39,"chapter":"第二章《运算放大器》","type":"truefalse","q":"电压比较器的阈值电压是使集成运放同相输入端电位和反相输入端电位相等的输入电压。","options":["A. 对","B. 错"],"answer":"A","principle":"阈值电压对应比较器输出状态即将发生转换的临界输入。","why":"在翻转临界点，两输入端电位相等，即 U+=U−。","mistake":"这道题与第33题考查同一概念。","memory":"阈值：U+=U−时的输入电压。","tag":"判断题"},{"id":89,"source_no":1,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"发光二极管正常工作时，外加（ ）电压。","options":["A. 正向","B. 反向","C. 击穿"],"answer":"A","principle":"发光二极管正常发光需要PN结正向导通。","why":"正向偏置时载流子复合释放能量并发光。","mistake":"反向偏置通常不能作为LED的正常工作方式。","memory":"LED正常工作：正向偏置。","tag":"发光二极管"},{"id":90,"source_no":2,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"光电二极管正常工作时，外加（ ）电压。","options":["A. 正向","B. 反向","C. 击穿"],"answer":"B","principle":"光电二极管通常工作在反向偏置状态。","why":"反向偏置可扩大耗尽层并有利于光生载流子的快速分离和收集。","mistake":"不要与发光二极管的正向工作方式混淆。","memory":"光电二极管：反向偏置。","tag":"光电二极管"},{"id":91,"source_no":3,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"某只硅稳压管的稳定电压 VZ=4V，其两端施加的电压分别为 +5V（正向偏置）和 -5V（反向偏置）时，稳压管两端的最终电压分别为（ ）","options":["A. +5V和-5V","B. -5V和+4V","C. +4V和-0.7V","D. +0.7V和-4V"],"answer":"D","principle":"硅二极管正向导通压降约0.7V；稳压管在反向击穿区电压稳定在稳压值附近。","why":"正向偏置时表现为普通硅二极管，约0.7V；反向电压超过4V后进入稳压区，约为-4V。","mistake":"稳压值4V只对应反向击穿状态。","memory":"正向0.7V，反向稳压VZ。","tag":"稳压二极管"},{"id":92,"source_no":4,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"当环境温度升高时，二极管的反向饱和电流 IS 将增大，这是因为此时 PN 结内部的（ ）","options":["A. 多数载流子浓度增大","B. 少数载流子浓度增大","C. 多数载流子浓度减小","D. 少数载流子浓度减小"],"answer":"B","principle":"反向饱和电流主要由少数载流子形成，并对温度十分敏感。","why":"温度升高会增强本征激发，使少数载流子浓度明显增加，因此IS增大。","mistake":"反向饱和电流不是由多数载流子决定。","memory":"温度↑ → 少子↑ → IS↑。","tag":"PN结温度特性"},{"id":93,"source_no":5,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"用万用表测二极管的正、反向电阻来判断二极管的好坏，好的管子应为（ ）","options":["A. 正、反向电阻相等","B. 正向电阻大，反向电阻小","C. 反向电阻比正向电阻大很多倍","D. 正、反向电阻都等于无穷大"],"answer":"C","principle":"正常二极管具有明显的单向导电性。","why":"正向电阻应较小，反向电阻应很大，因此反向电阻远大于正向电阻。","mistake":"正反都无穷大通常说明开路。","memory":"好二极管：正小反大。","tag":"二极管检测"},{"id":94,"source_no":6,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"二极管的伏安特性曲线的正向部分在环境温度升高时将（ ）","options":["A. 右移","B. 左移","C. 上移","D. 下移"],"answer":"B","principle":"二极管正向压降具有负温度系数。","why":"温度升高后，在相同正向电流下所需正向电压降低，所以曲线向左移动。","mistake":"不要把反向电流增大与正向曲线的横向移动混淆。","memory":"温度↑，正向压降↓，曲线左移。","tag":"二极管温度特性"},{"id":95,"source_no":7,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"当外加偏置电压不变时，若工作温度升高，二极管的正向导通电流将（ ）","options":["A. 增大","B. 减小","C. 不变","D. 不确定"],"answer":"A","principle":"升温会使二极管在同一正向电压下更容易导通。","why":"正向压降随温度上升而降低，因此固定正向电压时电流会增大。","mistake":"固定电压与固定电流两种条件下的温度效应不要混淆。","memory":"固定正向电压，温度↑ → 电流↑。","tag":"二极管温度特性"},{"id":96,"source_no":8,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"半导体中的空穴和自由电子数相等，这样的半导体称为（ ）","options":["A. P型半导体","B. N型半导体","C. 本征半导体"],"answer":"C","principle":"纯净本征半导体中电子-空穴对成对产生。","why":"因此热平衡下自由电子浓度和空穴浓度相等。","mistake":"P型和N型属于掺杂半导体，多数、少数载流子浓度不相等。","memory":"本征：电子数=空穴数。","tag":"本征半导体"},{"id":97,"source_no":9,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"P型半导体是在本征半导体中加入微量的（ ）价元素构成的。","options":["A. 三价","B. 四价","C. 五价","D. 六价"],"answer":"A","principle":"P型半导体由本征半导体掺入三价受主杂质形成。","why":"三价元素少一个价电子，形成空穴作为多数载流子。","mistake":"五价杂质形成N型半导体。","memory":"P型掺三价。","tag":"杂质半导体"},{"id":98,"source_no":10,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"P型半导体中的多数载流子是（ ）","options":["A. 电子","B. 空穴","C. 电子和空穴"],"answer":"B","principle":"P型半导体以空穴为多数载流子。","why":"三价受主杂质使价带中产生大量空穴。","mistake":"P型整体仍然电中性。","memory":"P：多子空穴。","tag":"P型半导体"},{"id":99,"source_no":11,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"N型半导体中的多数载流子是（ ）","options":["A. 电子","B. 空穴","C. 电子和空穴"],"answer":"A","principle":"N型半导体以自由电子为多数载流子。","why":"五价施主杂质提供额外自由电子。","mistake":"N型并不带负电，整体仍保持电中性。","memory":"N：多子电子。","tag":"N型半导体"},{"id":100,"source_no":12,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"在本征半导体中掺入微量的（ ）价元素，形成N型半导体。","options":["A. 二","B. 三","C. 四","D. 五"],"answer":"D","principle":"N型半导体通过掺入五价施主杂质形成。","why":"五价元素与四价硅形成共价键后会多出一个容易成为自由电子的价电子。","mistake":"三价元素形成P型。","memory":"N型掺五价。","tag":"杂质半导体"},{"id":101,"source_no":13,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"在P型半导体中，自由电子浓度（ ）空穴浓度。","options":["A. 大于","B. 等于","C. 小于"],"answer":"C","principle":"P型半导体中空穴是多数载流子，电子是少数载流子。","why":"因此自由电子浓度小于空穴浓度。","mistake":"P型只是载流子浓度不对称，整体并不带正电。","memory":"P型：p>n。","tag":"P型半导体"},{"id":102,"source_no":14,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"本征半导体温度升高以后，（ ）","options":["A. 自由电子增多，空穴数基本不变","B. 空穴数增多，自由电子数基本不变","C. 自由电子数和空穴数都增多，且数目相同","D. 自由电子数和空穴数都不变"],"answer":"C","principle":"本征激发会成对产生自由电子和空穴。","why":"温度升高使本征激发增强，电子-空穴对增多，两者数目仍相等。","mistake":"不是只增加一种载流子。","memory":"本征升温：电子、空穴等量增加。","tag":"本征半导体"},{"id":103,"source_no":15,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"空间电荷区是由（ ）构成的。","options":["A. 电子","B. 空穴","C. 离子","D. 分子"],"answer":"C","principle":"PN结耗尽区内可移动载流子大量扩散后，留下固定的离化杂质离子。","why":"这些不能自由移动的正、负离子形成空间电荷区和内建电场。","mistake":"空间电荷区不是由大量自由电子或空穴组成。","memory":"耗尽层主要是固定离子。","tag":"PN结"},{"id":104,"source_no":16,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"PN结加正向电压时，空间电荷区将（ ）","options":["A. 变窄","B. 基本不变","C. 变宽","D. 无法确定"],"answer":"A","principle":"正向偏置降低PN结势垒。","why":"外加电场抵消部分内建电场，使耗尽层宽度减小。","mistake":"反向偏置才会使空间电荷区变宽。","memory":"正偏变窄，反偏变宽。","tag":"PN结"},{"id":105,"source_no":17,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"稳压管的稳压区是其工作在（ ）","options":["A. 正向导通","B. 反向截止","C. 反向击穿"],"answer":"C","principle":"稳压二极管利用反向击穿区电压变化很小的特性稳压。","why":"达到稳压值后，电流变化较大而管压基本保持稳定。","mistake":"反向截止区尚未达到稳压状态。","memory":"稳压管：反向击穿区工作。","tag":"稳压二极管"},{"id":106,"source_no":18,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"当晶体管工作在放大区时，发射结电压和集电结电压应为（ ）","options":["A. 前者反偏，后者也反偏","B. 前者正偏，后者反偏","C. 前者正偏，后者也正偏","D. 前者反偏，后者正偏"],"answer":"B","principle":"双极型晶体管处于放大区时需要发射结正偏、集电结反偏。","why":"发射结正偏提供载流子注入，集电结反偏负责收集载流子。","mistake":"两个结都正偏对应饱和区。","memory":"放大区：发射正偏、集电反偏。","tag":"晶体管基础"},{"id":107,"source_no":19,"chapter":"第三章《二极管及其基本电路》","type":"choice","q":"当温度升高时，二极管的反向饱和电流将（ ）","options":["A. 增大","B. 不变","C. 减小","D. 都有可能"],"answer":"A","principle":"二极管反向饱和电流对温度非常敏感。","why":"升温使少数载流子浓度增加，从而使反向饱和电流增大。","mistake":"不要认为反向饱和电流与温度无关。","memory":"温度↑ → IS↑。","tag":"二极管温度特性"},{"id":108,"source_no":20,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"在N型半导体中，多数载流子是 ______；在P型半导体中，多数载流子是 ______。","answers":[["自由电子","电子"],["空穴"]],"display_answer":"自由电子；空穴","principle":"N型由五价施主杂质提供大量自由电子，P型由三价受主杂质形成大量空穴。","why":"因此N型的多数载流子是电子，P型的多数载流子是空穴。","mistake":"多数载流子类型不代表半导体整体带净电荷。","memory":"N电子，P空穴。","tag":"杂质半导体"},{"id":109,"source_no":21,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"利用二极管的 ______ 组成整流电路。","answers":[["单向导电性","单向导电特性"]],"display_answer":"单向导电性","principle":"整流的本质是让电流只沿一个方向通过。","why":"二极管正向易导通、反向近似截止，因此可将交流变成脉动直流。","mistake":"整流利用的是单向导电性，不是稳压特性。","memory":"整流靠单向导电。","tag":"二极管应用"},{"id":110,"source_no":22,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"P型半导体是在本征半导体中加入 ______ 后形成的杂质半导体。","answers":[["三价元素","三价杂质","三价杂质元素"]],"display_answer":"三价元素","principle":"P型半导体通过掺入三价受主杂质形成。","why":"三价元素少一个价电子，形成大量空穴。","mistake":"五价元素形成N型。","memory":"P型：三价。","tag":"P型半导体"},{"id":111,"source_no":23,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"温度升高后，本征半导体中 ______ 和 ______ 数目都增多，且增量相同。","answers":[["自由电子","电子"],["空穴"]],"display_answer":"自由电子；空穴","principle":"热激发产生电子-空穴对。","why":"每产生一个自由电子就同时产生一个空穴，所以两者增量相同。","mistake":"本征半导体没有哪一种载流子单独增加。","memory":"本征激发成对产生。","tag":"本征半导体"},{"id":112,"source_no":24,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"当PN结外加正向电压时，P区接电源 ______ 极，N区接电源 ______ 极，此时，扩散电流 ______ 漂移电流。","answers":[["正","正极"],["负","负极"],["大于",">"]],"display_answer":"正；负；大于","principle":"PN结正向偏置时，P区接正、N区接负，势垒降低。","why":"势垒降低会显著增强多数载流子的扩散运动，而少数载流子的漂移电流变化不大，因此扩散电流大于漂移电流。","mistake":"反向偏置的接法正好相反。","memory":"正偏：P接正、N接负、扩散占主导。","tag":"PN结"},{"id":113,"source_no":25,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"二极管最主要的特性是 ______。","answers":[["单向导电性","单向导电特性"]],"display_answer":"单向导电性","principle":"二极管的核心电学特性是正向易导通、反向近似截止。","why":"大量二极管电路应用都建立在单向导电特性上。","mistake":"稳压、发光等是特定二极管的扩展功能。","memory":"二极管核心：单向导电。","tag":"二极管基础"},{"id":114,"source_no":26,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"N型半导体是在本征半导体中加入 ______ 后形成的杂质半导体。","answers":[["五价元素","五价杂质","五价杂质元素"]],"display_answer":"五价元素","principle":"N型半导体由五价施主杂质掺杂形成。","why":"额外价电子容易成为自由电子，使电子成为多数载流子。","mistake":"三价杂质形成P型。","memory":"N型：五价。","tag":"N型半导体"},{"id":115,"source_no":27,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"用万用表测量二极管极性时，已知万用表的黑表笔为电源正极，红表笔为电源负极，若测得的二极管为合格产品，则红表笔所接一端为二极管的 ______ 极，黑表笔所接一端为二极管的 ______ 极。","answers":[["负","负极","阴极"],["正","正极","阳极"]],"display_answer":"负；正","principle":"指针式万用表欧姆挡内部电源极性通常为黑表笔正、红表笔负。","why":"若二极管正向导通，应让黑表笔接阳极、红表笔接阴极，因此红表笔端为负极、黑表笔端为正极。","mistake":"万用表欧姆挡的红黑表笔电源极性与直流电压挡直觉不同。","memory":"欧姆挡：黑正红负；导通时黑接阳极。","tag":"二极管检测"},{"id":116,"source_no":28,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"温度升高后，本征半导体内 ______ 和 ______ 数目都增多，且增量相等。","answers":[["自由电子","电子"],["空穴"]],"display_answer":"自由电子；空穴","principle":"温度升高增强本征激发，产生更多电子-空穴对。","why":"电子和空穴成对产生，所以数量同时增加且增量相等。","mistake":"本题与第23题考查同一知识点。","memory":"升温：电子、空穴等量增加。","tag":"本征半导体"},{"id":117,"source_no":29,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"制作电子器件的常用材料主要采用 ______。","answers":[["硅和锗","硅、锗","硅锗"]],"display_answer":"硅和锗","principle":"硅和锗都是典型的四价元素半导体材料。","why":"传统半导体器件中最常见的是硅材料，也常以锗作为基础半导体材料示例。","mistake":"不要把铜、铝等普通导体当作半导体材料。","memory":"常见半导体：硅、锗。","tag":"半导体材料"},{"id":118,"source_no":30,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"本征半导体是指 ______。P型半导体中的少子是 ______，多子是 ______；N型半导体中的少子是 ______，多子是 ______。","answers":[["纯净的半导体","纯净且结构完整的半导体","纯净的且具有完整晶体结构的半导体"],["自由电子","电子"],["空穴"],["空穴"],["自由电子","电子"]],"display_answer":"纯净的半导体；自由电子；空穴；空穴；自由电子","principle":"本征半导体是不掺杂的纯净半导体；掺杂后形成P型或N型，其中载流子分为多数与少数载流子。","why":"P型以空穴为多子、电子为少子；N型以电子为多子、空穴为少子。","mistake":"少子和多子只是浓度多少之分，不代表另一种载流子不存在。","memory":"P：穴多电子少；N：电子多穴少。","tag":"半导体基础"},{"id":119,"source_no":31,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"当环境温度升高时，二极管的反向饱和电流 IS 将增大，这是因为此时 PN 结内部的 ______。","answers":[["少数载流子浓度增大","少数载流子增多","少数载流子数目增多"]],"display_answer":"少数载流子浓度增大","principle":"反向饱和电流主要由少数载流子的漂移形成。","why":"升温使热激发增强，少数载流子浓度增加，所以IS增大。","mistake":"不是由于多数载流子增加直接造成。","memory":"IS跟少子，温度越高少子越多。","tag":"温度特性"},{"id":120,"source_no":32,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"硅管的正向导通电压约为 ______ V，锗管的正向导通电压约为 ______ V。","answers":[["0.7","0.6~0.7","0.7V"],["0.3","0.2~0.3","0.3V"]],"display_answer":"0.7；0.3","principle":"常用近似模型中，硅二极管导通压降约0.7V，锗二极管约0.3V。","why":"不同半导体材料的结势垒不同，因此典型正向压降不同。","mistake":"不要把硅和锗的典型压降记反。","memory":"硅0.7，锗0.3。","tag":"二极管模型"},{"id":121,"source_no":33,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"稳压管是一种 ______ 二极管。除了用于限幅电路之外，主要用于稳压电路，其稳压性体现在电流增量 ______，只引起很小的 ______ 变化，此时稳压管应工作于 ______ 区。","answers":[["特殊","特制","硅"],["很大","较大"],["电压","管压"],["反向击穿","击穿","稳压"]],"display_answer":"特殊；很大；电压；反向击穿","principle":"稳压二极管利用反向击穿区伏安特性陡峭的特点实现稳压。","why":"在稳压区内，电流变化较大而两端电压变化很小，因此可稳定电压。","mistake":"稳压管必须在限流条件下工作，不能无限制增大击穿电流。","memory":"稳压：反向击穿，电流大变、电压小变。","tag":"稳压二极管"},{"id":122,"source_no":34,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"发光二极管正常工作时，外加 ______ 电压；而光电二极管正常工作时，外加 ______ 电压。","answers":[["正向","正"],["反向","反"]],"display_answer":"正向；反向","principle":"LED靠正向载流子复合发光；光电二极管通常反向偏置收集光生载流子。","why":"两种器件虽然都基于PN结，但工作偏置方向不同。","mistake":"这是常见成对考点。","memory":"发光正偏，光电反偏。","tag":"特殊二极管"},{"id":123,"source_no":35,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"PN结的结电容包括 ______ 和 ______。当在PN结两端施加正向电压时，空间电荷区将 ______，______ 电容将增大。","answers":[["势垒电容","结电容的势垒电容"],["扩散电容"],["变窄","变薄"],["扩散","扩散电容"]],"display_answer":"势垒电容；扩散电容；变窄；扩散","principle":"PN结电容主要包括势垒电容和扩散电容两部分。","why":"正向偏置使耗尽层变窄，同时大量少数载流子注入并存储，使扩散电容显著增大。","mistake":"反向偏置时通常主要考虑势垒电容。","memory":"结电容=势垒+扩散；正偏扩散电容大。","tag":"PN结电容"},{"id":124,"source_no":36,"chapter":"第三章《二极管及其基本电路》","type":"fill","q":"发光二极管是将 ______ 的器件；而光电二极管是将 ______ 的器件。","answers":[["电能转换为光能","电能转化为光能","电信号转换为光信号"],["光能转换为电能","光能转化为电能","光信号转换为电信号"]],"display_answer":"电能转换为光能；光能转换为电能","principle":"LED属于电光转换器件，光电二极管属于光电转换器件。","why":"前者把电能转化为发光，后者利用光照产生电流或电压信号。","mistake":"两者能量转换方向相反。","memory":"LED电→光；光电二极管光→电。","tag":"特殊二极管"},{"id":125,"source_no":37,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"N型半导体又称为空穴型半导体。","options":["A. 对","B. 错"],"answer":"B","principle":"N型半导体的多数载流子是自由电子。","why":"空穴为多数载流子的才是P型半导体。","mistake":"N型不是“空穴型”。","memory":"N电子，P空穴。","tag":"判断题"},{"id":126,"source_no":38,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"P型半导体中，多数载流子是空穴，少数载流子是电子。","options":["A. 对","B. 错"],"answer":"A","principle":"P型半导体由三价受主杂质形成。","why":"其空穴浓度远高于电子浓度，因此空穴为多子、电子为少子。","mistake":"P型整体仍保持电中性。","memory":"P：穴多电子少。","tag":"判断题"},{"id":127,"source_no":39,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"二极管具有单向导电特性。","options":["A. 对","B. 错"],"answer":"A","principle":"普通PN结二极管正向易导通，反向近似截止。","why":"这就是二极管最基本的单向导电性。","mistake":"实际二极管反向仍有很小漏电流。","memory":"二极管：单向导电。","tag":"判断题"},{"id":128,"source_no":40,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"发光二极管加正向电压导通时的压降为0.7V。","options":["A. 对","B. 错"],"answer":"B","principle":"LED的正向导通压降通常明显高于普通硅二极管的0.7V。","why":"不同材料和颜色LED的正向压降常在约1.5V到数伏范围。","mistake":"0.7V是普通硅二极管常用近似值。","memory":"普通硅管0.7V，LED通常更高。","tag":"判断题"},{"id":129,"source_no":41,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"光敏二极管正常工作时应处于反向偏置状态。","options":["A. 对","B. 错"],"answer":"A","principle":"光敏二极管通常在反向偏置下工作。","why":"反向电场有利于分离和收集光生载流子，提高响应速度。","mistake":"不要与LED正向工作混淆。","memory":"光敏二极管反偏。","tag":"判断题"},{"id":130,"source_no":42,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"用万用表 R×1kΩ 挡测量一只二极管，其正反向电阻都为∞，则这只二极管的内部已断路。","options":["A. 对","B. 错"],"answer":"A","principle":"正常二极管正向应有较小电阻。","why":"正、反向都无穷大说明两个方向都无法导通，通常表示内部开路。","mistake":"正反都很小才更像短路。","memory":"都∞→开路；都小→短路。","tag":"判断题"},{"id":131,"source_no":43,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"用万用表 R×100Ω 挡测量一只二极管，其正反向电阻都呈现出很小的阻值，则这只二极管的PN结已经被烧坏而短路。","options":["A. 对","B. 错"],"answer":"A","principle":"正常二极管正、反向电阻应相差很大。","why":"若两个方向都很小，则已失去单向导电性，通常说明内部短路。","mistake":"不要与开路故障混淆。","memory":"正反都小→短路。","tag":"判断题"},{"id":132,"source_no":44,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"光敏性、热敏性和掺杂性是半导体的独特性能。","options":["A. 对","B. 错"],"answer":"A","principle":"半导体电导率对光照、温度和杂质浓度高度敏感。","why":"这些特性是半导体材料能够制作多种电子器件的重要基础。","mistake":"普通金属导体不具备同等显著的这些特性。","memory":"半导体三敏感：光、热、掺杂。","tag":"判断题"},{"id":133,"source_no":45,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"纯净半导体中掺入三价杂质元素可得到N型半导体。","options":["A. 对","B. 错"],"answer":"B","principle":"三价杂质是受主杂质，形成P型半导体。","why":"五价施主杂质才形成N型半导体。","mistake":"三价P，五价N。","memory":"P三，N五。","tag":"判断题"},{"id":134,"source_no":46,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"PN结正向电流的大小由温度决定。","options":["A. 对","B. 错"],"answer":"B","principle":"PN结正向电流主要由外加正向电压和器件参数共同决定，温度只是重要影响因素之一。","why":"说“由温度决定”过于绝对，因此错误。","mistake":"温度升高确实会显著影响正向电流，但不是唯一决定因素。","memory":"温度影响，不是唯一决定。","tag":"判断题"},{"id":135,"source_no":47,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"PN结内的扩散电流是载流子的电场力作用下形成的。","options":["A. 对","B. 错"],"answer":"B","principle":"扩散电流由载流子浓度梯度引起；电场力引起的是漂移电流。","why":"PN结内部同时存在扩散和漂移两种机制。","mistake":"扩散与漂移的成因最容易混淆。","memory":"浓度差→扩散；电场→漂移。","tag":"判断题"},{"id":136,"source_no":48,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"因为N型半导体的多子是自由电子，所以它带负电。","options":["A. 对","B. 错"],"answer":"B","principle":"掺杂半导体整体仍保持宏观电中性。","why":"自由电子增加的同时存在等量的正离化施主离子，因此总电荷仍近似为零。","mistake":"“多数载流子为电子”不等于材料带负电。","memory":"N型多电子，但整体中性。","tag":"判断题"},{"id":137,"source_no":49,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"PN结在无光照、无外加电压时，结电流为零。","options":["A. 对","B. 错"],"answer":"A","principle":"热平衡时扩散电流和漂移电流大小相等、方向相反。","why":"因此PN结的净电流为零。","mistake":"并不是内部完全没有载流子运动，而是两种电流相互抵消。","memory":"零偏热平衡：净电流0。","tag":"判断题"},{"id":138,"source_no":50,"chapter":"第三章《二极管及其基本电路》","type":"truefalse","q":"因为N型半导体的多子是自由电子，所以它带负电。","options":["A. 对","B. 错"],"answer":"B","principle":"N型半导体整体电中性。","why":"自由电子和正离化施主离子的电荷总量相互平衡。","mistake":"题目与第48题重复，结论同样为错误。","memory":"N型不带净负电。","tag":"判断题"},{"id":139,"source_no":1,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"场效应管起放大作用时应工作在漏极特性的（ ）","options":["A. 非饱和区","B. 饱和区","C. 截止区","D. 击穿区"],"answer":"B","principle":"场效应管用于放大时，应工作在漏极特性的恒流区，也常称饱和区。","why":"在该区域内，漏极电流主要受栅源电压控制，而对漏源电压变化不敏感，适合线性放大。","mistake":"不要把MOS管开关应用中的“饱和导通”概念与模拟放大区混淆。","memory":"FET放大 → 恒流区/饱和区。","tag":"场效应管工作区"},{"id":140,"source_no":2,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"增强型绝缘栅场效应管，当栅极g与源极s之间电压为零时（ ）","options":["A. 能够形成导电沟道","B. 不能形成导电沟道","C. 漏极电流不为零","D. 漏极电压为零"],"answer":"B","principle":"增强型MOSFET在UGS未达到开启电压前没有导电沟道。","why":"UGS=0时栅极电场不足以在衬底表面形成反型层，因此源漏之间不能形成导电沟道。","mistake":"耗尽型MOSFET在UGS=0时已经有沟道，增强型则没有。","memory":"增强型：零栅压无沟道。","tag":"增强型MOSFET"},{"id":141,"source_no":3,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"场效应管用（ ）控制漏极电流。","options":["A. 基极电压","B. 栅源电压","C. 基极电流","D. 栅极电流"],"answer":"B","principle":"场效应管是电压控制型器件。","why":"栅源电压UGS改变沟道导电能力，从而控制漏极电流ID。","mistake":"基极电流是双极型晶体管的控制量，不属于场效应管。","memory":"FET：UGS控ID。","tag":"场效应管基本特性"},{"id":142,"source_no":4,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"场效应管漏极电流由（ ）的漂移运动形成。","options":["A. 少子","B. 多子","C. 两种载流子"],"answer":"B","principle":"场效应管属于单极型器件，导电主要依赖多数载流子。","why":"漏极电流由沟道中的多数载流子在电场作用下漂移形成。","mistake":"双极型晶体管才同时涉及两种载流子作用。","memory":"FET靠多子导电。","tag":"单极型器件"},{"id":143,"source_no":5,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"N沟道场效应管的漏极电流由（ ）的漂移运动形成。","options":["A. 少子","B. 多子","C. 两种载流子"],"answer":"B","principle":"N沟道场效应管中的多数载流子为电子。","why":"漏极电流由N沟道中的多数载流子电子漂移形成，所以应选“多子”。","mistake":"题目问载流子类别，不是问具体“电子”。","memory":"N沟道：多子电子导电。","tag":"N沟道FET"},{"id":144,"source_no":6,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"在共源、共漏和共栅三种放大电路组态中，（ ）电压增益小于1但接近于1，输入输出电压同相，有电压跟随作用。","options":["A. 共源放大电路","B. 共漏放大电路","C. 共栅放大电路"],"answer":"B","principle":"共漏放大电路又称源极跟随器。","why":"其输出取自源极，输出电压跟随输入变化，电压增益小于1但接近1，且同相。","mistake":"共源通常反相，共栅虽同相但电压增益可较高。","memory":"共漏=源跟随，Au≈1，同相。","tag":"三种组态"},{"id":145,"source_no":7,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"在共源、共漏和共栅三种放大电路组态中，（ ）电压增益较高，输入输出电压反相。","options":["A. 共源放大电路","B. 共漏放大电路","C. 共栅放大电路"],"answer":"A","principle":"共源放大电路是FET三种基本组态中典型的反相电压放大器。","why":"输入作用于栅源回路，输出取自漏极，漏极电压随漏极电流增大而下降，因此输出与输入反相。","mistake":"共漏和共栅通常为同相输出。","memory":"共源：高增益、反相。","tag":"三种组态"},{"id":146,"source_no":8,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"在共源、共漏和共栅三种放大电路组态中，（ ）电压增益较高，输入输出电压同相，有电流跟随作用。","options":["A. 共源放大电路","B. 共漏放大电路","C. 共栅放大电路"],"answer":"C","principle":"共栅放大电路具有同相电压传输，并具有电流跟随特点。","why":"其电流增益接近1，而电压增益可大于1，因此体现电流跟随作用。","mistake":"共漏是电压跟随，不是电流跟随。","memory":"共栅：同相、电流跟随。","tag":"三种组态"},{"id":147,"source_no":9,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"在共源、共漏和共栅三种放大电路组态中，（ ）输出电阻低。","options":["A. 共源放大电路","B. 共漏放大电路","C. 共栅放大电路"],"answer":"B","principle":"共漏放大电路具有较低输出电阻。","why":"源极跟随器具有较强带负载能力，常用于阻抗变换和缓冲。","mistake":"共源输出电阻一般较高。","memory":"共漏：高输入、低输出。","tag":"三种组态"},{"id":148,"source_no":10,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"在共源、共漏和共栅三种放大电路组态中，（ ）输入电阻小。","options":["A. 共源放大电路","B. 共漏放大电路","C. 共栅放大电路"],"answer":"C","principle":"共栅放大电路从源极输入，输入电阻较低。","why":"其输入端等效电阻常约为1/gm数量级，因此明显低于共源、共漏组态。","mistake":"共源和共漏都从栅极输入，输入电阻较高。","memory":"共栅：低输入电阻。","tag":"三种组态"},{"id":149,"source_no":11,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"场效应晶体管是用（ ）控制漏极电流的。","options":["A. 栅源电流","B. 栅源电压","C. 漏源电流","D. 漏源电压"],"answer":"B","principle":"场效应晶体管是电压控制型器件。","why":"控制量是栅源电压UGS，被控量是漏极电流ID。","mistake":"栅极电流理想情况下近似为零，不是控制量。","memory":"UGS控ID。","tag":"场效应管基本特性"},{"id":150,"source_no":12,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"结型场效应管发生预夹断后，管子（ ）","options":["A. 关断","B. 进入恒流区","C. 进入饱和区","D. 可变电阻区"],"answer":"B","principle":"JFET发生预夹断后进入恒流区。","why":"预夹断后，随着UDS继续增加，夹断区延长，但漏极电流主要由UGS决定，变化很小。","mistake":"预夹断并不等于完全关断。","memory":"预夹断后 → 恒流区。","tag":"JFET工作区"},{"id":151,"source_no":13,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"场效应管靠（ ）导电。","options":["A. 一种载流子","B. 两种载流子","C. 电子","D. 空穴"],"answer":"A","principle":"场效应管又称单极型器件。","why":"其导电主要由一种多数载流子完成，因此不同于双极型晶体管。","mistake":"N沟道靠电子，P沟道靠空穴，所以泛指FET时应选“一种载流子”。","memory":"FET=单极型。","tag":"单极型器件"},{"id":152,"source_no":14,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"增强型PMOS管的开启电压（ ）","options":["A. 大于零","B. 小于零","C. 等于零","D. 或大于零或小于零"],"answer":"B","principle":"P沟道增强型MOSFET需要负的栅源电压达到开启条件。","why":"因此其开启电压UGS(th)<0。","mistake":"N沟道增强型的开启电压则大于零。","memory":"增强型：NMOS正阈值，PMOS负阈值。","tag":"MOSFET阈值"},{"id":153,"source_no":15,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"增强型NMOS管的开启电压（ ）","options":["A. 大于零","B. 小于零","C. 等于零","D. 或大于零或小于零"],"answer":"A","principle":"N沟道增强型MOSFET需要正的栅源电压形成反型沟道。","why":"因此其开启电压UGS(th)>0。","mistake":"不要与PMOS的负开启电压记反。","memory":"NMOS增强型阈值>0。","tag":"MOSFET阈值"},{"id":154,"source_no":16,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"分压式电路中的栅极电阻RG一般阻值很大，目的是（ ）","options":["A. 设置合适的静态工作点","B. 减小栅极电流","C. 提高电路的电压放大倍数","D. 提高电路的输入电阻"],"answer":"D","principle":"FET栅极电流极小，栅极偏置电阻可以取很大。","why":"较大的栅极电阻使输入端对信号源负载很小，从而提高整个放大电路的输入电阻。","mistake":"静态工作点主要由偏置网络的电压比例和源极反馈等共同决定。","memory":"RG大 → Ri大。","tag":"偏置电路"},{"id":155,"source_no":17,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"源极跟随器（共漏极放大器）的输出电阻与（ ）有关。","options":["A. 管子跨导gm","B. 源极电阻Rs","C. 管子跨导gm和源极电阻Rs"],"answer":"C","principle":"源极跟随器的输出电阻同时受器件跨导和源极支路电阻影响。","why":"常见近似关系表现为1/gm与Rs等效并联，因此二者都会影响输出电阻。","mistake":"不能只看跨导或只看源极电阻。","memory":"共漏Ro：gm和Rs都有关。","tag":"共漏放大器"},{"id":156,"source_no":18,"chapter":"第四章《场效应晶体管及其放大电路》","type":"choice","q":"某场效应管的IDSS为6mA，而IDQ自漏极流出，大小为8mA，则该管是（ ）","options":["A. P沟道结型管","B. N沟道结型管","C. 增强型PMOS管","D. 耗尽型PMOS管"],"answer":"D","principle":"电流从漏极流出表明为P沟道；IDSS是耗尽型或结型管在UGS=0时的重要参数，而IDQ还能大于IDSS说明可通过栅压增强沟道。","why":"P沟道结型管正常反偏控制时漏极电流幅值通常不超过IDSS；耗尽型PMOS可在合适栅压下使电流超过IDSS，因此选D。","mistake":"不能只凭“P沟道”选A，还要结合IDQ>IDSS判断管型。","memory":"P沟道 + ID>IDSS → 耗尽型PMOS。","tag":"FET类型判断"},{"id":157,"source_no":19,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"场效应晶体管属于 ______ 控制器件。","answers":[["电压","电压控制","电压型"]],"display_answer":"电压","principle":"场效应管以栅源电压控制漏极电流。","why":"栅极回路电流极小，因此属于电压控制型器件。","mistake":"双极型晶体管常被称为电流控制型器件。","memory":"FET：电压控制。","tag":"场效应管基本特性"},{"id":158,"source_no":20,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"场效应管的最大优点是 ______。","answers":[["输入电阻高","输入电阻很高","输入电阻大","高输入电阻"]],"display_answer":"输入电阻高","principle":"场效应管栅极电流很小，特别是MOSFET的栅极与沟道绝缘。","why":"因此其输入电阻很高，对前级信号源的负载作用很小。","mistake":"这是与双极型晶体管相比最典型的优势之一。","memory":"FET最大优点：输入电阻高。","tag":"场效应管优点"},{"id":159,"source_no":21,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"UGS=0时，不能工作在恒流区的场效应管有 ______。","answers":[["增强型MOSFET","增强型绝缘栅场效应管","增强型场效应管","增强型MOS管"]],"display_answer":"增强型MOSFET","principle":"增强型MOSFET在UGS=0时没有导电沟道。","why":"其栅源电压必须达到开启电压后才形成沟道并可能进入恒流区。","mistake":"结型和耗尽型FET在UGS=0时通常已有沟道。","memory":"零栅压不能恒流：增强型。","tag":"MOSFET工作条件"},{"id":160,"source_no":22,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"开启电压UGS(th)>0的是 ______ 场效应管。（原图符号较模糊，按本章标准对应关系录入）","answers":[["N沟道增强型","N沟道增强型MOS","N沟道增强型MOSFET","增强型NMOS"]],"display_answer":"N沟道增强型","principle":"开启电压UGS(th)是增强型MOSFET的重要参数。","why":"N沟道增强型MOSFET需要正栅源电压超过阈值才形成导电沟道，因此UGS(th)>0。","mistake":"原图该符号拍摄较模糊；这里按与下一题成对的标准关系录入。","memory":"阈值>0 → N增强型。","tag":"MOSFET阈值"},{"id":161,"source_no":23,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"开启电压UGS(th)<0的是 ______ 场效应管。（原图符号较模糊，按本章标准对应关系录入）","answers":[["P沟道增强型","P沟道增强型MOS","P沟道增强型MOSFET","增强型PMOS"]],"display_answer":"P沟道增强型","principle":"P沟道增强型MOSFET需要负栅源电压形成导电沟道。","why":"因此其开启电压UGS(th)<0。","mistake":"原图该符号拍摄较模糊；这里按与上一题成对的标准关系录入。","memory":"阈值<0 → P增强型。","tag":"MOSFET阈值"},{"id":162,"source_no":24,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"FET有两种主要类型即 ______ 和 ______，FET是利用 ______ 来控制其电流大小的半导体器件。","answers":[["结型场效应管","JFET","结型"],["绝缘栅型场效应管","MOSFET","绝缘栅型"],["电场效应","电场","栅源电压形成的电场"]],"display_answer":"结型场效应管；绝缘栅型场效应管；电场效应","principle":"场效应管主要分为结型场效应管和绝缘栅型场效应管。","why":"两类器件都利用栅极产生的电场改变沟道导电能力，从而控制漏极电流。","mistake":"不要把MOSFET的N/P沟道分类与FET的两大基本类型混淆。","memory":"FET两类：JFET、MOSFET；靠电场控制。","tag":"FET分类"},{"id":163,"source_no":25,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"在MOSFET中，从导电载流子的带电极性来看，有 ______ 管和 ______ 管之分；而按照导电沟道形成机理不同，NMOS管和PMOS管又各有 ______ 型和 ______ 型两种。因此，MOSFET有四种：______、______、______ 和 ______。","answers":[["NMOS","N沟道"],["PMOS","P沟道"],["增强","增强型"],["耗尽","耗尽型"],["N沟道增强型","增强型NMOS"],["N沟道耗尽型","耗尽型NMOS"],["P沟道增强型","增强型PMOS"],["P沟道耗尽型","耗尽型PMOS"]],"display_answer":"NMOS；PMOS；增强；耗尽；N沟道增强型；N沟道耗尽型；P沟道增强型；P沟道耗尽型","principle":"MOSFET可按沟道极性和沟道形成方式进行两级分类。","why":"沟道极性分N沟道与P沟道；每种又分增强型和耗尽型，因此共四类。","mistake":"分类顺序不同不影响本质，但答题时最好按题干顺序填写。","memory":"N/P × 增强/耗尽 = 四种MOSFET。","tag":"MOSFET分类"},{"id":164,"source_no":26,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"结型场效应管发生预夹断后，管子将进入 ______ 区工作。","answers":[["恒流","恒流区","饱和","饱和区"]],"display_answer":"恒流","principle":"JFET预夹断后漏极电流对漏源电压变化不敏感。","why":"因此管子进入恒流区，也常称饱和区，是其放大工作区域。","mistake":"预夹断不等于截止。","memory":"预夹断 → 恒流区。","tag":"JFET工作区"},{"id":165,"source_no":27,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"增强型PMOS管的开启电压 ______。","answers":[["小于零","<0","负","为负"]],"display_answer":"小于零","principle":"P沟道增强型MOSFET需要负栅源电压开启。","why":"所以其UGS(th)<0。","mistake":"NMOS增强型恰好相反。","memory":"PMOS增强型阈值<0。","tag":"MOSFET阈值"},{"id":166,"source_no":28,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"当场效应管的漏极直流电流ID从2mA变为4mA时，它的低频跨导gm将 ______。","answers":[["增大","变大","增加"]],"display_answer":"增大","principle":"多数常用FET模型中，跨导gm随工作电流增大而增大。","why":"工作点漏极电流升高意味着转移特性曲线局部斜率增大，因此低频跨导增大。","mistake":"gm不是固定不变的常数。","memory":"ID↑ → gm↑。","tag":"跨导"},{"id":167,"source_no":29,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"当UGS=0V时，能够工作在恒流区的场效应管有 ______、______。","answers":[["结型场效应管","JFET","结型"],["耗尽型MOSFET","耗尽型绝缘栅场效应管","耗尽型MOS管"]],"display_answer":"结型场效应管；耗尽型MOSFET","principle":"结型FET和耗尽型MOSFET在零栅压时都已经存在导电沟道。","why":"因此在合适漏源电压下，它们可以在UGS=0时进入恒流区。","mistake":"增强型MOSFET在UGS=0时没有导电沟道。","memory":"零栅压可导通：结型、耗尽型。","tag":"FET类型"},{"id":168,"source_no":30,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"MOS管的结构由 ______、______ 和 ______ 组成。","answers":[["金属","Metal"],["氧化物","氧化层","Oxide"],["半导体","Semiconductor"]],"display_answer":"金属；氧化物；半导体","principle":"MOS名称即Metal-Oxide-Semiconductor的缩写。","why":"栅极金属、绝缘氧化层和半导体衬底共同构成MOS结构。","mistake":"这里问MOS结构层次，不是器件的源、栅、漏三个电极。","memory":"MOS=金属-氧化物-半导体。","tag":"MOS结构"},{"id":169,"source_no":31,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"绝缘栅型场效应管按导电沟道的分有 ______ 和 ______ 两类，其每一类又可分 ______ 和 ______ 两种。","answers":[["N沟道","N沟道型"],["P沟道","P沟道型"],["增强型","增强"],["耗尽型","耗尽"]],"display_answer":"N沟道；P沟道；增强型；耗尽型","principle":"MOSFET既可按沟道极性分类，也可按沟道形成方式分类。","why":"N沟道和P沟道各自又都有增强型和耗尽型。","mistake":"四种MOS管来源于这两个二分类的组合。","memory":"N/P，再分增强/耗尽。","tag":"MOSFET分类"},{"id":170,"source_no":32,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"场效应管与双极晶体管比较，______ 为电压控制器件，______ 为电流控制器件，______ 的输入电阻高。","answers":[["场效应管","FET"],["双极晶体管","双极型晶体管","BJT"],["场效应管","FET"]],"display_answer":"场效应管；双极晶体管；场效应管","principle":"FET和BJT在控制方式和输入特性上有明显区别。","why":"FET以栅源电压控制漏极电流，输入电流极小；BJT通常以基极电流控制集电极电流。","mistake":"不要把FET的高输入电阻特性套到BJT。","memory":"FET电压控、高输入；BJT电流控。","tag":"FET与BJT比较"},{"id":171,"source_no":33,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"场效应管有 ______ 种载流子参与导电，故场效应管又称 ______ 型元件。","answers":[["一","一种","1"],["单极","单极型"]],"display_answer":"一种；单极","principle":"场效应管主要依靠一种多数载流子导电。","why":"因此又称单极型器件，以区别于双极型晶体管。","mistake":"N沟道用电子，P沟道用空穴，但每一只FET主要依靠一种载流子。","memory":"一种载流子 → 单极型。","tag":"单极型器件"},{"id":172,"source_no":34,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"使用场效应管时应特别注意对 ______ 极的保护，尤其是绝缘栅管，在不用时应将三个电极 ______。","answers":[["栅","栅极"],["短接","短路连接","短路"]],"display_answer":"栅；短接","principle":"MOSFET栅极绝缘层很薄，容易被静电高压击穿。","why":"运输、储存或闲置时将电极短接，可减小静电积累导致的栅氧化层损伤风险。","mistake":"这里强调的是静电防护，不是正常工作接法。","memory":"MOS最怕静电，保护栅极，不用时短接电极。","tag":"FET使用注意事项"},{"id":173,"source_no":35,"chapter":"第四章《场效应晶体管及其放大电路》","type":"fill","q":"自偏压电路只适用于 ______ 型的场效应管放大电路。","answers":[["耗尽","耗尽型","结型和耗尽型","结型场效应管和耗尽型MOS管"]],"display_answer":"耗尽型（含结型FET和耗尽型MOSFET）","principle":"自偏压依靠管子在UGS=0时已有漏极电流，在源极电阻上建立偏置电压。","why":"因此它适用于零栅压已有沟道的结型FET和耗尽型MOSFET；增强型MOSFET在UGS=0时无漏极电流，无法用这种方式自行建立偏置。","mistake":"若教材只要求一个分类词，通常填写“耗尽型”；更完整地说包括结型和耗尽型MOS管。","memory":"自偏压：零栅压能导通的管子。","tag":"偏置电路"}];
