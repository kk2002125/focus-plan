<script>
const APP_VERSION = "1.3.0";
const STORE_KEY = "undergrad_quiz_pwa_v1_test";
const LEGACY_SHARED_STORE_KEY = "undergrad_quiz_pwa_v1";
const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
let questions = [];
let deferredPrompt = null;
let view = "home";
let practice = null;

function defaultState(){
  return {
    answers:{},
    stats:{total:0,correct:0},
    wrongIds:[],
    masteredIds:[],
    history:[],
    lastQuestionId:null,
    dailyCount:10,
    memory:{},
    dayLogs:{},
    checkins:{},
    studySecondsByDay:{},
    studyDayStartHour:4,
    dataVersion:2,
    lastSavedAt:null,
    dayLogs:{},checkins:{},studySecondsByDay:{}
  };
}
function loadState(){
  try{
    let raw=localStorage.getItem(STORE_KEY);
    if(!raw){
      const legacy=localStorage.getItem(LEGACY_SHARED_STORE_KEY);
      if(legacy){ localStorage.setItem(STORE_KEY,legacy); raw=legacy; }
    }
    return {...defaultState(), ...(JSON.parse(raw||"{}"))};
  }catch(e){return defaultState();}
}
let state = loadState();
function save(){state.lastSavedAt=Date.now();localStorage.setItem(STORE_KEY, JSON.stringify(state));}
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1600);
}
function nav(active){
  return `<div class="bottom-nav"><div class="bottom-nav-inner">
    ${[
      ["home","⌂","首页"],["practice","✎","刷题"],["wrong","↺","错题"],["stats","▦","数据"]
    ].map(([k,i,t])=>`<button class="nav-btn ${active===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join("")}
  </div></div>`;
}
function shell(content, active="home", action=""){
  return `<div class="app-shell">
    <div class="topbar"><div class="toprow">
      <div class="brand"><div class="logo">题</div><span>理解型刷题 <small style="font-size:12px;color:#7b8780;font-weight:600">Web v1.5.7</small></span></div>
      ${action}
    </div></div>
    <main class="content">${content}</main>${nav(active)}
  </div>`;
}
function accuracy(){
  return state.stats.total ? Math.round(state.stats.correct/state.stats.total*100) : 0;
}
function chapterProgress(){
  const done = questions.filter(q=>state.answers[q.id]).length;
  return Math.round(done/questions.length*100)||0;
}
function chapterList(){
  return [...new Set(questions.map(q=>q.chapter))];
}
function chapterProgressFor(chapter){
  const list=questions.filter(q=>q.chapter===chapter);
  if(!list.length)return 0;
  const done=list.filter(q=>state.answers[q.id]).length;
  return Math.round(done/list.length*100)||0;
}
function chapterCardsHTML(){
  return chapterList().map((chapter,idx)=>{
    const count=questions.filter(q=>q.chapter===chapter).length;
    const progress=chapterProgressFor(chapter);
    const safe=chapter.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    return `<div class="card chapter-card" style="margin-bottom:10px">
      <div class="chapter-icon">${String(idx+1).padStart(2,"0")}</div>
      <div class="chapter-info">
        <h3>${chapter}</h3>
        <p>${count} 题 · 含原理解析</p>
        <div class="progress"><div style="width:${progress}%"></div></div>
      </div>
      <button class="ghost" onclick="startPractice('chapter',null,'${safe}')">本章练习</button>
    </div>`;
  }).join("");
}

const REVIEW_DAYS=[1,3,7,14,30,60];
const DAY_MS=24*60*60*1000;

function todayKey(ts=Date.now()){
  const d=new Date(ts);
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function startOfDay(ts=Date.now()){
  const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();
}
function addDaysFrom(ts,days){return startOfDay(ts)+days*DAY_MS;}
function formatDay(ts){
  if(!ts)return "—";
  const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日`;
}
function memoryFor(id){
  if(!state.memory || typeof state.memory!=="object")state.memory={};
  return state.memory[id]||null;
}
function ensureLearningMemory(id){
  if(!state.memory || typeof state.memory!=="object")state.memory={};
  if(!state.memory[id])state.memory[id]={phase:"learning",todayPasses:0,learningDay:todayKey(),cycleStart:null,stage:0,dueTs:null,lapses:0};
  return state.memory[id];
}
function migrateMemory(){
  let changed=false;
  if(!state.memory || typeof state.memory!=="object"){state.memory={};changed=true;}
  (state.wrongIds||[]).forEach(id=>{
    if(!state.memory[id]){
      state.memory[id]={phase:"learning",todayPasses:0,learningDay:todayKey(),cycleStart:null,stage:0,dueTs:null,lapses:0};
      changed=true;
    }
  });
  if(changed)save();
}
function todayUniqueDone(){
  const k=todayKey();
  return new Set(state.history.filter(h=>todayKey(h.ts)===k).map(h=>h.id)).size;
}
function learningIds(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="learning").map(q=>q.id);
}
function dueReviewIds(){
  const now=Date.now();
  return questions.filter(q=>{
    const m=memoryFor(q.id);
    return m?.phase==="review" && m.dueTs && m.dueTs<=now;
  }).map(q=>q.id);
}
function activeReviewCount(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="review").length;
}
function longTermMasteredCount(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="mastered").length;
}
function newQuestionIdsInOrder(){
  let base=[...questions],start=0;
  if(state.lastQuestionId){
    const i=base.findIndex(q=>q.id===state.lastQuestionId);
    if(i>=0)start=(i+1)%base.length;
  }
  const ordered=base.slice(start).concat(base.slice(0,start));
  return ordered.filter(q=>!memoryFor(q.id)).map(q=>q.id);
}
function setDailyCount(n){
  n=Math.max(1,Math.min(999,parseInt(n)||10));
  state.dailyCount=n;save();
  const el=document.getElementById("dailyCount");
  if(el)el.value=n;
  document.querySelectorAll(".quick-counts button").forEach(b=>b.classList.toggle("active",Number(b.dataset.n)===n));
}
function startDaily(){
  const el=document.getElementById("dailyCount");
  const n=Math.max(1,Math.min(questions.length,parseInt(el?.value||state.dailyCount||10)||10));
  state.dailyCount=n;save();
  startPractice("daily",n);
}
function startDueReview(){startPractice("review");}
function startLearningQueue(){startPractice("learning");}
function exportBackup(){
  const payload={app:"理解型刷题",version:APP_VERSION,exportedAt:new Date().toISOString(),storeKey:STORE_KEY,state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date();
  const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  a.href=url;a.download=`理解型刷题_备份_${stamp}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast("备份已导出");
}
function importBackup(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json,application/json";
  input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    try{
      const obj=JSON.parse(await file.text());
      const incoming=obj?.state||obj;
      if(!incoming || typeof incoming!=="object" || !incoming.stats)throw new Error("不是有效的刷题备份");
      if(!confirm("导入会覆盖当前手机上的学习记录，确定继续吗？"))return;
      state={...defaultState(),...incoming};
      state.answers=state.answers||{};
      state.wrongIds=Array.isArray(state.wrongIds)?state.wrongIds:[];
      state.masteredIds=Array.isArray(state.masteredIds)?state.masteredIds:[];
      state.history=Array.isArray(state.history)?state.history:[];
      state.memory=(state.memory&&typeof state.memory==="object")?state.memory:{};
      migrateMemory();save();toast("备份导入成功");home();
    }catch(e){alert("导入失败："+(e.message||"文件格式不正确"));}
  };
  input.click();
}


let timerHandle=null,studySessionStartedAt=null,studySessionBase=0,calendarCursor=new Date();
function ensureDayData(){
  if(!state.dayLogs)state.dayLogs={}; if(!state.checkins)state.checkins={}; if(!state.studySecondsByDay)state.studySecondsByDay={};
  const k=todayKey(); if(!state.dayLogs[k])state.dayLogs[k]={answers:0,correct:0,wrong:0,newLearned:0,reviews:0};
  return state.dayLogs[k];
}
function fmtSec(s){s=Math.max(0,Math.floor(s||0));const hh=Math.floor(s/3600),mm=Math.floor((s%3600)/60),ss=s%60;return hh?String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0"):String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0")}
function currentSessionSeconds(){return studySessionBase+(studySessionStartedAt?Math.floor((Date.now()-studySessionStartedAt)/1000):0)}
function startStudySession(){
  const k=todayKey();studySessionBase=(state.studySecondsByDay?.[k]||0);studySessionStartedAt=Date.now();
  clearInterval(timerHandle);timerHandle=setInterval(()=>{const e=document.getElementById("qTimer");if(e)e.textContent=fmtSec(currentSessionSeconds())},1000);
}
function saveStudySession(){
  if(!studySessionStartedAt)return;
  const k=todayKey();if(!state.studySecondsByDay)state.studySecondsByDay={};
  state.studySecondsByDay[k]=currentSessionSeconds();studySessionBase=state.studySecondsByDay[k];studySessionStartedAt=Date.now();save();
}
function stopStudySession(){if(studySessionStartedAt){saveStudySession();studySessionStartedAt=null;}clearInterval(timerHandle)}
function checkinToday(){ensureDayData();state.checkins[todayKey()]={ts:Date.now()};save();home();toast("今日打卡完成 ✓")}
function showDay(k){const d=(state.dayLogs||{})[k]||{};const sec=(state.studySecondsByDay||{})[k]||0;alert(k+" 学习记录\n作答："+(d.answers||0)+"\n答对："+(d.correct||0)+"\n答错："+(d.wrong||0)+"\n学习用时："+fmtSec(sec)+(state.checkins?.[k]?"\n已打卡 ✓":""))}
function changeMonth(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);home()}
function calendarHTML(){
 const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let a='<div class="calendar-nav"><button onclick="changeMonth(-1)">‹ 上月</button><b>'+y+' 年 '+(m+1)+' 月</b><button onclick="changeMonth(1)">下月 ›</button></div><div class="calendar">';
 a+=["日","一","二","三","四","五","六"].map(x=>'<div class="cal-head">'+x+'</div>').join("");
 for(let i=0;i<first;i++)a+='<div></div>';
 for(let d=1;d<=days;d++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");a+='<button class="cal-day '+(state.checkins?.[k]?'done ':'')+(k===todayKey()?'today':'')+'" onclick="showDay(\''+k+'\')">'+d+'</button>'}
 return a+'</div>';
}
function home(){
  const wrongCount=state.wrongIds.length;
  const installBtn = deferredPrompt ? `<button class="top-action" onclick="installApp()">安装APP</button>` : "";
  const todayDone=todayUniqueDone();
  const dailyCount=Math.max(1,Math.min(questions.length,state.dailyCount||10));
  const due=dueReviewIds().length;
  const learning=learningIds().length;
  const active=activeReviewCount();
  const mature=longTermMasteredCount();
  const newCount=newQuestionIdsInOrder().length;
  app.innerHTML=shell(`
    <section class="hero">
      <h1>今天继续把题真正记住</h1>
      <p>当天先通过两次间隔验证，再进入 1·3·7·14·30·60 天记忆曲线。</p>
      <div class="hero-grid">
        <div class="hero-stat"><b>${todayDone}</b><span>今日已刷</span></div>
        <div class="hero-stat"><b>${due}</b><span>到期复习</span></div>
        <div class="hero-stat"><b>${wrongCount}</b><span>当前错题</span></div>
      </div>
    </section>

    <div class="section-title"><h2>今日记忆任务</h2><span>优先处理到期内容</span></div>
    <div class="memory-card">
      <b style="font-size:18px">间隔复习队列</b>
      <div class="memory-grid">
        <div class="memory-stat"><b>${due}</b><span>到期/逾期</span></div>
        <div class="memory-stat"><b>${learning}</b><span>学习中</span></div>
        <div class="memory-stat"><b>${active+mature}</b><span>记忆曲线中</span></div>
      </div>
      <div class="memory-actions">
        <button class="primary" onclick="startDueReview()" ${due?"":"disabled"}>复习到期题 ${due?`(${due})`:""}</button>
        <button class="ghost" onclick="startLearningQueue()" ${learning?"":"disabled"}>继续学习中 ${learning?`(${learning})`:""}</button>
      </div>
      <div class="memory-hint">规则：新题或忘记的题，当天必须“间隔答对 2 次”才算完成；任何一次答错都会清零并继续推回。进入长期复习后，在 1/3/7/14/30/60 天节点答对就向后推进；节点答错则重新学习，并从新的完成日期重新开始整条曲线。</div>
    </div>

    <div class="section-title"><h2>学习打卡</h2><span>${new Date().getMonth()+1} 月</span></div>
    <div class="card check-card">
      <div class="check-grid">
        <div class="check-stat"><b>${ensureDayData().answers||0}</b><span>今日作答</span></div>
        <div class="check-stat"><b>${ensureDayData().correct||0}</b><span>答对</span></div>
        <div class="check-stat"><b>${fmtSec(state.studySecondsByDay?.[todayKey()]||0)}</b><span>学习时间</span></div>
      </div>
      <button class="${state.checkins?.[todayKey()]?'ghost':'primary'}" style="width:100%" onclick="checkinToday()">${state.checkins?.[todayKey()]?'今日已打卡 ✓':'今日学习打卡'}</button>
      ${calendarHTML()}
      <div class="backup-note">点日期可查看当天作答、正确、错误和学习用时。</div>
    </div>

    <div class="section-title"><h2>今日新题计划</h2><span>剩余新题 ${newCount}</span></div>
    <div class="card">
      <div class="plan-row">
        <div style="flex:1;min-width:180px">
          <b style="font-size:18px">今天准备学多少道新题？</b>
          <p class="mini" style="margin:5px 0 0">只安排尚未进入记忆系统的新题；学习中和到期题由上面的队列负责。</p>
        </div>
        <input id="dailyCount" class="plan-input" type="number" min="1" max="${Math.max(1,questions.length)}" value="${dailyCount}" onchange="setDailyCount(this.value)">
        <button class="primary" onclick="startDaily()" ${newCount?"":"disabled"}>开始新题</button>
      </div>
      <div class="quick-counts">
        ${[5,10,15,questions.length].filter((n,i,a)=>n<=questions.length&&a.indexOf(n)===i).map(n=>`<button data-n="${n}" class="${n===dailyCount?'active':''}" onclick="setDailyCount(${n})">${n===questions.length?'本章全部':n+'题'}</button>`).join("")}
      </div>
      <div class="backup-note">设定数量按“不同的新题”计算。每道题当天为了验证记忆而再次出现，不占你的新题额度。</div>
    </div>

    <div class="section-title"><h2>章节题库</h2><span>${chapterProgress()}% 已接触</span></div>
    ${chapterCardsHTML()}

    <div class="section-title"><h2>专项模式</h2><span>按需要选择</span></div>
    <div class="grid2">
      <div class="card">
        <b style="font-size:18px">顺序刷题</b>
        <p class="mini">手动完整练习题库。遇到新题仍会纳入记忆系统，遇到已到期题也会计入复习。</p>
        <button class="ghost" style="width:100%;margin-top:5px" onclick="startPractice('normal')">完整顺序刷</button>
      </div>
      <div class="card">
        <b style="font-size:18px">只刷错题</b>
        <p class="mini">集中处理当前错题；完成两次间隔答对后重新进入记忆曲线。</p>
        <button class="ghost" style="width:100%;margin-top:5px" onclick="startPractice('wrong')">错题训练</button>
      </div>
    </div>

    <div class="section-title"><h2>数据安全</h2><span>换手机也能恢复</span></div>
    <div class="card">
      <b style="font-size:18px">学习记录备份</b>
      <p class="mini">备份现在也包含每道题的记忆阶段、下次复习日期和遗忘重置次数。</p>
      <div class="backup-actions">
        <button class="primary" onclick="exportBackup()">导出备份</button>
        <button class="ghost" onclick="importBackup()">导入备份</button>
      </div>
      <div class="backup-note">换手机：旧手机导出 JSON → 发到新手机 → 新手机打开网页 → 导入备份。</div>
    </div>

    ${!deferredPrompt?`<div class="install-tip">建议部署到固定 HTTPS 地址后长期使用，并定期导出备份。记忆曲线数据保存在浏览器本地，清理网站数据会清空记录。</div>`:""}
  `,"home",installBtn);
}
function startPractice(mode,limit=null,chapter=null){
  let ids=[];
  if(mode==="chapter"){
    ids=questions.filter(q=>q.chapter===chapter).map(q=>q.id);
    if(!ids.length){toast("本章暂时没有题目");return;}
  }else if(mode==="review"){
    ids=dueReviewIds();
    if(!ids.length){toast("今天没有到期复习题");return;}
  }else if(mode==="learning"){
    ids=learningIds();
    if(!ids.length){toast("目前没有学习中的题");return;}
  }else if(mode==="wrong"){
    ids=questions.filter(q=>state.wrongIds.includes(q.id)).map(q=>q.id);
    if(!ids.length){toast("现在没有错题");return;}
  }else if(mode==="daily"){
    ids=newQuestionIdsInOrder();
    if(!ids.length){toast("当前没有新题，先完成复习任务");return;}
    const n=Math.max(1,Math.min(ids.length,parseInt(limit)||state.dailyCount||10));
    ids=ids.slice(0,n);
    if(n<(parseInt(limit)||state.dailyCount||10))toast(`当前只剩 ${n} 道新题`);
  }else{
    let base=[...questions],start=0;
    if(mode==="continue" && state.lastQuestionId){
      const i=base.findIndex(q=>q.id===state.lastQuestionId);
      if(i>=0)start=(i+1)%base.length;
    }
    const ordered=base.slice(start).concat(base.slice(0,start));
    ids=ordered.map(q=>q.id);
  }
  practice={queue:ids,pos:0,currentAnswer:"",done:false,correct:false,mode,plannedCount:ids.length,feedback:""};
  stopStudySession();studySessionBase=(state.studySecondsByDay?.[todayKey()]||0);studySessionStartedAt=null;
  view="practice";renderPractice();
}
function go(v){
  if(view==="practice"&&v!=="practice")stopStudySession();
  view=v;
  if(v==="home")home();
  if(v==="practice"){
    if(!practice) startPractice("continue"); else renderPractice();
  }
  if(v==="wrong")wrongView();
  if(v==="stats")statsView();
}
function getQ(){return questions.find(q=>q.id===practice.queue[practice.pos]);}
function normalize(s){return (s||"").trim().replace(/\s+/g,"").replace(/[，,；;]/g,";")}
function fillCorrect(q,v){
  if(q.display_answer && normalize(v)===normalize(q.display_answer)) return true;
  const p=normalize(v).split(";").filter(Boolean);
  if(q.answers.length===1)return q.answers[0].some(a=>normalize(a)===normalize(v));
  if(p.length!==q.answers.length)return false;
  return q.answers.every((g,i)=>g.some(a=>normalize(a)===normalize(p[i])));
}
function isCorrect(q,v){return (q.type==="choice"||q.type==="truefalse")?v===q.answer:fillCorrect(q,v)}
function answerText(q){return (q.type==="choice"||q.type==="truefalse")?(q.options.find(o=>o[0]===q.answer)||q.answer):q.display_answer}
function enqueueAgain(id,offset){
  if(!practice)return;
  const future=practice.queue.slice(practice.pos+1);
  if(future.includes(id))return;
  const at=Math.min(practice.pos+1+offset,practice.queue.length);
  practice.queue.splice(at,0,id);
}
function completeLearning(q,m){
  const now=Date.now();
  const wasWrong=state.wrongIds.includes(q.id);
  m.phase="review";
  m.todayPasses=2;
  m.learningDay=todayKey();
  m.cycleStart=now;
  m.stage=0;
  m.dueTs=addDaysFrom(now,REVIEW_DAYS[0]);
  m.lastDailyComplete=todayKey();
  state.wrongIds=state.wrongIds.filter(id=>id!==q.id);
  if(wasWrong && !state.masteredIds.includes(q.id))state.masteredIds.push(q.id);
  practice.feedback=`今日学习完成 ✓ 已进入记忆曲线；下次复习：${formatDay(m.dueTs)}（第 1 天）。`;
}
function resetToLearning(q,m){
  m.phase="learning";
  m.todayPasses=0;
  m.learningDay=todayKey();
  m.cycleStart=null;
  m.stage=0;
  m.dueTs=null;
  m.lapses=(m.lapses||0)+1;
  if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
  enqueueAgain(q.id,4);
  practice.feedback="这次忘记了：记忆曲线已重置。题目会再次推回；今天重新完成 2 次间隔答对后，再从第 1 天开始。";
}
function advanceReview(q,m){
  const now=Date.now();
  let next=m.stage+1;
  // 若复习明显逾期，跳过已经过去的检查点，找到下一个仍在未来的节点。
  while(next<REVIEW_DAYS.length && addDaysFrom(m.cycleStart,REVIEW_DAYS[next])<=now)next++;
  if(next>=REVIEW_DAYS.length){
    m.phase="mastered";m.stage=REVIEW_DAYS.length;m.dueTs=null;
    practice.feedback="本轮长期记忆节点全部通过 ✓ 已完成 1·3·7·14·30·60 天复习。";
  }else{
    m.stage=next;
    m.dueTs=addDaysFrom(m.cycleStart,REVIEW_DAYS[next]);
    practice.feedback=`复习通过 ✓ 下一节点：${formatDay(m.dueTs)}（第 ${REVIEW_DAYS[next]} 天）。`;
  }
}
function recordAnswer(q,value,correct){
  const dl=ensureDayData();dl.answers++;if(correct)dl.correct++;else dl.wrong++;
  state.stats.total++;
  if(correct)state.stats.correct++;
  const prev=state.answers[q.id]||{};
  state.answers[q.id]={...prev,value,correct,ts:Date.now(),streak:correct?(prev.streak||0)+1:0};
  state.history.unshift({id:q.id,correct,ts:Date.now()});
  state.history=state.history.slice(0,500);
  let m=memoryFor(q.id);

  if(m?.phase==="review"){
    const isDue=!!(m.dueTs && m.dueTs<=Date.now());
    if(!correct){
      resetToLearning(q,m);
    }else if(isDue){
      advanceReview(q,m);
    }else{
      practice.feedback=`回答正确。正式复习日仍是 ${formatDay(m.dueTs)}，本次额外练习不会提前推进记忆曲线。`;
    }
  }else if(m?.phase==="mastered"){
    if(!correct)resetToLearning(q,m);
    else practice.feedback="回答正确 ✓ 这道题已完成长期记忆周期。";
  }else{
    m=m||ensureLearningMemory(q.id);
    if(m.learningDay!==todayKey()){
      m.learningDay=todayKey();m.todayPasses=0;
    }
    if(!correct){
      m.todayPasses=0;
      if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
      enqueueAgain(q.id,4);
      practice.feedback="回答错误：今日掌握计数已清零，稍后会再次出现。";
    }else{
      m.phase="learning";
      m.todayPasses=(m.todayPasses||0)+1;
      if(m.todayPasses>=2){
        completeLearning(q,m);
      }else{
        enqueueAgain(q.id,8);
        practice.feedback="第一次间隔验证通过 ✓ 还需要再答对 1 次才算今日完成，稍后会再次出现。";
      }
    }
  }
  state.lastQuestionId=q.id;
  save();
}
function choose(k){
  if(practice.done)return;
  const q=getQ();
  practice.currentAnswer=k;
  practice.correct=isCorrect(q,k);
  practice.done=true;
  recordAnswer(q,k,practice.correct);
  renderPractice(true);
}
function submitFill(){
  if(practice.done)return;
  const el=document.getElementById("fill");
  const v=el?el.value:practice.currentAnswer;
  if(!normalize(v)){toast("先填写答案");return;}
  const q=getQ();
  practice.currentAnswer=v;
  practice.correct=isCorrect(q,v);
  practice.done=true;
  recordAnswer(q,v,practice.correct);
  renderPractice(true);
}
function nextQuestion(){
  if(practice.pos<practice.queue.length-1){
    practice.pos++;practice.done=false;practice.correct=false;practice.currentAnswer="";
    renderPractice();window.scrollTo({top:0,behavior:"smooth"});
  }else{
    stopStudySession();
    toast("本轮完成");
    home();
  }
}
function prevQuestion(){
  if(practice.pos>0){
    practice.pos--;practice.done=false;practice.correct=false;practice.currentAnswer="";
    renderPractice();window.scrollTo({top:0,behavior:"smooth"});
  }
}
function renderPractice(scrollToAnalysis=false){
  const q=getQ();
  const done=practice.done;
  const progress=Math.round((practice.pos+1)/practice.queue.length*100);
  let input="";
  if(q.type==="choice"||q.type==="truefalse"){
    input=`<div class="options">${q.options.map(o=>{
      const k=o[0];let c="option";
      if(practice.currentAnswer===k)c+=" selected";
      if(done&&k===q.answer)c+=" correct";
      if(done&&practice.currentAnswer===k&&k!==q.answer)c+=" wrong";
      return `<button class="${c}" ${done?"disabled":""} onclick="choose('${k}')">${o}</button>`;
    }).join("")}</div>`;
  }else{
    input=`<div class="fill-row">
      <input id="fill" class="fill" placeholder="${q.id===14?'两空用分号隔开':'请输入答案'}" value="${practice.currentAnswer||""}" ${done?"disabled":""} oninput="practice.currentAnswer=this.value" onkeydown="if(event.key==='Enter')submitFill()">
      <button class="primary" ${done?"disabled":""} onclick="submitFill()">答题</button>
    </div>`;
  }
  let answer="";
  if(done){
    answer=`<div id="analysisStart" class="answer-banner ${practice.correct?'good':'bad'}">
      <b>${practice.correct?'✓ 回答正确':'✗ 回答错误'}</b><br>正确答案：<b>${answerText(q)}</b>
    </div>
    ${practice.feedback?`<div class="reinforce-note">${practice.feedback}</div>`:""}
    <div class="analysis">
      <h3>详细原理解析</h3>
      <div class="analysis-block principle"><b>① 核心原理</b>${q.principle}</div>
      <div class="analysis-block why"><b>② 为什么是这个答案</b>${q.why}</div>
      <div class="analysis-block mistake"><b>③ 易错点</b>${q.mistake}</div>
      <div class="analysis-block memory"><b>④ 快速记忆</b>${q.memory}</div>
    </div>`;
  }
  app.innerHTML=shell(`
    <div class="card">
      <div class="qhead"><span>${q.chapter} · ${q.type==="choice"?"单选题":q.type==="truefalse"?"判断题":"填空题"}${practice.mode==="daily"?" · 今日新题":practice.mode==="review"?" · 到期复习":practice.mode==="learning"?" · 学习中":practice.mode==="chapter"?" · 本章练习":""}</span><span><span class="study-timer">⏱ <span id="qTimer">00:00</span></span> ${practice.pos+1}/${practice.queue.length}</span></div>
      <div class="progress" style="margin-bottom:15px"><div style="width:${progress}%"></div></div>
      <h2 class="qtitle">${q.q}</h2>
      ${input}
      ${answer}
      <div class="qactions">
        <button class="ghost" onclick="prevQuestion()" ${practice.pos===0?"disabled":""}>上一题</button>
        <button class="${done?'primary':'ghost'}" onclick="nextQuestion()" ${practice.pos===practice.queue.length-1&&!done?"disabled":""}>${done?"我懂了，下一题":"下一题"}</button>
      </div>
    </div>
  `,"practice");
  if(!studySessionStartedAt)startStudySession();
  const te=document.getElementById("qTimer");if(te)te.textContent=fmtSec(currentSessionSeconds());
  if(scrollToAnalysis){
    setTimeout(()=>document.getElementById("analysisStart")?.scrollIntoView({behavior:"smooth",block:"start"}),80);
  }
}
function wrongView(){
  const list=questions.filter(q=>state.wrongIds.includes(q.id));
  app.innerHTML=shell(`
    <div class="section-title"><h2>错题本</h2><span>${list.length} 题</span></div>
    ${list.length?`<div class="list">${list.map(q=>`
      <div class="wrong-card">
        <span class="tag">${q.tag}</span>
        <h4>第 ${q.id} 题 · ${q.q}</h4>
        <div class="mini">${q.memory}</div>
      </div>`).join("")}</div>
      <button class="primary" style="width:100%;margin-top:14px" onclick="startPractice('wrong')">开始错题强化</button>`
      :`<div class="card empty">目前没有错题。连续两次答对一道错题后，它会自动移出错题本。</div>`}
  `,"wrong");
}
function statsView(){
  const mastered=state.masteredIds.length;
  const answered=Object.keys(state.answers).length;
  const due=dueReviewIds().length,learning=learningIds().length,active=activeReviewCount(),mature=longTermMasteredCount();
  const tagMap={};
  questions.forEach(q=>{
    const a=state.answers[q.id];
    if(!tagMap[q.tag])tagMap[q.tag]={total:0,correct:0};
    if(a){tagMap[q.tag].total++;if(a.correct)tagMap[q.tag].correct++;}
  });
  const tags=Object.entries(tagMap).filter(([k,v])=>v.total).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));
  app.innerHTML=shell(`
    <div class="grid2">
      <div class="metric"><b>${state.stats.total}</b><span>累计作答</span></div>
      <div class="metric"><b>${accuracy()}%</b><span>累计正确率</span></div>
      <div class="metric"><b>${answered}/${questions.length}</b><span>已接触题目</span></div>
      <div class="metric"><b>${mastered}</b><span>错题重新掌握</span></div>
    </div>
    <div class="section-title"><h2>记忆曲线状态</h2><span>1·3·7·14·30·60</span></div>
    <div class="memory-grid">
      <div class="memory-stat"><b>${due}</b><span>今日到期</span></div>
      <div class="memory-stat"><b>${learning}</b><span>学习中</span></div>
      <div class="memory-stat"><b>${active}</b><span>曲线进行中</span></div>
    </div>
    <div class="card" style="margin-top:10px"><b>长期周期完成：${mature} 题</b><p class="mini">复习节点答错会重新进入学习阶段，并从新的完成日期重新开始第 1 天。</p></div>
    <div class="section-title"><h2>知识点表现</h2><span>按当前记录</span></div>
    <div class="list">
      ${tags.length?tags.map(([tag,v])=>{
        const p=Math.round(v.correct/v.total*100);
        return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${tag}</b><span class="mini">${p}%</span></div><div class="progress"><div style="width:${p}%"></div></div></div>`;
      }).join(""):`<div class="card empty">先完成几道题，这里会显示薄弱知识点。</div>`}
    </div>
    <div class="section-title"><h2>数据状态</h2><span>固定网页版</span></div>
    <div class="card"><b>当前记录：${Object.keys(state.memory||{}).length} 道题</b><p class="mini">最后保存：${state.lastSavedAt?new Date(state.lastSavedAt).toLocaleString():"尚未在固定网页保存"}<br>以后始终使用同一个网址，更新题库不会更换存储空间。</p></div>
    <div class="section-title"><h2>数据备份</h2><span>含记忆曲线进度</span></div>
    <div class="card">
      <div class="backup-actions">
        <button class="primary" onclick="exportBackup()">导出备份</button>
        <button class="ghost" onclick="importBackup()">导入备份</button>
      </div>
    </div>
    <button class="ghost" style="width:100%;margin-top:16px" onclick="resetData()">清空学习记录</button>
  `,"stats");
}
function resetData(){
  if(confirm("确定清空所有答题记录、错题、统计和记忆曲线进度吗？")){
    state=defaultState();save();toast("已清空");statsView();
  }
}
async function installApp(){
  if(!deferredPrompt){toast("请使用浏览器的“添加到主屏幕”");return;}
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  home();
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;
  if(view==="home")home();
});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("已安装到桌面");});

async function init(){
  if(window.__EMBEDDED_QUESTIONS__){
    questions=window.__EMBEDDED_QUESTIONS__;
  }else{
    try{
      const r=await fetch("questions.json");
      questions=await r.json();
    }catch(e){
      app.innerHTML=`<div class="app-shell"><div class="card" style="margin-top:30px">题库加载失败。</div></div>`;
      return;
    }
  }
  migrateMemory();
  if(location.protocol!=="file:" && "serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
  home();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&studySessionStartedAt)saveStudySession()});
window.addEventListener("pagehide",()=>{if(studySessionStartedAt)saveStudySession()});
init();
</script>
