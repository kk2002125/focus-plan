<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f9f67">
<link rel="manifest" href="./manifest.webmanifest">
<title>理解型刷题 · 固定网页版</title>
<style>
:root{
  --bg:#f4f7f5;--surface:#ffffff;--text:#1d2521;--muted:#6e7872;
  --line:#e2e9e5;--green:#109965;--green2:#0a7249;--green-soft:#eaf7f0;
  --red:#c94545;--red-soft:#fff0f0;--amber:#b77700;--amber-soft:#fff7e6;
  --shadow:0 8px 28px rgba(24,45,34,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{overscroll-behavior-y:none}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{max-width:820px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;margin:0 -12px;padding:12px 14px 10px;background:rgba(244,247,245,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,233,229,.75)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#11ad71,#08764b);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 6px 16px rgba(16,153,101,.25)}
.top-action{border:0;background:var(--surface);padding:8px 11px;border-radius:11px;color:var(--green2);font-weight:700;box-shadow:var(--shadow)}
.content{padding:14px 0 18px}
.hero{background:linear-gradient(145deg,#0f9f67,#0b7c50);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(15,159,103,.2)}
.hero h1{font-size:24px;margin:0 0 8px}
.hero p{margin:0;opacity:.9;line-height:1.55}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.hero-stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:11px 8px;text-align:center}
.hero-stat b{display:block;font-size:21px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.section-title h2{font-size:18px;margin:0}
.section-title span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.chapter-card{display:flex;align-items:center;gap:14px}
.chapter-icon{width:50px;height:50px;border-radius:15px;background:var(--green-soft);color:var(--green2);display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto}
.chapter-info{flex:1;min-width:0}
.chapter-info h3{margin:0 0 5px;font-size:17px}
.chapter-info p{margin:0;color:var(--muted);font-size:13px}
.progress{height:8px;border-radius:999px;background:#e4ebe7;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--green);border-radius:999px}
.primary{border:0;background:var(--green);color:#fff;padding:12px 14px;border-radius:13px;font-weight:800}
.ghost{border:0;background:#eef2ef;color:#33413a;padding:12px 14px;border-radius:13px;font-weight:700}
.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.bottom-nav-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav-btn{border:0;background:transparent;padding:7px 4px 4px;color:#758079;border-radius:12px;font-size:12px}
.nav-btn .ico{display:block;font-size:21px;line-height:1.2;margin-bottom:2px}
.nav-btn.active{background:#edf8f2;color:var(--green2);font-weight:800}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:13px}
.qtitle{font-size:20px;line-height:1.65;font-weight:750;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{width:100%;border:1.5px solid var(--line);background:#fff;text-align:left;border-radius:15px;padding:14px 15px;line-height:1.5;font-size:16px}
.option.selected{border-color:var(--green);background:#f0faf5}
.option.correct{border-color:#158655;background:#eaf8f1}
.option.wrong{border-color:var(--red);background:var(--red-soft)}
.fill-row{display:flex;gap:8px}
.fill{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;background:#fff}
.fill:focus{border-color:var(--green)}
.answer-banner{margin-top:15px;padding:14px;border-radius:14px;line-height:1.55}
.answer-banner.good{background:var(--green-soft);color:#0d6841}
.answer-banner.bad{background:var(--red-soft);color:#a53131}
.analysis{margin-top:14px;border-top:1px dashed #d6ded9;padding-top:10px}
.analysis h3{font-size:17px;margin:4px 0 10px}
.analysis-block{padding:13px 14px;border-radius:14px;margin:9px 0;line-height:1.68;font-size:15px}
.analysis-block b{display:block;margin-bottom:3px}
.analysis-block.principle{background:#eef8f3}
.analysis-block.why{background:#f5f7f6}
.analysis-block.mistake{background:#fff3ee}
.analysis-block.memory{background:var(--amber-soft)}
.qactions{display:flex;gap:9px;margin-top:15px}
.qactions button{flex:1}
.reinforce-note{margin-top:10px;color:var(--amber);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.metric b{display:block;font-size:26px;color:var(--green2);margin-bottom:4px}
.metric span{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px}
.wrong-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.wrong-card h4{margin:0 0 7px;font-size:15px;line-height:1.5}
.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f0;color:#536059}
.mini{font-size:13px;color:var(--muted);line-height:1.55}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.install-tip{background:#fff8e6;border:1px solid #f0dfb5;border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.55;color:#79530a;margin-top:10px}
.plan-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.plan-input{width:92px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:11px 12px;outline:none;text-align:center;font-weight:800}
.plan-input:focus{border-color:var(--green)}
.quick-counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.quick-counts button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 11px;font-size:13px}
.quick-counts button.active{background:var(--green-soft);border-color:#bde3d0;color:var(--green2);font-weight:800}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.backup-note{margin-top:10px;font-size:12px;line-height:1.65;color:var(--muted)}
.memory-card{border:1px solid #cfe9dc;background:linear-gradient(145deg,var(--surface),var(--green-soft));border-radius:18px;padding:16px}
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.memory-stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center}
.memory-stat b{display:block;font-size:21px;color:var(--green2)}
.memory-stat span{font-size:12px;color:var(--muted)}
.memory-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.memory-hint{margin-top:10px;padding:10px 11px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:12px;line-height:1.6;color:var(--muted)}
.status-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green-soft);color:var(--green2);font-size:12px;font-weight:800}


.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);background:#1f2924;color:#fff;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  .app-shell{padding-left:9px;padding-right:9px}
  .topbar{margin-left:-9px;margin-right:-9px}
  .hero{padding:18px 16px;border-radius:19px}
  .hero h1{font-size:22px}
  .qtitle{font-size:18px}
  .analysis-block{font-size:14px}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111814;--surface:#18211c;--text:#eaf2ed;--muted:#9aa79f;--line:#2a3730;--green-soft:#173328;--red-soft:#351f1f;--amber-soft:#332a18;--shadow:none}
  .topbar{background:rgba(17,24,20,.94)}
  .option,.fill{background:#18211c;color:var(--text)}
  .ghost{background:#25312b;color:#d7e1db}
  .analysis-block.why{background:#202a25}
  .analysis-block.mistake{background:#321f1b}
  .bottom-nav{background:rgba(24,33,28,.97)}
}

.study-timer{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;color:var(--green2);font-weight:800;font-size:13px}
.check-card{margin-top:10px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.check-stat{text-align:center;background:var(--green-soft);border-radius:12px;padding:10px 5px}
.check-stat b{display:block;font-size:20px;color:var(--green2)}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.calendar-nav button{border:0;background:#eef2ef;color:var(--text);border-radius:10px;padding:7px 12px;font-weight:800}
.calendar-nav b{font-size:15px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-head{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal-day{border:0;min-height:38px;border-radius:10px;background:#eef2ef;color:var(--text);font-size:12px}
.cal-day.done{background:var(--green);color:#fff;font-weight:800}
.cal-day.today{outline:2px solid var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
window.__EMBEDDED_QUESTIONS__=[{"id":1,"chapter":"第一章《绪论》","type":"choice","q":"基尔霍夫电压定律适用于对（ ）列电压方程。","options":["A. 回路","B. 节点","C. 支路","D. 干路"],"answer":"A","principle":"基尔霍夫电压定律（KVL）的研究对象是闭合回路。沿任意闭合回路绕行一周，各段电压的代数和恒为 0。","why":"它本质上来自能量守恒：电荷沿闭合路径走一圈后回到原点，单位电荷的总能量变化必须为 0。","mistake":"节点对应的是 KCL（基尔霍夫电流定律），不是 KVL。","memory":"KVL 看回路，KCL 看节点。","tag":"基尔霍夫定律"},{"id":2,"chapter":"第一章《绪论》","type":"choice","q":"理想变压器主要特性不包括（ ）。","options":["A. 变换电压","B. 变换电流","C. 变换功率","D. 变换阻抗"],"answer":"C","principle":"理想变压器可以按匝数比改变电压和电流，也可以把负载阻抗折算到原边。","why":"理想情况下没有铜耗、铁耗等损耗，因此输入功率等于输出功率，即 P₁=P₂。它不是把功率变大或变小，而是电压、电流反向变化来保持功率不变。","mistake":"看到“能变电压、能变电流”容易误以为功率也被变换。理想变压器只改变电压/电流比例，不改变总功率。","memory":"理想变压器：U 变、I 变、R 变，P 不变。","tag":"变压器"},{"id":3,"chapter":"第一章《绪论》","type":"choice","q":"正弦稳态电路中，R、L 和 C 串联，它们的电压有效值分别为 4V、3V 和 6V，则它们串联的总电压有效值为（ ）。","options":["A. 7V","B. 1V","C. 5V","D. 13V"],"answer":"C","principle":"RLC 串联交流电路中，U_R 与电流同相；U_L 超前电流 90°；U_C 滞后电流 90°。","why":"所以 U_L 与 U_C 方向相反，先相减，再与 U_R 做直角合成：U = √[U_R² + (U_L-U_C)²] = √[4² + (3-6)²] = √25 = 5V。","mistake":"不能直接 4+3+6=13V，因为交流电压存在相位关系，不能普通相加。","memory":"RLC 串联总电压：先 L-C，再和 R 勾股。","tag":"RLC"},{"id":4,"chapter":"第一章《绪论》","type":"choice","q":"对于一个具有 n 个节点、b 条支路的连通电路来说，可以列出独立的 KCL 方程的数目是（ ）。","options":["A. b−1","B. n−1","C. b−n+1","D. b−n−1"],"answer":"B","principle":"KCL 对每个节点都能列方程，但所有节点方程并不全部独立。","why":"如果 n 个节点都列 KCL，最后一个节点方程能由前 n−1 个方程相加得到，所以独立方程只有 n−1 个。","mistake":"b−n+1 是独立 KVL 回路数的常见表达式，不是独立 KCL 方程数。","memory":"节点 n 个 → 独立 KCL：n−1 个。","tag":"基尔霍夫定律"},{"id":5,"chapter":"第一章《绪论》","type":"choice","q":"在正弦稳态 RLC 串联电路发生谐振后，当 ω 增加时，电路呈现（ ）。","options":["A. 电阻性","B. 电容性","C. 电感性","D. 无法确定"],"answer":"C","principle":"RLC 串联电路的总电抗 X = X_L - X_C，其中 X_L=ωL，X_C=1/(ωC)。","why":"谐振时 X_L=X_C。继续增大 ω 后，X_L 随 ω 增大，而 X_C 随 ω 增大反而减小，于是 X_L>X_C，总电抗为正，表现为电感性。","mistake":"只记住“谐振时纯电阻”还不够；频率超过谐振点后会转为电感性，低于谐振点时则为电容性。","memory":"串联 RLC：低频容性，高频感性，谐振纯阻性。","tag":"RLC"},{"id":6,"chapter":"第一章《绪论》","type":"choice","q":"当实际电流源开路时，该电流源内部（ ）。","options":["A. 有电流，有功率损耗","B. 无电流，无功率损耗","C. 有电流，无功率损耗","D. 无法确定"],"answer":"A","principle":"实际电流源可近似看成理想电流源与内阻并联。","why":"外部开路时，负载支路没有电流，但理想电流源产生的电流仍可在内部并联电阻中流动，因此内阻上有功率损耗。","mistake":"“外部开路没有输出电流”不等于“电源内部没有电流”。要区分外部支路和内部等效支路。","memory":"外面开路，里面不一定没电流。","tag":"电源模型"},{"id":7,"chapter":"第一章《绪论》","type":"choice","q":"在换路瞬间，下列说法中正确的是（ ）。","options":["A. 电感电流不能跃变","B. 电感电压必然跃变","C. 电容电流必然跃变","D. 无法确定"],"answer":"A","principle":"换路定则：电感电流 i_L 在换路瞬间不能突变；电容电压 u_C 在换路瞬间不能突变。","why":"若电感电流瞬间突变，由 u_L=L·di/dt 可知需要无穷大电压；若电容电压瞬间突变，由 i_C=C·du/dt 可知需要无穷大电流。真实电路无法提供这种无限量。","mistake":"不能突变的是电感电流和电容电压，而不是电感电压、电容电流。","memory":"电感保电流，电容保电压。","tag":"换路定则"},{"id":8,"chapter":"第一章《绪论》","type":"choice","q":"换路定则的本质是遵循（ ）。","options":["A. 电荷守恒","B. 电压守恒","C. 电流守恒","D. 能量守恒"],"answer":"D","principle":"电感和电容都是储能元件：电感储磁场能，电容储电场能。","why":"如果 i_L 或 u_C 在瞬间发生有限幅度突变，就意味着储能在零时间内发生有限变化，需要无限大的瞬时功率，这不符合实际物理过程。因此换路定则的物理本质与能量连续性、能量守恒相关。","mistake":"很多人会把 KCL 的“电荷守恒”混到这里。换路定则重点是储能元件状态量不能无条件瞬变。","memory":"换路看储能，储能不能凭空瞬变。","tag":"换路定则"},{"id":9,"chapter":"第一章《绪论》","type":"choice","q":"为了从信号中提取高频部分，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"C","principle":"高通滤波器允许高于截止频率的信号通过，抑制低频和直流成分。","why":"题目明确要提取高频部分，因此最直接对应高通滤波器。","mistake":"若题目说“只取某一个中间频段”，才更符合带通滤波器。","memory":"取高频 → 高通；取低频 → 低通。","tag":"滤波器"},{"id":10,"chapter":"第一章《绪论》","type":"choice","q":"为防止 50Hz 电网电压干扰混入信号之中，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"D","principle":"带阻滤波器会压制某一段频率，而允许该频段两侧的信号通过。阻带很窄时又常称为陷波器。","why":"50Hz 电网干扰是一个已知、固定附近频率的干扰，最典型的做法就是在 50Hz 附近设置带阻/陷波。","mistake":"直接用高通或低通虽然也可能压掉 50Hz，但往往会同时损失一大片有用频率。","memory":"去掉一个指定频率 → 带阻/陷波。","tag":"滤波器"},{"id":11,"chapter":"第一章《绪论》","type":"choice","q":"为获取信号中的直流成分，应选用（ ）。","options":["A. 低通滤波器","B. 带通滤波器","C. 高通滤波器","D. 带阻滤波器"],"answer":"A","principle":"直流分量的频率就是 0Hz，属于最低频部分。","why":"低通滤波器允许直流和低频通过，并抑制较高频率，因此适合保留直流分量。","mistake":"高通滤波器恰恰会把直流成分滤掉。","memory":"DC = 0Hz，所以要低通。","tag":"滤波器"},{"id":12,"chapter":"第一章《绪论》","type":"choice","q":"收音机用于选台的滤波器应为（ ）。","options":["A. 低通滤波器","B. 高通滤波器","C. 带通滤波器","D. 带阻滤波器"],"answer":"C","principle":"不同电台占据不同的载波频率或频道频带。","why":"选台就是从许多频率中挑出目标频率附近的一小段，同时压制其它频率，所以使用带通滤波器。","mistake":"不是只保留所有高频或所有低频，而是只保留某一段。","memory":"选一个频道 → 选一个频带 → 带通。","tag":"滤波器"},{"id":13,"chapter":"第一章《绪论》","type":"choice","q":"下列关于滞回比较器的说法，不正确的是（ ）。","options":["A. 滞回比较器有两个门限电压","B. 构成滞回比较器的集成运放工作在线性区","C. 滞回比较器电路一定外加了正反馈","D. 滞回比较器的输出电压只有两种可能，即正的最大值或负的最大值"],"answer":"B","principle":"滞回比较器又叫施密特触发器，利用正反馈形成两个不同的翻转门限。","why":"比较器工作时输出通常快速进入正饱和或负饱和，属于非线性工作状态，并非线性放大区。因此 B 错。","mistake":"运放既可以做线性放大，也可以做比较器。只要做比较器，就通常不再满足线性区的虚短条件。","memory":"滞回比较器：正反馈、双门限、输出饱和。","tag":"比较器"},{"id":14,"chapter":"第一章《绪论》","type":"fill","q":"自然界的各种物理量必须首先经过 ______ 将非电量转换为电量，即 ______。","answers":[["传感器"],["电信号","电量信号"]],"display_answer":"传感器；电信号","principle":"测量系统不能直接处理温度、压力、位移、光强等许多非电物理量，通常先要将它们转换成可测量、可传输、可处理的电信号。","why":"传感器负责完成这种“非电量 → 电量”的转换。例如光电探测器把光强转换成电流或电压。","mistake":"这类基础填空通常标准答案是传感器。","memory":"先传感，再处理。","tag":"传感器"},{"id":15,"chapter":"第一章《绪论》","type":"fill","q":"信号在频域中表示的图形或曲线称为信号的 ______。","answers":[["频谱"]],"display_answer":"频谱","principle":"一个信号既可以从时间角度看，也可以从频率角度看。","why":"把信号拆解成不同频率成分后，用频率作为横坐标表示其幅度或相位，就得到频谱。","mistake":"波形通常指时域图；频谱才是频域图。","memory":"时域看波形，频域看频谱。","tag":"频谱"},{"id":16,"chapter":"第一章《绪论》","type":"fill","q":"通过傅立叶变换可以实现信号从 ______ 到频域的变换。","answers":[["时域"]],"display_answer":"时域","principle":"傅立叶变换是时域与频域之间最核心的数学桥梁之一。","why":"输入一个随时间变化的信号 x(t)，傅立叶变换得到 X(ω)，从而看出信号中包含哪些频率以及各自的强弱和相位。","mistake":"傅立叶正变换一般说时域到频域；逆傅立叶变换则是频域回到时域。","memory":"FT：时 → 频；IFT：频 → 时。","tag":"傅立叶变换"},{"id":17,"chapter":"第一章《绪论》","type":"fill","q":"各种信号各频率分量的 ______ 随角频率变化的分布，称为该信号的幅度频谱。","answers":[["幅度","振幅"]],"display_answer":"幅度","principle":"傅立叶变换结果一般可以写成幅度 + 相位的形式。","why":"其中各个频率分量的幅度 |X(ω)| 随 ω 的变化关系，就是幅度频谱。","mistake":"不要把幅度频谱和相位频谱混淆；一个看大小，一个看相位角。","memory":"幅度频谱看 |X(ω)|。","tag":"频谱"},{"id":18,"chapter":"第一章《绪论》","type":"fill","q":"各种信号各频率分量的 ______ 随角频率变化的分布，称为该信号的相位频谱。","answers":[["相位"]],"display_answer":"相位","principle":"频域中的每一个频率成分除了有大小，还具有相位信息。","why":"各频率分量的相位角 ∠X(ω) 随角频率 ω 的变化关系，就是相位频谱。","mistake":"只看幅度频谱无法完整描述一般信号，相位信息也会影响时域波形。","memory":"相位频谱看 ∠X(ω)。","tag":"频谱"},{"id":19,"chapter":"第一章《绪论》","type":"fill","q":"周期信号的频谱都由 ______、______以及______组成。","answers":[["直流分量"],["基波分量"],["无穷多项高次谐波分量","无穷多项高次谐波"]],"display_answer":"直流分量；基波分量；无穷多项高次谐波分量","principle":"周期信号可用傅里叶级数分解为直流分量、基波分量以及各次谐波分量。","why":"其中基波频率是原信号的基本频率，高次谐波频率为基波频率的整数倍。","mistake":"不要把“基波”和“高次谐波”混为一谈。","memory":"周期频谱：直流 + 基波 + 高次谐波。","tag":"信号频谱"},{"id":20,"chapter":"第一章《绪论》","type":"fill","q":"在时间上和幅值上均是连续的信号 ______。","answers":[["称为模拟信号","模拟信号"]],"display_answer":"称为模拟信号","principle":"时间连续、幅值连续是模拟信号的基本特征。","why":"模拟信号在时间轴上连续取值，幅值也连续变化。","mistake":"不要与数字信号混淆。","memory":"时间连续 + 幅值连续 → 模拟信号。","tag":"信号分类"},{"id":21,"chapter":"第一章《绪论》","type":"fill","q":"在时间上和幅值上均是离散的信号 ______。","answers":[["称为数字信号","数字信号"]],"display_answer":"称为数字信号","principle":"时间离散、幅值离散是数字信号的典型特征。","why":"数字系统通常以离散时刻和离散数值表示信息。","mistake":"只时间离散而幅值连续的信号不属于这里所说的典型数字信号定义。","memory":"时间离散 + 幅值离散 → 数字信号。","tag":"信号分类"},{"id":22,"chapter":"第一章《绪论》","type":"fill","q":"放大电路分为 ______、______、______以及______四类。","answers":[["电压放大电路"],["电流放大电路"],["互阻放大电路"],["互导放大电路"]],"display_answer":"电压放大电路；电流放大电路；互阻放大电路；互导放大电路","principle":"按输入输出信号的电压、电流关系，放大电路可分为四类基本模型。","why":"分别对应电压→电压、电流→电流、电流→电压和电压→电流的变换关系。","mistake":"互阻与互导的输入输出量方向容易记反。","memory":"电压放大、电流放大、互阻、互导。","tag":"放大电路"},{"id":23,"chapter":"第一章《绪论》","type":"fill","q":"______、______、______、______和______等主要性能指标是衡量放大电路的标准。","answers":[["输入电阻"],["输出电阻"],["增益"],["频率响应"],["非线性失真"]],"display_answer":"输入电阻；输出电阻；增益；频率响应；非线性失真","principle":"放大电路不能只看“放大多少”，还要考察输入输出特性、频率特性以及失真。","why":"这些指标共同反映放大电路的信号传输、带负载和保真能力。","mistake":"性能指标不只包括增益。","memory":"输入、输出、增益、频响、失真。","tag":"放大电路"},{"id":24,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的增益实际上反映了______的能力。","answers":[["电路在输入信号控制下，将供电电源能量转换为信号能量","将供电电源能量转换为信号能量"]],"display_answer":"电路在输入信号控制下，将供电电源能量转换为信号能量","principle":"放大并不是凭空产生能量，而是输入信号控制电路，把电源提供的能量转换到输出信号中。","why":"因此增益反映的是能量转换能力，而不是简单的“制造能量”。","mistake":"不要把放大理解成输出能量凭空增加。","memory":"放大：小信号控制电源能量。","tag":"放大电路"},{"id":25,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的电压增益和电流增益在工程上常用“分贝”表示，其表达式分别是 ______、______。","answers":[["20lg|Av|","20lgAv","20 lg|Av|","20lg|A_v|"],["20lg|Ai|","20lgAi","20 lg|Ai|","20lg|A_i|"]],"display_answer":"20lg|Av|；20lg|Ai|（dB）","principle":"电压增益和电流增益用分贝表示时采用20lg形式。","why":"电压、电流属于幅值量，分贝表达式为20倍常用对数；功率增益则使用10lg。","mistake":"不要把功率增益的10lg与电压、电流增益的20lg混淆。","memory":"电压/电流：20lg；功率：10lg。","tag":"增益与分贝"},{"id":26,"chapter":"第一章《绪论》","type":"fill","q":"放大电路的频率响应指的是，在输入正弦信号情况下，输出随______的稳态响应。","answers":[["输入信号频率连续变化","输入信号频率","频率连续变化"]],"display_answer":"输入信号频率连续变化","principle":"频率响应描述放大电路在不同输入频率下的稳态输出特性。","why":"输入信号保持为正弦形式，只连续改变其频率，再观察输出如何变化。","mistake":"频率响应不是单纯指某一个固定频率下的输出。","memory":"改输入频率，看稳态输出。","tag":"频率响应"},{"id":27,"chapter":"第一章《绪论》","type":"fill","q":"幅频响应是指______之间的关系。","answers":[["电压增益的模与角频率","电压增益模与角频率"]],"display_answer":"电压增益的模与角频率","principle":"幅频响应关注增益幅值随角频率的变化。","why":"对复数电压增益取模，得到幅值，再观察它随ω的变化。","mistake":"相位随频率变化属于相频响应。","memory":"幅频看大小，相频看相位。","tag":"频率响应"},{"id":28,"chapter":"第一章《绪论》","type":"fill","q":"相频响应是指______之间的关系。","answers":[["放大电路输出与输入正弦电压信号的相位差与角频率","输出与输入正弦电压信号的相位差与角频率"]],"display_answer":"放大电路输出与输入正弦电压信号的相位差与角频率","principle":"相频响应描述输出相对于输入的相位差随角频率的变化。","why":"同一频率下，输入和输出可能存在相位超前或滞后；改变ω后观察这种相位差如何变化。","mistake":"不要把相位差和幅值变化混在一起。","memory":"相频看相位差随ω。","tag":"频率响应"},{"id":29,"chapter":"第一章《绪论》","type":"truefalse","q":"在一阶电路中，时间常数的大小不影响电路过渡过程持续的时间。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"一阶电路的时间常数τ直接决定过渡过程快慢。τ越大，达到稳态所需时间通常越长。","why":"时间常数不是只影响幅值，它还决定过渡过程的时间尺度。","mistake":"时间常数不是只影响幅值，它还决定过渡过程的时间尺度。","memory":"τ大 → 变化慢；τ小 → 变化快。","tag":"一阶电路"},{"id":30,"chapter":"第一章《绪论》","type":"truefalse","q":"三要素法可以计算一阶电路中各处的电压和电流。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"三要素法通过初始值、最终值和时间常数描述一阶电路响应。","why":"只要电路可等效为一阶动态电路，就可用三要素法求相关响应。","mistake":"只要电路可等效为一阶动态电路，就可用三要素法求相关响应。","memory":"三要素：初始值、最终值、时间常数。","tag":"一阶电路"},{"id":31,"chapter":"第一章《绪论》","type":"truefalse","q":"当两个线圈的耦合系数等于1时为全耦合。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"耦合系数k反映两个线圈磁耦合程度，k=1表示理想全耦合。","why":"此时一个线圈产生的磁通全部链过另一个线圈。","mistake":"此时一个线圈产生的磁通全部链过另一个线圈。","memory":"k=1 → 全耦合。","tag":"耦合电路"},{"id":32,"chapter":"第一章《绪论》","type":"truefalse","q":"无源线性二端口无论是否对称，Z参数中只有2个参数是独立的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"一般线性二端口的Z参数有4个参数；只有在满足互易、对称等附加条件时才可能减少独立参数。","why":"题目说“无论是否对称”过于绝对。","mistake":"题目说“无论是否对称”过于绝对。","memory":"一般二端口：4参数；附加条件才减少。","tag":"二端口网络"},{"id":33,"chapter":"第一章《绪论》","type":"truefalse","q":"非正弦周期量的有效值等于它各次谐波有效值之和。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"非正弦周期量的有效值应按各谐波有效值的平方和开方计算，而不是直接相加。","why":"不同谐波正交，不能把有效值直接做算术加法。","mistake":"不同谐波正交，不能把有效值直接做算术加法。","memory":"有效值：平方和开方。","tag":"非正弦周期量"},{"id":34,"chapter":"第一章《绪论》","type":"truefalse","q":"对称三相电路中，线电压与相电压相等。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"对称三相系统中，线电压与相电压的幅值通常相差√3，且存在30°相位差。","why":"不要把线量和相量直接等同。","mistake":"不要把线量和相量直接等同。","memory":"Y接：线电压=√3相电压。","tag":"三相电路"},{"id":35,"chapter":"第一章《绪论》","type":"truefalse","q":"空心变压器副边如接感性负载，则反映到原边的引入电抗一定呈容性。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"感性负载反映到原边仍表现为相应的感性性质，不会因为反映就必然变成容性。","why":"反射阻抗会按匝数比折算，性质不会无故从感性变为容性。","mistake":"反射阻抗会按匝数比折算，性质不会无故从感性变为容性。","memory":"感性负载 → 反射仍为感性。","tag":"变压器"},{"id":36,"chapter":"第一章《绪论》","type":"truefalse","q":"叠加定理只适用于线性电路求电压和电流，不适用于求功率。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"叠加定理适用于线性电路中的电压和电流响应，功率与电压、电流的平方有关，一般不能直接叠加。","why":"不能把各独立源单独作用得到的功率直接相加。","mistake":"不能把各独立源单独作用得到的功率直接相加。","memory":"叠加：电压、电流可叠加；功率不能直接叠加。","tag":"叠加定理"},{"id":37,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数仅与网络的结构和参数有关，与激励的函数形式无关。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"在线性时不变网络中，网络函数由网络结构和参数决定，而与具体激励信号形式无关。","why":"激励决定输出的具体波形，但网络函数本身是系统特性。","mistake":"激励决定输出的具体波形，但网络函数本身是系统特性。","memory":"网络函数看系统，不看具体激励。","tag":"网络函数"},{"id":38,"chapter":"第一章《绪论》","type":"truefalse","q":"当两互感线圈的电流同时流出同名端时，两个电流所产生的磁场是互相削弱的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"两个电流同时流出同名端时，其磁场作用属于助磁关系，而不是削弱。","why":"判断互感正负和助磁/反磁要结合同名端与电流方向。","mistake":"判断互感正负和助磁/反磁要结合同名端与电流方向。","memory":"同名端：同进或同出 → 助磁。","tag":"互感"},{"id":39,"chapter":"第一章《绪论》","type":"truefalse","q":"有效值、角频率和初相位称为正弦量的三要素。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"正弦量的三要素通常是最大值（或有效值）、角频率和初相位。题目把有效值列入三要素在有些教材表述中可成立，但本题按题库语境需结合原教材定义。","why":"如果教材把幅值用有效值表示，则需特别注意题库的原始定义。","mistake":"如果教材把幅值用有效值表示，则需特别注意题库的原始定义。","memory":"三要素核心：幅值、角频率、初相位。","tag":"正弦量"},{"id":40,"chapter":"第一章《绪论》","type":"truefalse","q":"电压、电流的参考方向可任意指定，指定的参考方向不同，不影响问题最后的结论。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"参考方向是分析电路时人为规定的正方向。只要整个计算过程保持一致，改变参考方向只会改变符号表示。","why":"参考方向改变后，相关量的正负号会相应变化，但物理结论不变。","mistake":"参考方向改变后，相关量的正负号会相应变化，但物理结论不变。","memory":"参考方向可任意选，但必须前后一致。","tag":"参考方向"},{"id":41,"chapter":"第一章《绪论》","type":"truefalse","q":"在使用节点电压法对电路做分析时，与电流源串联的电阻不计入自电导或互电导。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"理想电流源串联电阻时，外部端口电流由理想电流源确定，串联电阻不参与节点导纳关系。","why":"节点电压法建立的是节点电流与节点电压之间的导纳关系。","mistake":"节点电压法建立的是节点电流与节点电压之间的导纳关系。","memory":"理想电流源串联电阻：节点导纳计算中不计该电阻。","tag":"节点电压法"},{"id":42,"chapter":"第一章《绪论》","type":"truefalse","q":"一个实际的电感线圈，在任何情况下呈现的电特性都是感性的。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"实际线圈存在寄生电容等因素，在一定高频条件下可能呈现容性。","why":"实际器件不是理想电感，频率升高后寄生参数会影响性质。","mistake":"实际器件不是理想电感，频率升高后寄生参数会影响性质。","memory":"实际电感：低频偏感性，高频可能转为容性。","tag":"实际电感"},{"id":43,"chapter":"第一章《绪论》","type":"truefalse","q":"某感性负载，电压的初相位一定小于电流的初相位，即U滞后于I。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"感性负载中电压超前电流，理想电感中电压超前电流90°。","why":"“感性”对应U领先I，而不是U滞后I。","mistake":"“感性”对应U领先I，而不是U滞后I。","memory":"感性：U超前I。","tag":"正弦交流电路"},{"id":44,"chapter":"第一章《绪论》","type":"truefalse","q":"中线的作用就是使不对称Y接负载的端电压保持对称。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"三相四线制中，中线可以提供不对称负载的零序电流通路，使各相端电压保持对称。","why":"不对称Y接负载没有可靠中性点时，各相端电压可能发生偏移。","mistake":"不对称Y接负载没有可靠中性点时，各相端电压可能发生偏移。","memory":"中线：稳定不对称Y接负载的相电压。","tag":"三相电路"},{"id":45,"chapter":"第一章《绪论》","type":"truefalse","q":"负载作星形连接时，必有线电流等于相电流。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"星形连接中，每条线与对应相负载串联，因此线电流就是相电流。","why":"这是星形连接电流关系的基本特点。","mistake":"这是星形连接电流关系的基本特点。","memory":"Y接：I线=I相。","tag":"三相电路"},{"id":46,"chapter":"第一章《绪论》","type":"truefalse","q":"两个串联互感线圈的感应电压极性，取决于电流流向，与同名端无关。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"互感电压极性不仅与电流变化方向有关，还必须根据同名端判断正负。","why":"忽略同名端会导致互感项正负号判断错误。","mistake":"忽略同名端会导致互感项正负号判断错误。","memory":"互感极性：电流方向 + 同名端共同决定。","tag":"互感"},{"id":47,"chapter":"第一章《绪论》","type":"truefalse","q":"不同频率的电压和电流不能构成平均功率，也不能构成瞬时功率。","options":["A. 对","B. 错"],"answer":"B","display_answer":"错","principle":"任意时刻电压和电流都可以相乘得到瞬时功率p(t)=u(t)i(t)。不同频率信号的平均功率还要结合具体波形和平均区间判断。","why":"不能因为频率不同就否定瞬时功率的定义。","mistake":"不能因为频率不同就否定瞬时功率的定义。","memory":"瞬时功率永远看p(t)=u(t)i(t)。","tag":"功率"},{"id":48,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数分母部分多项式等于零的根，称为网络函数的极点，它恰好为网络的固有频率。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"网络函数的极点是其分母多项式的根，并与系统的自然响应、固有模态密切相关。","why":"零点来自分子，极点来自分母。","mistake":"零点来自分子，极点来自分母。","memory":"分母根 → 极点。","tag":"网络函数"},{"id":49,"chapter":"第一章《绪论》","type":"truefalse","q":"网络函数的原函数即为该电路的单位冲激响应。","options":["A. 对","B. 错"],"answer":"A","display_answer":"对","principle":"在线性时不变网络的零初始条件下，网络函数与单位冲激响应的拉普拉斯变换互为对应关系。","why":"网络函数是冲激响应的拉普拉斯变换，反变换可得到冲激响应。","mistake":"网络函数是冲激响应的拉普拉斯变换，反变换可得到冲激响应。","memory":"H(s) ↔ h(t)，反变换得到冲激响应。","tag":"网络函数"},{"id":50,"chapter":"第二章《运算放大器》","type":"choice","q":"为了工作在线性工作区，应使集成运放电路处于（ ）状态。","options":["A. 正反馈","B. 负反馈","C. 正反馈或无反馈","D. 负反馈或无反馈"],"answer":"B","principle":"集成运放要在线性放大区稳定工作，通常必须引入负反馈。","why":"负反馈把输出的一部分送回输入端并抵消输入变化，使运放不易进入饱和，从而保持线性放大关系。","mistake":"正反馈会强化输入差值，常用于比较、迟滞等非线性电路。","memory":"线性区 → 负反馈。","tag":"运放工作区"},{"id":51,"chapter":"第二章《运算放大器》","type":"choice","q":"为了工作在非线性区，应使集成运放电路处于（ ）状态。","options":["A. 正反馈","B. 负反馈","C. 正反馈或无反馈","D. 负反馈或无反馈"],"answer":"C","principle":"集成运放的非线性应用通常工作在开环（无反馈）或正反馈状态。","why":"此时运放很容易因极小的输入差模电压而进入正、负饱和，输出不再与输入保持线性比例关系。","mistake":"不要把线性区的负反馈条件套到比较器等非线性电路。","memory":"非线性区 → 正反馈或无反馈。","tag":"运放工作区"},{"id":52,"chapter":"第二章《运算放大器》","type":"choice","q":"关于理想集成运放的输入电阻和输出电阻论述正确的是（ ）","options":["A. 输入电阻为∞，输出电阻为0","B. 输入电阻为0，输出电阻为∞","C. 输入电阻和输出电阻均为∞","D. 输入电阻和输出电阻均为0"],"answer":"A","principle":"理想运放的输入电阻趋于无穷大，输出电阻趋于零。","why":"输入电阻无限大意味着输入端几乎不吸收电流；输出电阻为零意味着输出电压不受负载电流影响。","mistake":"输入电阻与输出电阻的理想化方向正好相反。","memory":"输入∞，输出0。","tag":"理想运放"},{"id":53,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运算放大器能处理（ ）","options":["A. 直流信号","B. 交流信号","C. 交流信号和直流信号"],"answer":"C","principle":"集成运放通常采用直接耦合结构，因此既能放大直流信号，也能处理交流信号。","why":"没有隔直电容限制时，从零频到一定高频范围内的信号都可以被运放处理。","mistake":"不要把运放只理解成交流放大器。","memory":"运放：交、直流都能处理。","tag":"运放基本特性"},{"id":54,"chapter":"第二章《运算放大器》","type":"choice","q":"为使电路输入电阻高、输出电阻低，应引入（ ）","options":["A. 电压串联负反馈","B. 电压并联负反馈","C. 电流串联负反馈","D. 电流并联负反馈"],"answer":"A","principle":"串联负反馈提高输入电阻；电压负反馈降低输出电阻。","why":"要同时得到高输入电阻和低输出电阻，应选择“电压串联负反馈”。","mistake":"可把反馈类型拆成两部分判断：串联/并联决定输入电阻，电压/电流决定输出电阻。","memory":"高入低出 → 电压串联负反馈。","tag":"负反馈"},{"id":55,"chapter":"第二章《运算放大器》","type":"choice","q":"在由运放组成的电路中，运放工作在非线性状态的电路是（ ）","options":["A. 反相放大器","B. 差值放大器","C. 有源滤波器","D. 电压比较器"],"answer":"D","principle":"电压比较器通常让运放工作在开环或正反馈状态，属于非线性应用。","why":"比较器输出主要取正、负饱和值，不再与输入按固定比例变化。","mistake":"反相放大、差值放大、有源滤波通常利用负反馈在线性区工作。","memory":"比较器 → 非线性。","tag":"非线性应用"},{"id":56,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放工作在线性放大区，由理想工作条件得出两个重要规律是（ ）","options":["A. U+=U−=0，i+=i−","B. U+=U−=0，i+=i−=0","C. U+=U−，i+=i−=0","D. U+=U−=0，i+≠i−"],"answer":"C","principle":"理想运放在线性区满足“虚短”和“虚断”。","why":"开环增益趋于无穷大且输出有限，所以两输入端电压近似相等；输入电阻趋于无穷大，所以两个输入端电流近似为零。","mistake":"虚短只是 U+≈U−，并不意味着两个输入端都一定为0；只有特定电路中才会出现虚地。","memory":"线性理想运放：U+=U−，i+=i−=0。","tag":"虚短虚断"},{"id":57,"chapter":"第二章《运算放大器》","type":"choice","q":"分析集成运放的非线性应用电路时，不能使用的概念是（ ）","options":["A. 虚地","B. 虚短","C. 虚断"],"answer":"B","principle":"“虚短”成立的前提是运放工作在线性区，并且通常存在深度负反馈。","why":"非线性区中输出可能已经饱和，输入端电压不再近似相等，因此不能使用虚短。输入端电流仍近似为零，所以虚断仍可用。","mistake":"不要把虚短、虚断当成所有运放电路都同时成立。","memory":"非线性：可虚断，不可虚短。","tag":"虚短虚断"},{"id":58,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放的线性应用存在（ ）现象。","options":["A. 虚地","B. 虚断","C. 虚断和虚短"],"answer":"C","principle":"理想运放在线性负反馈条件下同时满足虚断和虚短。","why":"输入电阻趋于无穷大形成虚断；开环增益趋于无穷大且输出有限形成虚短。","mistake":"“虚地”只是在某些具体电路中由虚短进一步得到，不是所有线性应用都有。","memory":"线性应用：虚断＋虚短。","tag":"虚短虚断"},{"id":59,"chapter":"第二章《运算放大器》","type":"choice","q":"非线性应用存在（ ）现象。","options":["A. 虚地","B. 虚断","C. 虚断和虚短"],"answer":"B","principle":"理想运放即使工作在非线性区，输入电阻仍可近似无穷大。","why":"因此输入端电流仍近似为零，即存在虚断；但由于不再处于线性放大状态，虚短不成立。","mistake":"比较器等非线性电路中不能套用 U+≈U−。","memory":"非线性：只保留虚断。","tag":"虚短虚断"},{"id":60,"chapter":"第二章《运算放大器》","type":"choice","q":"理想运放的两个重要结论是（ ）","options":["A. 虚短与虚地","B. 虚断与虚短","C. 断路与短路"],"answer":"B","principle":"理想运放在线性区分析中最常用的两个结论是虚短和虚断。","why":"虚短描述两输入端电压近似相等；虚断描述两个输入端电流近似为零。","mistake":"虚地不是普遍结论，只出现在某些具体拓扑中。","memory":"理想运放两结论：虚短、虚断。","tag":"虚短虚断"},{"id":61,"chapter":"第二章《运算放大器》","type":"choice","q":"集成运放一般分为两个工作区，它们分别是（ ）","options":["A. 正反馈与负反馈","B. 线性与非线性","C. 虚断和虚短"],"answer":"B","principle":"按输入输出关系，集成运放通常分为线性工作区和非线性工作区。","why":"在线性区输出与输入保持近似线性关系；在非线性区输出通常趋向饱和值。","mistake":"正反馈、负反馈是反馈方式，不是工作区名称。","memory":"运放两区：线性、非线性。","tag":"运放工作区"},{"id":62,"chapter":"第二章《运算放大器》","type":"choice","q":"有两个空载放大倍数相同，输入和输出电阻不同的放大器甲和乙，对同一信号源进行放大，在负载开路的情况下，测得甲的输出电压小，这说明甲的（ ）","options":["A. 输入电阻大","B. 输入电阻小","C. 输出电阻大","D. 输出电阻小"],"answer":"B","principle":"负载开路时，输出端几乎不受输出电阻影响，实际输出大小主要取决于信号源与放大器输入电阻之间的分压。","why":"两者空载电压增益相同而甲输出更小，说明甲从信号源取得的输入电压更小，即甲的输入电阻更小、对信号源负载作用更强。","mistake":"题目已经说明负载开路，因此不能优先从输出电阻差异解释。","memory":"空载比较输出 → 看输入端分压。","tag":"输入输出电阻"},{"id":63,"chapter":"第二章《运算放大器》","type":"fill","q":"理想运算放大器的性能参数均被理想化，即输入电阻为 ______，输出电阻为 ______，开环电压增益为 ______，输出电压为 ______。","answers":[["∞","无穷大","无穷"],["0","零"],["∞","无穷大","无穷"],["有限值","有限","有限的值"]],"display_answer":"∞；0；∞；有限值","principle":"理想运放常取输入电阻趋于无穷大、输出电阻趋于零、开环电压增益趋于无穷大。在线性工作条件下，输出电压应为有限值。","why":"正因为开环增益趋于无穷大而输出仍是有限值，差模输入电压必须趋近于0，从而得到“虚短”；输入电阻趋于无穷大则得到“虚断”。","mistake":"最后一空不是说理想运放的输出一定为无穷大；在线性分析中输出是有限值。","memory":"输入∞、输出0、增益∞、输出有限。","tag":"理想运放"},{"id":64,"chapter":"第二章《运算放大器》","type":"fill","q":"运算放大器有两个工作区。在 ______ 区工作时，放大器放大小信号；当输入为大信号时，它工作在 ______ 区，输出电压扩展到 ______。","answers":[["线性","线性区"],["非线性","非线性区"],["正负饱和电压","正、负饱和电压","正负饱和值","正、负饱和值","正负饱和电压值"]],"display_answer":"线性；非线性；正、负饱和电压","principle":"小信号且有适当负反馈时，运放通常工作在线性区；输入过大后会离开线性区进入饱和。","why":"进入非线性区后，输出电压不再按比例增大，而是接近正、负饱和电压。","mistake":"输出达到饱和后再增加输入，并不会继续按原增益放大。","memory":"小信号线性，大信号非线性，输出到饱和。","tag":"运放工作区"},{"id":65,"chapter":"第二章《运算放大器》","type":"fill","q":"运算放大器工作在线性区时，具有 ______ 和 ______ 两个特点，凡是线性电路都可以利用这两个概念来分析电路的输入、输出关系。","answers":[["虚短"],["虚断"]],"display_answer":"虚短；虚断","principle":"理想运放在线性区的核心分析规则是虚短和虚断。","why":"虚短表示两输入端电位近似相等，虚断表示输入端电流近似为零。","mistake":"顺序不影响理解，但答题时按教材顺序填写更稳妥。","memory":"线性运放：虚短＋虚断。","tag":"虚短虚断"},{"id":66,"chapter":"第二章《运算放大器》","type":"fill","q":"反相比例运算电路中集成运放反相输入端为 ______ 点，而同相比例运算电路中集成运放两个输入端对地的电压基本上 ______。","answers":[["虚地","虚地点"],["相等","相同","相等的"]],"display_answer":"虚地；相等","principle":"反相比例电路的同相端接地，在虚短条件下反相端电位也近似为0，因此形成虚地；同相比例电路两输入端满足虚短。","why":"虚地并不是实际接地，只是电位近似为0。","mistake":"虚地≠真实接地，反相输入端与地之间没有直接导线连接。","memory":"反相端常见虚地；同相比例两端电压相等。","tag":"比例运算"},{"id":67,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 比例运算电路的输入电流等于零，而 ______ 比例运算电路的输入电流等于流过反馈电阻的电流。","answers":[["同相","同相比例"],["反相","反相比例"]],"display_answer":"同相；反相","principle":"同相比例运算的信号直接加在运放同相输入端，理想运放输入端电流为0；反相比例运算中电流经输入电阻流入虚地点，并通过反馈电阻流走。","why":"反相端本身不吸收电流，因此根据KCL，输入支路电流等于反馈支路电流。","mistake":"“运放输入端电流为0”不等于反相电路的输入电阻中没有电流。","memory":"同相输入端不取流；反相输入流=反馈流。","tag":"比例运算"},{"id":68,"chapter":"第二章《运算放大器》","type":"fill","q":"______ 运算电路的电压增益 Au≥1；______ 运算电路的电压增益 Au<0。","answers":[["同相比例","同相"],["反相比例","反相"]],"display_answer":"同相比例；反相比例","principle":"同相比例运算的闭环电压增益为 1+Rf/R1，因此至少为1；反相比例运算的闭环增益为 −Rf/R1，因此小于0。","why":"增益符号反映输出与输入的相位关系：反相电路输出与输入相反。","mistake":"Au<0不是说幅值小于0，而是表示相位反相。","memory":"同相≥1；反相<0。","tag":"比例运算"},{"id":69,"chapter":"第二章《运算放大器》","type":"fill","q":"反相求和运算电路中集成运放的反相输入端为虚地点，流过反馈电阻的电流等于各输入端电流的 ______。","answers":[["代数和","代数之和"]],"display_answer":"代数和","principle":"反相输入端为虚地点且运放输入端近似不吸收电流，因此可直接对该节点列KCL。","why":"各输入支路电流汇聚到反相输入节点后都流经反馈支路，所以反馈电流等于各输入电流的代数和。","mistake":"如果定义的电流参考方向不同，应按代数关系处理，不能只看数值大小相加。","memory":"反相求和：反馈电流=各输入电流代数和。","tag":"求和运算"}];
</script>
<script>
const APP_VERSION = "1.3.0";
const STORE_KEY = "undergrad_quiz_pwa_v1_test";
const LEGACY_SHARED_STORE_KEY = "undergrad_quiz_pwa_v1";
const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
let questions = [];
let deferredPrompt = null;
let view = "home";
let practice = null;

function defaultState(){
  return {
    answers:{},
    stats:{total:0,correct:0},
    wrongIds:[],
    masteredIds:[],
    history:[],
    lastQuestionId:null,
    dailyCount:10,
    memory:{},
    dayLogs:{},
    checkins:{},
    studySecondsByDay:{},
    studyDayStartHour:4,
    dataVersion:2,
    lastSavedAt:null,
    dayLogs:{},checkins:{},studySecondsByDay:{}
  };
}
function loadState(){
  try{
    let raw=localStorage.getItem(STORE_KEY);
    if(!raw){
      const legacy=localStorage.getItem(LEGACY_SHARED_STORE_KEY);
      if(legacy){ localStorage.setItem(STORE_KEY,legacy); raw=legacy; }
    }
    return {...defaultState(), ...(JSON.parse(raw||"{}"))};
  }catch(e){return defaultState();}
}
let state = loadState();
function save(){state.lastSavedAt=Date.now();localStorage.setItem(STORE_KEY, JSON.stringify(state));}
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1600);
}
function nav(active){
  return `<div class="bottom-nav"><div class="bottom-nav-inner">
    ${[
      ["home","⌂","首页"],["practice","✎","刷题"],["wrong","↺","错题"],["stats","▦","数据"]
    ].map(([k,i,t])=>`<button class="nav-btn ${active===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join("")}
  </div></div>`;
}
function shell(content, active="home", action=""){
  return `<div class="app-shell">
    <div class="topbar"><div class="toprow">
      <div class="brand"><div class="logo">题</div><span>理解型刷题 <small style="font-size:12px;color:#7b8780;font-weight:600">Web v1.5.3</small></span></div>
      ${action}
    </div></div>
    <main class="content">${content}</main>${nav(active)}
  </div>`;
}
function accuracy(){
  return state.stats.total ? Math.round(state.stats.correct/state.stats.total*100) : 0;
}
function chapterProgress(){
  const done = questions.filter(q=>state.answers[q.id]).length;
  return Math.round(done/questions.length*100)||0;
}

const REVIEW_DAYS=[1,3,7,14,30,60];
const DAY_MS=24*60*60*1000;

function todayKey(ts=Date.now()){
  const d=new Date(ts);
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function startOfDay(ts=Date.now()){
  const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();
}
function addDaysFrom(ts,days){return startOfDay(ts)+days*DAY_MS;}
function formatDay(ts){
  if(!ts)return "—";
  const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日`;
}
function memoryFor(id){
  if(!state.memory || typeof state.memory!=="object")state.memory={};
  return state.memory[id]||null;
}
function ensureLearningMemory(id){
  if(!state.memory || typeof state.memory!=="object")state.memory={};
  if(!state.memory[id])state.memory[id]={phase:"learning",todayPasses:0,learningDay:todayKey(),cycleStart:null,stage:0,dueTs:null,lapses:0};
  return state.memory[id];
}
function migrateMemory(){
  let changed=false;
  if(!state.memory || typeof state.memory!=="object"){state.memory={};changed=true;}
  (state.wrongIds||[]).forEach(id=>{
    if(!state.memory[id]){
      state.memory[id]={phase:"learning",todayPasses:0,learningDay:todayKey(),cycleStart:null,stage:0,dueTs:null,lapses:0};
      changed=true;
    }
  });
  if(changed)save();
}
function todayUniqueDone(){
  const k=todayKey();
  return new Set(state.history.filter(h=>todayKey(h.ts)===k).map(h=>h.id)).size;
}
function learningIds(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="learning").map(q=>q.id);
}
function dueReviewIds(){
  const now=Date.now();
  return questions.filter(q=>{
    const m=memoryFor(q.id);
    return m?.phase==="review" && m.dueTs && m.dueTs<=now;
  }).map(q=>q.id);
}
function activeReviewCount(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="review").length;
}
function longTermMasteredCount(){
  return questions.filter(q=>memoryFor(q.id)?.phase==="mastered").length;
}
function newQuestionIdsInOrder(){
  let base=[...questions],start=0;
  if(state.lastQuestionId){
    const i=base.findIndex(q=>q.id===state.lastQuestionId);
    if(i>=0)start=(i+1)%base.length;
  }
  const ordered=base.slice(start).concat(base.slice(0,start));
  return ordered.filter(q=>!memoryFor(q.id)).map(q=>q.id);
}
function setDailyCount(n){
  n=Math.max(1,Math.min(999,parseInt(n)||10));
  state.dailyCount=n;save();
  const el=document.getElementById("dailyCount");
  if(el)el.value=n;
  document.querySelectorAll(".quick-counts button").forEach(b=>b.classList.toggle("active",Number(b.dataset.n)===n));
}
function startDaily(){
  const el=document.getElementById("dailyCount");
  const n=Math.max(1,Math.min(questions.length,parseInt(el?.value||state.dailyCount||10)||10));
  state.dailyCount=n;save();
  startPractice("daily",n);
}
function startDueReview(){startPractice("review");}
function startLearningQueue(){startPractice("learning");}
function exportBackup(){
  const payload={app:"理解型刷题",version:APP_VERSION,exportedAt:new Date().toISOString(),storeKey:STORE_KEY,state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date();
  const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;

function importBackup(){

function startPractice(mode,limit=null){
  let ids=[];
  if(mode==="review"){
    ids=dueReviewIds();
    if(!ids.length){toast("今天没有到期复习题");return;}
  }else if(mode==="learning"){
    ids=learningIds();
    if(!ids.length){toast("目前没有学习中的题");return;}
  }else if(mode==="wrong"){
    ids=questions.filter(q=>state.wrongIds.includes(q.id)).map(q=>q.id);
    if(!ids.length){toast("现在没有错题");return;}
  }else if(mode==="daily"){
    ids=newQuestionIdsInOrder();
    if(!ids.length){toast("当前没有新题，先完成复习任务");return;}
    const n=Math.max(1,Math.min(ids.length,parseInt(limit)||state.dailyCount||10));
    ids=ids.slice(0,n);
    if(n<(parseInt(limit)||state.dailyCount||10))toast(`当前只剩 ${n} 道新题`);
  }else{
    let base=[...questions],start=0;
    if(mode==="continue" && state.lastQuestionId){
      const i=base.findIndex(q=>q.id===state.lastQuestionId);
      if(i>=0)start=(i+1)%base.length;
    }
    const ordered=base.slice(start).concat(base.slice(0,start));
    ids=ordered.map(q=>q.id);
  }
  practice={queue:ids,pos:0,currentAnswer:"",done:false,correct:false,mode,plannedCount:ids.length,feedback:""};
  stopStudySession();studySessionBase=(state.studySecondsByDay?.[todayKey()]||0);studySessionStartedAt=null;
  view="practice";renderPractice();
}
function go(v){
  if(view==="practice"&&v!=="practice")stopStudySession();
  view=v;
  if(v==="home")home();
  if(v==="practice"){
    if(!practice) startPractice("continue"); else renderPractice();
  }
  if(v==="wrong")wrongView();
  if(v==="stats")statsView();
}
function getQ(){return questions.find(q=>q.id===practice.queue[practice.pos]);}
function normalize(s){return (s||"").trim().replace(/\s+/g,"").replace(/[，,；;]/g,";")}
function fillCorrect(q,v){
  if(q.display_answer && normalize(v)===normalize(q.display_answer)) return true;
  const p=normalize(v).split(";").filter(Boolean);
  if(q.answers.length===1)return q.answers[0].some(a=>normalize(a)===normalize(v));
  if(p.length!==q.answers.length)return false;
  return q.answers.every((g,i)=>g.some(a=>normalize(a)===normalize(p[i])));
}
function isCorrect(q,v){return (q.type==="choice"||q.type==="truefalse")?v===q.answer:fillCorrect(q,v)}
function answerText(q){return (q.type==="choice"||q.type==="truefalse")?(q.options.find(o=>o[0]===q.answer)||q.answer):q.display_answer}
function enqueueAgain(id,offset){
  if(!practice)return;
  const future=practice.queue.slice(practice.pos+1);
  if(future.includes(id))return;
  const at=Math.min(practice.pos+1+offset,practice.queue.length);
  practice.queue.splice(at,0,id);
}
function completeLearning(q,m){
  const now=Date.now();
  const wasWrong=state.wrongIds.includes(q.id);
  m.phase="review";
  m.todayPasses=2;
  m.learningDay=todayKey();
  m.cycleStart=now;
  m.stage=0;
  m.dueTs=addDaysFrom(now,REVIEW_DAYS[0]);
  m.lastDailyComplete=todayKey();
  state.wrongIds=state.wrongIds.filter(id=>id!==q.id);
  if(wasWrong && !state.masteredIds.includes(q.id))state.masteredIds.push(q.id);
  practice.feedback=`今日学习完成 ✓ 已进入记忆曲线；下次复习：${formatDay(m.dueTs)}（第 1 天）。`;
}
function resetToLearning(q,m){
  m.phase="learning";
  m.todayPasses=0;
  m.learningDay=todayKey();
  m.cycleStart=null;
  m.stage=0;
  m.dueTs=null;
  m.lapses=(m.lapses||0)+1;
  if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
  enqueueAgain(q.id,4);
  practice.feedback="这次忘记了：记忆曲线已重置。题目会再次推回；今天重新完成 2 次间隔答对后，再从第 1 天开始。";
}
function advanceReview(q,m){
  const now=Date.now();
  let next=m.stage+1;
  // 若复习明显逾期，跳过已经过去的检查点，找到下一个仍在未来的节点。
  while(next<REVIEW_DAYS.length && addDaysFrom(m.cycleStart,REVIEW_DAYS[next])<=now)next++;
  if(next>=REVIEW_DAYS.length){
    m.phase="mastered";m.stage=REVIEW_DAYS.length;m.dueTs=null;
    practice.feedback="本轮长期记忆节点全部通过 ✓ 已完成 1·3·7·14·30·60 天复习。";
  }else{
    m.stage=next;
    m.dueTs=addDaysFrom(m.cycleStart,REVIEW_DAYS[next]);
    practice.feedback=`复习通过 ✓ 下一节点：${formatDay(m.dueTs)}（第 ${REVIEW_DAYS[next]} 天）。`;
  }
}
function recordAnswer(q,value,correct){
  const dl=ensureDayData();dl.answers++;if(correct)dl.correct++;else dl.wrong++;
  state.stats.total++;
  if(correct)state.stats.correct++;
  const prev=state.answers[q.id]||{};
  state.answers[q.id]={...prev,value,correct,ts:Date.now(),streak:correct?(prev.streak||0)+1:0};
  state.history.unshift({id:q.id,correct,ts:Date.now()});
  state.history=state.history.slice(0,500);
  let m=memoryFor(q.id);

  if(m?.phase==="review"){
    const isDue=!!(m.dueTs && m.dueTs<=Date.now());
    if(!correct){
      resetToLearning(q,m);
    }else if(isDue){
      advanceReview(q,m);
    }else{
      practice.feedback=`回答正确。正式复习日仍是 ${formatDay(m.dueTs)}，本次额外练习不会提前推进记忆曲线。`;
    }
  }else if(m?.phase==="mastered"){
    if(!correct)resetToLearning(q,m);
    else practice.feedback="回答正确 ✓ 这道题已完成长期记忆周期。";
  }else{
    m=m||ensureLearningMemory(q.id);
    if(m.learningDay!==todayKey()){
      m.learningDay=todayKey();m.todayPasses=0;
    }
    if(!correct){
      m.todayPasses=0;
      if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
      enqueueAgain(q.id,4);
      practice.feedback="回答错误：今日掌握计数已清零，稍后会再次出现。";
    }else{
      m.phase="learning";
      m.todayPasses=(m.todayPasses||0)+1;
      if(m.todayPasses>=2){
        completeLearning(q,m);
      }else{
        enqueueAgain(q.id,8);
        practice.feedback="第一次间隔验证通过 ✓ 还需要再答对 1 次才算今日完成，稍后会再次出现。";
      }
    }
  }
  state.lastQuestionId=q.id;
  save();
}

    <div class="section-title"><h2>错题本</h2><span>${list.length} 题</span></div>
    ${list.length?`<div class="list">${list.map(q=>`
      <div class="wrong-card">
        <span class="tag">${q.tag}</span>
        <h4>第 ${q.id} 题 · ${q.q}</h4>
        <div class="mini">${q.memory}</div>
      </div>`).join("")}</div>
      <button class="primary" style="width:100%;margin-top:14px" onclick="startPractice('wrong')">开始错题强化</button>`
      :`<div class="card empty">目前没有错题。连续两次答对一道错题后，它会自动移出错题本。</div>`}
  `,"wrong");
}
function statsView(){
  const mastered=state.masteredIds.length;
  const answered=Object.keys(state.answers).length;
  const due=dueReviewIds().length,learning=learningIds().length,active=activeReviewCount(),mature=longTermMasteredCount();
  const tagMap={};
  questions.forEach(q=>{
    const a=state.answers[q.id];
    if(!tagMap[q.tag])tagMap[q.tag]={total:0,correct:0};
    if(a){tagMap[q.tag].total++;if(a.correct)tagMap[q.tag].correct++;}
  });
  const tags=Object.entries(tagMap).filter(([k,v])=>v.total).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));
  app.innerHTML=shell(`
    <div class="grid2">
      <div class="metric"><b>${state.stats.total}</b><span>累计作答</span></div>
      <div class="metric"><b>${accuracy()}%</b><span>累计正确率</span></div>
      <div class="metric"><b>${answered}/${questions.length}</b><span>已接触题目</span></div>
      <div class="metric"><b>${mastered}</b><span>错题重新掌握</span></div>
    </div>
    <div class="section-title"><h2>记忆曲线状态</h2><span>1·3·7·14·30·60</span></div>
    <div class="memory-grid">
      <div class="memory-stat"><b>${due}</b><span>今日到期</span></div>
      <div class="memory-stat"><b>${learning}</b><span>学习中</span></div>
      <div class="memory-stat"><b>${active}</b><span>曲线进行中</span></div>
    </div>
    <div class="card" style="margin-top:10px"><b>长期周期完成：${mature} 题</b><p class="mini">复习节点答错会重新进入学习阶段，并从新的完成日期重新开始第 1 天。</p></div>
    <div class="section-title"><h2>知识点表现</h2><span>按当前记录</span></div>
    <div class="list">
      ${tags.length?tags.map(([tag,v])=>{
        const p=Math.round(v.correct/v.total*100);
        return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${tag}</b><span class="mini">${p}%</span></div><div class="progress"><div style="width:${p}%"></div></div></div>`;
      }).join(""):`<div class="card empty">先完成几道题，这里会显示薄弱知识点。</div>`}
    </div>
    <div class="section-title"><h2>数据状态</h2><span>固定网页版</span></div>
    <div class="card"><b>当前记录：${Object.keys(state.memory||{}).length} 道题</b><p class="mini">最后保存：${state.lastSavedAt?new Date(state.lastSavedAt).toLocaleString():"尚未在固定网页保存"}<br>以后始终使用同一个网址，更新题库不会更换存储空间。</p></div>
    <div class="section-title"><h2>数据备份</h2><span>含记忆曲线进度</span></div>
    <div class="card">
      <div class="backup-actions">
        <button class="primary" onclick="exportBackup()">导出备份</button>
        <button class="ghost" onclick="importBackup()">导入备份</button>
      </div>
    </div>
    <button class="ghost" style="width:100%;margin-top:16px" onclick="resetData()">清空学习记录</button>
  `,"stats");
}
function resetData(){
  if(confirm("确定清空所有答题记录、错题、统计和记忆曲线进度吗？")){
    state=defaultState();save();toast("已清空");statsView();
  }
}
async function installApp(){
  if(!deferredPrompt){toast("请使用浏览器的“添加到主屏幕”");return;}
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  home();
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;
  if(view==="home")home();
});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("已安装到桌面");});

async function init(){
  if(window.__EMBEDDED_QUESTIONS__){
    questions=window.__EMBEDDED_QUESTIONS__;
  }else{
    try{
      const r=await fetch("questions.json");
      questions=await r.json();
    }catch(e){
      app.innerHTML=`<div class="app-shell"><div class="card" style="margin-top:30px">题库加载失败。</div></div>`;
      return;
    }
  }
  migrateMemory();
  if(location.protocol!=="file:" && "serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
  home();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&studySessionStartedAt)saveStudySession()});
window.addEventListener("pagehide",()=>{if(studySessionStartedAt)saveStudySession()});
init();
</script>
</body>
</html>
