ificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":497,"source_no":67,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"在深度负反馈的条件下，闭环放大倍数Af≈1/F，它与反馈网络有关，而与放大器开环放大倍数A无关，故可省去放大电路，仅留下反馈网络，以获得稳定的放大倍数。","options":["A. 对","B. 错"],"answer":"B","principle":"本题考查深度负反馈。","why":"Af≈1/F的前提是存在足够大的开环增益A和有效反馈环路，不能把基本放大器省去。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"Af≈1/F的前提是存在足够大的开环增益A和有效反馈环路，不能把基本放大器省去。","tag":"深度负反馈","studyKind":"understand","topic":"反馈增益、稳定性与带宽","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":498,"source_no":68,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"由于接入负反馈，则反馈放大电路的A就一定是负值，接入正反馈后A就一定是正值。","options":["A. 对","B. 错"],"answer":"B","principle":"本题考查反馈极性。","why":"A表示基本放大器增益，其符号由放大器本身的相位关系决定，反馈正负由环路合成关系判断。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"A表示基本放大器增益，其符号由放大器本身的相位关系决定，反馈正负由环路合成关系判断。","tag":"反馈极性","studyKind":"understand","topic":"反馈概念与极性","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":499,"source_no":69,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"在负反馈放大电路中，放大器的放大倍数越大，闭环放大倍数就越稳定。","options":["A. 对","B. 错"],"answer":"A","principle":"本题考查反馈稳定性。","why":"在F一定时，A越大则反馈深度1+AF越大，闭环增益对A变化的敏感度越低。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"在F一定时，A越大则反馈深度1+AF越大，闭环增益对A变化的敏感度越低。","tag":"反馈稳定性","studyKind":"understand","topic":"反馈增益、稳定性与带宽","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":500,"source_no":70,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"在深度负反馈放大电路中，只有尽可能地增大开环放大倍数，才能有效地提高闭环放大倍数。","options":["A. 对","B. 错"],"answer":"B","principle":"本题考查深度负反馈。","why":"深度负反馈时Af≈1/F，闭环增益主要由反馈网络决定，单纯增大A不会按比例提高Af。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"深度负反馈时Af≈1/F，闭环增益主要由反馈网络决定，单纯增大A不会按比例提高Af。","tag":"深度负反馈","studyKind":"understand","topic":"反馈增益、稳定性与带宽","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":501,"source_no":71,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"在深度负反馈的条件下，由于闭环放大倍数Auf≈1/F，与管子的参数几乎无关，因此可以任意选择晶体管来组成放大级，管子的参数也就没什么意义了。","options":["A. 对","B. 错"],"answer":"B","principle":"本题考查深度负反馈。","why":"深度负反馈只能降低参数变化对闭环增益的影响，实际设计仍受带宽、噪声、功耗、输出范围和稳定性等器件参数限制。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"深度负反馈只能降低参数变化对闭环增益的影响，实际设计仍受带宽、噪声、功耗、输出范围和稳定性等器件参数限制。","tag":"深度负反馈","studyKind":"understand","topic":"反馈增益、稳定性与带宽","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":502,"source_no":72,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"负反馈可以提高放大电路放大倍数的稳定性。","options":["A. 对","B. 错"],"answer":"A","principle":"本题考查反馈稳定性。","why":"负反馈能够显著降低闭环增益对开环增益及器件参数变化的敏感度。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"负反馈能够显著降低闭环增益对开环增益及器件参数变化的敏感度。","tag":"反馈稳定性","studyKind":"understand","topic":"反馈增益、稳定性与带宽","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":503,"source_no":73,"chapter":"第八章《反馈放大电路》","type":"truefalse","q":"射极输出器是电压串联负反馈放大器，它具有稳定输出电压的作用。","options":["A. 对","B. 错"],"answer":"A","principle":"本题考查射极输出器。","why":"射极输出器把输出电压反馈到输入回路，属于电压串联负反馈，输出电压具有良好跟随和稳定特性。","mistake":"判断题注意“任何”“一定”“只要”等绝对化表述，反馈效果取决于反馈类型和环路条件。","memory":"射极输出器把输出电压反馈到输入回路，属于电压串联负反馈，输出电压具有良好跟随和稳定特性。","tag":"射极输出器","studyKind":"understand","topic":"三种组态与放大性能","classificationReason":"需要结合条件判断、理解电路关系或代入公式。"},{"id":504,"chapter":"第九章《功率放大电路》","type":"choice","q":"功率放大电路的最大输出功率是在输入电压为正弦波时，输出基本不失真情况下，负载上可能获得的最大（ ）。","options":["A. 交流功率","B. 直流功率","C. 平均功率"],"answer":"A","principle":"功率放大电路的最大输出功率是在输入电压为正弦波，且输出基本不失真的情况下，负载上可能获得的最大交流功率。","why":"功率放大电路的最大输出功率是在输入电压为正弦波，且输出基本不失真的情况下，负载上可能获得的最大交流功率。在功率放大电路中，输出信号通常是交流信号。直流功率一般用于描述电路中的直流成分所消耗或提供的功率。平均功率则是对一段时间内功率的平均值的描述，但在这种特定的最大输出功率的情境中，强调的是交流情况下的最大功率，即交流功率。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 交流功率","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":1,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":505,"chapter":"第九章《功率放大电路》","type":"choice","q":"功率放大电路的转换效率是指（ ）。","options":["A. 输出功率与晶体管所消耗的功率之比","B. 最大输出功率与电源提供的平均功率之比","C. 晶体管所消耗的功率与电源提供的平均功率之比"],"answer":"B","principle":"功率放大电路的转换效率是指最大输出功率与电源提供的平均功率之比。","why":"功率放大电路的转换效率是指最大输出功率与电源提供的平均功率之比。转换效率衡量了功率放大电路将电源提供的功率有效转化为输出有用功率的能力。<br>A 选项，输出功率与晶体管所消耗的功率之比，并不能准确反映整个电路的转换效率，因为电源提供的功率不仅用于晶体管消耗，还包括其他部分的消耗和损耗。<br>C 选项，晶体管所消耗的功率与电源提供的平均功率之比，反映的不是转换效率，而是晶体管消耗功率在电源提供功率中的占比。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 最大输出功率与电源提供的平均功率之比","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":2,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":506,"chapter":"第九章《功率放大电路》","type":"choice","q":"在OCL乙类功率放大电路中，若最大输出功率为1W，则电路中功放管的集电极最大功耗约为（ ）。","options":["A. 1W","B. 0.5W","C. 0.2W"],"answer":"C","principle":"在 OCL 乙类功率放大电路中，功放管的集电极最大功耗发生在最大输出功率的 50%处，约为 0.2Pom，其中 Pom 为最大输出功率。","why":"在 OCL 乙类功率放大电路中，功放管的集电极最大功耗发生在最大输出功率的 50%处，约为 0.2Pom，其中 Pom 为最大输出功率。已知最大输出功率为 1W，所以功放管的集电极最大功耗约为 0.2×1 = 0.2W 。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 0.2W","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":3,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":507,"chapter":"第九章《功率放大电路》","type":"choice","q":"与乙类功率放大电路比较，甲乙类功率放大电路的主要优点是（ ）。","options":["A. 放大倍数大","B. 效率高","C. 输入电阻大","D. 交越失真小"],"answer":"D","principle":"乙类功率放大电路与乙类功率放大电路相比，主要优点是交越失真小。","why":"乙类功率放大电路与乙类功率放大电路相比，主要优点是交越失真小。乙类功率放大电路在输入信号小于晶体管的导通电压时，晶体管处于截止状态，导致输出信号在正负半周交替处出现失真，即交越失真。甲乙类功率放大电路通过给晶体管设置一个较小的静态偏置电流，使其在输入信号较小时也能导通，从而减小了交越失真。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 交越失真小","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":4,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":508,"chapter":"第九章《功率放大电路》","type":"choice","q":"理想状态下，甲类功率放大电路的效率最大可达（ ）。","options":["A. 50%","B. 87.5%","C. 78.5%","D. 100%"],"answer":"A","principle":"理想状态下，甲类功率放大电路的效率最大可达 50%，但在实际情况中，由于各种损耗的存在，甲类功率放大电路的效率通常在 25% - 30%之间。","why":"理想状态下，甲类功率放大电路的效率最大可达 50%，但在实际情况中，由于各种损耗的存在，甲类功率放大电路的效率通常在 25% - 30%之间。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 50%","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":5,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":509,"chapter":"第九章《功率放大电路》","type":"choice","q":"理想状态下，乙类功率放大电路的效率最大可达（ ）。","options":["A. 50%","B. 87.5%","C. 78.5%","D. 100%"],"answer":"C","principle":"在理想状态下，乙类功率放大电路的效率最大可达 78.5%，但实际中由于存在各种损耗，其最大效率约为 50%。","why":"在理想状态下，乙类功率放大电路的效率最大可达 78.5%，但实际中由于存在各种损耗，其最大效率约为 50%。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 78.5%","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":6,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":510,"chapter":"第九章《功率放大电路》","type":"choice","q":"当互补推挽功率放大电路的输入信号为1kHz、10V的正弦电压时，输出电压波形如图所示。说明电路中出现了（ ）。<br><img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/q-image1.png\" alt=\"配套资料中的题图或公式\">","options":["A. 饱和失真","B. 截止失真","C. 频率失真","D. 交越失真"],"answer":"A","principle":"输出幅度受到器件和电源允许摆幅限制时，正弦波的波峰会被削平，形成饱和削顶失真。","why":"题图中正、负半周的波峰均出现明显平顶，说明输出已达到摆幅限制，应选 A“饱和失真”。交越失真的主要特征是过零附近存在死区或缺口。<br><b>校对说明</b> 配套资料原答案为 D，解析讨论过零失真；本题已按实际波形修正为 A。<br><a href=\"https://www.ti.com/document-viewer/lit/html/SSZT499/GUID-DC728889-DCD3-468E-B1F0-2C8C73B116CE\" target=\"_blank\" rel=\"noopener\">TI 关于输出饱和与削顶的说明</a> · <a href=\"https://wiki.analog.com/university/courses/electronics/electronics-lab-13a\" target=\"_blank\" rel=\"noopener\">Analog Devices 关于过零失真的说明</a>","mistake":"观察失真发生的位置，波峰削顶对应输出摆幅限制，过零缺口对应两管交替导通时的死区。","memory":"波峰削顶 → 饱和失真；过零缺口 → 交越失真。","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":7,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19","original_answer":"D"},{"id":511,"chapter":"第九章《功率放大电路》","type":"choice","q":"输出电压波形如图所示，为了改善输出电压波形，应（ ）。<br><img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/q-image1.png\" alt=\"配套资料中的题图或公式\">","options":["A. 进行相位补偿","B. 适当减小功率放大管的直流偏置电压 |U_BE|","C. 适当增大功率放大管的直流偏置电压 |U_BE|","D. 适当减小输入信号"],"answer":"D","principle":"减小输入幅度，使所需输出电压回到电路允许的线性摆幅范围内，可以改善削顶失真。","why":"本题与前一题使用同一幅削顶波形。输入过大使输出波峰达到允许摆幅限制，适当减小输入信号后，输出能够恢复线性放大，因此选 D。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 适当减小输入信号","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":8,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":512,"chapter":"第九章《功率放大电路》","type":"choice","q":"右图所示电路为（ ）。<br><img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/q-image2.png\" alt=\"配套资料中的题图或公式\">","options":["A. OTL乙类","B. OTL甲乙类","C. OCL乙类","D. OCL甲乙类"],"answer":"D","principle":"在 OCL 甲乙类功率放大电路中，通过给功率晶体管设置一个较小的静态偏置电流，使得晶体管在输入信号为零时处于微导通状态。","why":"在 OCL 甲乙类功率放大电路中，通过给功率晶体管设置一个较小的静态偏置电流，使得晶体管在输入信号为零时处于微导通状态。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. OCL甲乙类","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":9,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":513,"chapter":"第九章《功率放大电路》","type":"choice","q":"右图所示电路静态时，A点的电位为（ ）。<br><img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/q-image2.png\" alt=\"配套资料中的题图或公式\">","options":["A. 0V","B. 5V","C. 10V","D. 20V"],"answer":"A","principle":"对称双电源互补推挽电路的静态输出中点电位由电路的对称偏置决定。","why":"图中使用 +10V 和 −10V 对称双电源，A 点是上下互补管连接的输出中点。在对称静态工作条件下，A 点相对地电位约为 0V，选 A。A 点经负载电阻连接到地。<br><b>校对说明</b> 原解析把 A 点描述成直接接地点，此处已修正为对称静态中点的解释。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 0V","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":10,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":514,"chapter":"第九章《功率放大电路》","type":"choice","q":"与甲类功率放大器相比较，乙类互补推挽功放的主要优点是（ ）。","options":["A. 无输出变压器","B. 能量转换效率高","C. 无交越失真"],"answer":"B","principle":"甲类功率放大器无论有无信号输入，始终有较大的静态电流，导致管耗较大，能量转换效率低，一般在 50%以下。","why":"甲类功率放大器无论有无信号输入，始终有较大的静态电流，导致管耗较大，能量转换效率低，一般在 50%以下。而乙类互补推挽功放在没有信号输入时，静态电流几乎为零，只有在有信号输入时才有电流通过，大大降低了管耗，能量转换效率可以达到 78.5%左右。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 能量转换效率高","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":11,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":515,"chapter":"第九章《功率放大电路》","type":"choice","q":"所谓能量转换效率是指（ ）。","options":["A. 输出功率与晶体管上消耗的功率之比","B. 最大不失真输出功率与电源提供的功率之比","C. 输出功率与电源提供的功率之比"],"answer":"C","principle":"输出功率是放大器实际能够提供给负载的有用功率，而电源提供的功率则是整个电路所消耗的总功率。","why":"输出功率是放大器实际能够提供给负载的有用功率，而电源提供的功率则是整个电路所消耗的总功率。能量转换效率反映了功率放大器将电源提供的能量有效转化为有用输出功率的能力。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 输出功率与电源提供的功率之比","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":12,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":516,"chapter":"第九章《功率放大电路》","type":"choice","q":"功放电路的能量转换效率主要与（ ）有关。","options":["A. 电源供给的直流功率","B. 电路输出信号最大功率","C. 电路的类型"],"answer":"C","principle":"不同类型的功放电路，其工作原理和特点不同，从而导致能量转换效率存在较大差异。","why":"不同类型的功放电路，其工作原理和特点不同，从而导致能量转换效率存在较大差异。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 电路的类型","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":13,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":517,"chapter":"第九章《功率放大电路》","type":"choice","q":"甲类功率放大电路的能量转换效率最高是（ ）。","options":["A. 50%","B. 78.5%","C. 100%"],"answer":"A","principle":"理想状态下，甲类功率放大电路的效率最大可达 50%，但在实际情况中，由于各种损耗的存在，甲类功率放大电路的效率通常在 25% - 30%之间。","why":"理想状态下，甲类功率放大电路的效率最大可达 50%，但在实际情况中，由于各种损耗的存在，甲类功率放大电路的效率通常在 25% - 30%之间。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 50%","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":14,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":518,"chapter":"第九章《功率放大电路》","type":"choice","q":"甲类功率放大电路（参数确定）的输出功率越大，则功放管的管耗（ ）。","options":["A. 不变","B. 越大","C. 越小"],"answer":"C","principle":"在甲类功率放大电路中，功放管的管耗等于电源提供的功率减去输出功率。","why":"在甲类功率放大电路中，功放管的管耗等于电源提供的功率减去输出功率。当输出功率增大时，电源提供的功率不变（因为参数确定），那么管耗就会相应减小。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 越小","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":15,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":519,"chapter":"第九章《功率放大电路》","type":"choice","q":"对甲类功率放大电路（参数确定）来说，输出功率越大，则电源提供的功率（ ）。","options":["A. 不变","B. 越大","C. 越小"],"answer":"A","principle":"甲类功率放大电路在放大信号时，‌其输出功率的增加会导致功放管的管耗相应增加，‌但这一增加的管耗是由电源直接提供的，‌意味着电源需要提供更多的功率来弥补功放管在放大过程中消耗的额外功率，‌从而保持输出功率的稳定增加。","why":"甲类功率放大电路在放大信号时，‌其输出功率的增加会导致功放管的管耗相应增加，‌但这一增加的管耗是由电源直接提供的，‌意味着电源需要提供更多的功率来弥补功放管在放大过程中消耗的额外功率，‌从而保持输出功率的稳定增加。‌","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 不变","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":16,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":520,"chapter":"第九章《功率放大电路》","type":"choice","q":"甲类功率放大电路功放管的最大管耗出现在输出电压的幅值为（ ）。","options":["A. 零时","B. 最大时","C. 电源电压的一半"],"answer":"A","principle":"甲类功放的输出级中，‌两个（‌或两组）‌晶体管永远处于导电状态，‌无论有无讯号输入都保持传导电流，‌并且使这两个电流等于交流电的峰值。","why":"甲类功放的输出级中，‌两个（‌或两组）‌晶体管永远处于导电状态，‌无论有无讯号输入都保持传导电流，‌并且使这两个电流等于交流电的峰值。‌当无讯号时，‌两个晶体管各流通等量的电流，‌因此在输出中心点上没有不平衡的电流或电压，‌此时输出电压的幅值为零，‌功放管的最大管耗也出现在这一时刻","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 零时","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":17,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":521,"chapter":"第九章《功率放大电路》","type":"choice","q":"甲类功率放大电路功放管的最小管耗出现在输出电压的幅值为（ ）。","options":["A. 零时","B. 最大时","C. 电源电压的一半"],"answer":"B","principle":"在甲类功率放大电路中，当输出电压幅值最大时，电源提供的功率主要转化为输出功率，此时功放管的管耗相对较小。","why":"在甲类功率放大电路中，当输出电压幅值最大时，电源提供的功率主要转化为输出功率，此时功放管的管耗相对较小","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 最大时","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":18,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":522,"chapter":"第九章《功率放大电路》","type":"choice","q":"乙类互补推挽功率放大电路的能量转换效率最高是（ ）。","options":["A. 50%","B. 78.5%","C. 100%"],"answer":"B","principle":"在理想情况下，乙类互补推挽功率放大电路的能量转换效率可以达到 78.5%。","why":"在理想情况下，乙类互补推挽功率放大电路的能量转换效率可以达到 78.5%。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 78.5%","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":19,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":523,"chapter":"第九章《功率放大电路》","type":"choice","q":"乙类互补推挽功率放大电路在输出电压幅值约等于（ ）时，管子的耗最小。","options":["A. 0","B. 电源电压","C. 0.64倍电源电压"],"answer":"A","principle":"乙类互补推挽功率放大电路在输出电压幅值约等于0时，‌管子的功耗最小。","why":"乙类互补推挽功率放大电路在输出电压幅值约等于0时，‌管子的功耗最小。‌这是因为当输出电压幅值为0时，‌电路中的电流和电压乘积为0，‌根据功率的定义，‌功率等于电压与电流的乘积，‌因此在这种情况下，‌功率为0，‌即功耗最小。‌","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 0","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":20,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":524,"chapter":"第九章《功率放大电路》","type":"choice","q":"乙类互补推挽功率放大电路在输出电压幅值约等于（ ）时，管子的耗最大。","options":["A. 0","B. 电源电压","C. 0.64倍电源电压"],"answer":"C","principle":"在乙类互补推挽功率放大电路中，管子的功耗与输出电压幅值有关。","why":"在乙类互补推挽功率放大电路中，管子的功耗与输出电压幅值有关。当输出电压幅值约为 0.64 倍电源电压时，管子的功耗达到最大值。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 0.64倍电源电压","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":21,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":525,"chapter":"第九章《功率放大电路》","type":"choice","q":"乙类互补功放电路存在的主要问题是（ ）。","options":["A. 输出电阻太大","B. 能量转换效率低","C. 有交越失真"],"answer":"C","principle":"交越失真是乙类互补功放电路的一个显著问题。","why":"交越失真是乙类互补功放电路的一个显著问题。由于乙类功放电路在输入信号较小时，两管均截止，导致输出信号在正负交替处出现失真。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 有交越失真","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":22,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":526,"chapter":"第九章《功率放大电路》","type":"choice","q":"为了消除交越失真，应当使功率放大电路的功放管工作在（ ）状态。","options":["A. 甲类","B. 甲乙类","C. 乙类"],"answer":"B","principle":"甲乙类工作状态是在乙类的基础上，给功放管设置一个较小的静态偏置电流，使其在输入信号较小时也能导通，从而避免了两管在交替导通时因截止而产生的交越失真。","why":"甲乙类工作状态是在乙类的基础上，给功放管设置一个较小的静态偏置电流，使其在输入信号较小时也能导通，从而避免了两管在交替导通时因截止而产生的交越失真。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 甲乙类","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":23,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":527,"chapter":"第九章《功率放大电路》","type":"choice","q":"乙类互补功放电路中的交越失真，实质上就是（ ）。","options":["A. 线性失真","B. 饱和失真","C. 截止失真"],"answer":"C","principle":"在乙类互补功放电路中，由于没有给功放管设置静态偏置电流，当输入信号电压较小时，两功放管均处于截止状态，导致输出信号在正负交替处产生失真，这就是截止失真。","why":"在乙类互补功放电路中，由于没有给功放管设置静态偏置电流，当输入信号电压较小时，两功放管均处于截止状态，导致输出信号在正负交替处产生失真，这就是截止失真。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 截止失真","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":24,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":528,"chapter":"第九章《功率放大电路》","type":"choice","q":"在乙类互补推挽功率放大电路中，每只管子的最大管耗为（ ）。","options":["A. 0.5P_om","B. 0.4P_om","C. 0.2P_om"],"answer":"C","principle":"POM代表管子的额定耗散功率。","why":"P<sub>OM</sub>代表管子的额定耗散功率。‌当管子在最大耗散状态下工作时，‌其耗散功率不应超过额定耗散功率的20%，‌即每只管子的最大管耗为P<sub>OM</sub>的20%","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 0.2P_om","tag":"功率放大、效率与失真","studyKind":"memory","topic":"功率放大、效率与失真","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":25,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":529,"chapter":"第九章《功率放大电路》","type":"choice","q":"设计一个输出功率为20W的功放电路，若用乙类互补对称功率放大，则每只功放管的最大允许功耗PCM至少应有（ ）。","options":["A. 8W","B. 4W","C. 2W"],"answer":"B","principle":"在乙类互补对称功率放大电路中，每只功放管的最大管耗约为最大输出功率的 0.2 倍。","why":"在乙类互补对称功率放大电路中，每只功放管的最大管耗约为最大输出功率的 0.2 倍。即 20W×0.2 = 4W","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 4W","tag":"功率放大、效率与失真","studyKind":"understand","topic":"功率放大、效率与失真","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107", 261107","source_no":2,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":549,"chapter":"第十章《直流稳压电源》","type":"choice","q":"当满足R_L C≥（3～5）T/2时，电容滤波电路常用在（ ）的场合。","options":["A. 平均电压低，负载电流大","B. 平均电压高，负载电流大","C. 平均电压低，负载电流小","D. 平均电压高，负载电流小，负载变动小"],"answer":"D","principle":"平均电压高，负载电流小，且负载变动小，这种情况下，电容有足够的能力存储电荷来维持高的平均电压，并且小电流和负载变动小使得电容的充放电相对稳定，能够满足 的条件。","why":"平均电压高，负载电流小，且负载变动小，这种情况下，电容有足够的能力存储电荷来维持高的平均电压，并且小电流和负载变动小使得电容的充放电相对稳定，能够满足 的条件。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 平均电压高，负载电流小，负载变动小","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":3,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":550,"chapter":"第十章《直流稳压电源》","type":"choice","q":"串联稳压电源的调整管工作在________区；开关稳压电源的调整管工作在________区（ ）。","options":["A. 饱和，放大","B. 放大，截止","C. 放大，截止和饱和","D. 截止和饱和，放大"],"answer":"C","principle":"在串联稳压电源中，调整管通过处于放大状态来控制输出电压的稳定，其集电极电流的变化受基极电流的控制，从而实现对输出电压的调节。","why":"在串联稳压电源中，调整管通过处于放大状态来控制输出电压的稳定，其集电极电流的变化受基极电流的控制，从而实现对输出电压的调节。而在开关稳压电源中，调整管工作在截止和饱和区，通过快速地在这两个状态之间切换，实现能量的传递和输出电压的稳定","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 放大，截止和饱和","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":4,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":551,"chapter":"第十章《直流稳压电源》","type":"choice","q":"整流的目的是（ ）。","options":["A. 将交流变为直流","B. 将高频变为低频","C. 将正弦波变为方波"],"answer":"A","principle":"整流电路通过使用二极管等器件，允许电流在一个方向上通过，阻止在相反方向上通过，从而把交流电压或电流转换为单向的直流电压或电流。","why":"整流电路通过使用二极管等器件，允许电流在一个方向上通过，阻止在相反方向上通过，从而把交流电压或电流转换为单向的直流电压或电流。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 将交流变为直流","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":5,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":552,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在单相桥式整流电路中，若有一只整流管接反，则（ ）。","options":["A. 输出电压约为2U_D","B. 变为半波直流","C. 整流管将因电流过大而烧坏"],"answer":"C","principle":"在单相桥式整流电路中，四只整流管的正确连接方式是两两成对，交替导通。","why":"在单相桥式整流电路中，四只整流管的正确连接方式是两两成对，交替导通。如果其中一只接反，就会导致电路短路，流过接反的整流管的电流会急剧增大，从而将其烧坏。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 整流管将因电流过大而烧坏","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":6,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":553,"chapter":"第十章《直流稳压电源》","type":"choice","q":"直流稳压电源中滤波电路的目的是（ ）。","options":["A. 将交流变为直流","B. 将高频变为低频","C. 将交、直流混合量中的交流成分滤掉"],"answer":"C","principle":"滤波电路的作用是减少整流输出电压中的交流脉动成分，使输出电压更加平滑和稳定，尽可能接近理想的直流电压。","why":"滤波电路的作用是减少整流输出电压中的交流脉动成分，使输出电压更加平滑和稳定，尽可能接近理想的直流电压。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 将交、直流混合量中的交流成分滤掉","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":7,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":554,"chapter":"第十章《直流稳压电源》","type":"choice","q":"滤波电路应选用（ ）。","options":["A. 高通滤波电路","B. 低通滤波电路","C. 带通滤波电路"],"answer":"B","principle":"在直流稳压电源中，我们希望保留直流成分（低频成分），滤除交流成分（通常是较高频率的成分）。","why":"在直流稳压电源中，我们希望保留直流成分（低频成分），滤除交流成分（通常是较高频率的成分）。低通滤波电路的特点是允许低于截止频率的信号通过，而衰减高于截止频率的信号。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 低通滤波电路","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":8,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":555,"chapter":"第十章《直流稳压电源》","type":"choice","q":"串联型稳压电路中的放大环节所放大的对象是（ ）。","options":["A. 基准电压","B. 采样电压","C. 基准电压与采样电压之差"],"answer":"C","principle":"在串联型稳压电路中，基准电压是一个固定的标准值，采样电压是对输出电压进行按比例的取样。","why":"在串联型稳压电路中，基准电压是一个固定的标准值，采样电压是对输出电压进行按比例的取样。放大环节的作用是对基准电压和采样电压之间的差值进行放大","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 基准电压与采样电压之差","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":9,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":556,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在直流稳压电源中，加滤波电路的主要作用是（ ）。","options":["A. 去掉脉动直流电中的脉动成分","B. 将高频信号变成低频信号","C. 去掉正弦波信号中的脉动成分","D. 将交流电变直流电"],"answer":"A","principle":"经过整流后的直流电仍然存在一定的脉动，不是平滑的直流。","why":"经过整流后的直流电仍然存在一定的脉动，不是平滑的直流。滤波电路能够平滑这种脉动，减少电压的波动，使输出的直流电更加稳定。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 去掉脉动直流电中的脉动成分","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":10,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":557,"chapter":"第十章《直流稳压电源》","type":"choice","q":"直流稳压电源一般包括（ ）组成部分。","options":["A. 变压、整流、滤波","B. 变压、滤波、稳压","C. 变压、整流、放大、滤波","D. 变压、整流、滤波、稳压"],"answer":"D","principle":"首先，通过变压器将市电的高电压变换为适合后续电路处理的电压值。","why":"首先，通过变压器将市电的高电压变换为适合后续电路处理的电压值。然后，经过整流电路将交流电转换为脉动直流电。接着，滤波电路去除脉动直流电中的交流成分，使电压更加平滑。最后，稳压电路保证在输入电压波动或负载变化时，输出电压稳定在设定值。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 变压、整流、滤波、稳压","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":11,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":558,"chapter":"第十章《直流稳压电源》","type":"choice","q":"整流电路中利用具有单向导电性能的（ ）元件，将交流电转换成脉动直流电。","options":["A. 电阻","B. 电容","C. 电感","D. 二极管"],"answer":"D","principle":"二极管的单向导电性使得电流只能在一个方向上通过。","why":"二极管的单向导电性使得电流只能在一个方向上通过。在整流电路中，当输入交流电压为正半周时，二极管导通，电流流过负载；当输入交流电压为负半周时，二极管截止，电流无法通过。这样就把交流电压的正负半周进行了“筛选”，从而得到了单向的脉动直流电。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 二极管","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":12,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":559,"chapter":"第十章《直流稳压电源》","type":"choice","q":"单向桥式整流电路，加上电容滤波后，其输出的直流电压将（ ）。","options":["A. 增大","B. 减小","C. 不变","D. 为0"],"answer":"A","principle":"电容滤波电路利用电容的充放电特性，在整流后的电压升高时充电，在电压降低时放电，从而平滑了电压的波动，并提高了输出直流电压的平均值。","why":"电容滤波电路利用电容的充放电特性，在整流后的电压升高时充电，在电压降低时放电，从而平滑了电压的波动，并提高了输出直流电压的平均值。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 增大","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":13,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":560,"chapter":"第十章《直流稳压电源》","type":"choice","q":"整流电路中滤波器滤波可使波形变得（ ）。","options":["A. 尖锐","B. 受控","C. 平滑","D. 抖动"],"answer":"C","principle":"滤波器的作用是滤除整流输出电压中的交流成分和高频脉动成分，从而使输出电压的波形更加平滑，减少电压的波动。","why":"滤波器的作用是滤除整流输出电压中的交流成分和高频脉动成分，从而使输出电压的波形更加平滑，减少电压的波动。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 平滑","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":14,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":561,"chapter":"第十章《直流稳压电源》","type":"choice","q":"并联型直流稳压电路中，稳压管与负载（ ）。","options":["A. 串联","B. 并联","C. 混联","D. 串联或并联都行"],"answer":"B","principle":"在并联型直流稳压电路中，稳压管起到稳定电压的作用。","why":"在并联型直流稳压电路中，稳压管起到稳定电压的作用。当输入电压发生变化或负载电流发生变化时，稳压管能够通过自身的反向击穿特性来维持输出电压的稳定。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 并联","tag":"整流、滤波与稳压电源","studyKind":"memory","topic":"整流、滤波与稳压电源","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":15,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":562,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在单相桥式整流电路中，若有一只整流管接反，则电路可能（ ）。","options":["A. 仍是桥式整流电路","B. 变成半波整流电路","C. 整流管将因电流过大而烧坏","D. 输出电压增大1倍"],"answer":"C","principle":"因为在单相桥式整流电路中，四只整流管是按照特定的顺序和极性连接的，如果其中一只接反，就会导致正半周和负半周的电流通路出现短路情况。","why":"因为在单相桥式整流电路中，四只整流管是按照特定的顺序和极性连接的，如果其中一只接反，就会导致正半周和负半周的电流通路出现短路情况。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 整流管将因电流过大而烧坏","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":16,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":563,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在单相桥式整流电路中，若整流管D1开路，则输出（ ）。","options":["A. 变为半波整流波形","B. 变为全波整流波形","C. 无波形且变压器损坏","D. 波形不变"],"answer":"A","principle":"在正常的单相桥式整流电路中，四个整流管交替导通，实现全波整流。","why":"在正常的单相桥式整流电路中，四个整流管交替导通，实现全波整流。当 D1 开路时，在交流输入电压的正半周，电流无法通过 D1 形成回路，只有在交流输入电压的负半周，电流能通过 D2 和 D4 形成回路，从而使电路从全波整流变为半波整流。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 变为半波整流波形","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":17,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":564,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在单相桥式整流电容滤波电路中，如变压器二次侧绕组电压U₂＝20V，输出电压为18V，可能是工作在（ ）情况。","options":["A. 正常","B. 负载断路","C. 电容断路","D. 有一个二极管断路"],"answer":"C","principle":"当电容断路时，电路就变成了单纯的桥式整流电路，此时输出电压约为 0.9U2 。","why":"当电容断路时，电路就变成了单纯的桥式整流电路，此时输出电压约为 0.9U2 。已知 U2 = 20V，0.9×20 = 18V ，符合输出电压为 18V 的情况。‌","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 电容断路","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":18,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":565,"chapter":"第十章《直流稳压电源》","type":"choice","q":"单相桥式整流电路中，流过每只整流二极管的平均电流是负载平均电流 压峰值，而交流电压峰值约为有效值的 1.414 倍。","why":"在单相桥式整流电路中，每只二极管承受的最大反向电压是输入交流电压峰值，而交流电压峰值约为有效值的 1.414 倍。所以当变压器次级电压有效值为 10V 时，峰值约为 1.414×10 = 14.14V 。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 14.14V","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":25,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":572,"chapter":"第十章《直流稳压电源》","type":"choice","q":"单相桥式整流电路中，负载电阻为100Ω，输出电压平均值为10V，则流过每个整流二极管的平均电流为（ ）。","options":["A. 10A","B. 0.05A","C. 0.1A","D. 1A"],"answer":"B","principle":"本题考查整流、滤波与稳压电源。","why":"<img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/a-image143.png\" alt=\"配套资料中的题图或公式\">","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 0.05A","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":26,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":573,"chapter":"第十章《直流稳压电源》","type":"choice","q":"在稳压二极管并联型稳压电路中，稳压二极管必须与限流电阻串联，此限流电阻的作用是（ ）。","options":["A. 提供偏流","B. 仅是限流电阻","C. 兼有限制电流和调节电压两个作用","D. 仅调节电压"],"answer":"C","principle":"限流电阻的主要作用包括：限制电流：防止过大的电流通过稳压二极管，避免其因过流而损坏。","why":"限流电阻的主要作用包括：<br>限制电流：防止过大的电流通过稳压二极管，避免其因过流而损坏。<br>调节电压：通过电阻上的分压作用，与稳压二极管共同作用，稳定输出电压。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 兼有限制电流和调节电压两个作用","tag":"整流、滤波与稳压电源","studyKind":"understand","topic":"整流、滤波与稳压电源","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":27,"sourcePart":"模拟部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":574,"chapter":"第十章《直流稳压电源》","type":"choice","q":"稳压二极管构成的并联型稳压电路，其正确的接法是（ ）。","options":["A. 限流电阻与稳压二极管串联后，负载电阻再与稳压二极管并联","B. 稳压二极管与负载电阻并联","C. 稳压二极管与负载电阻串联","D. 限流电阻与稳压二极管串联后，负载电阻再与稳压二极管串联"],"answer":"A","principle":"在这种接法中，限流电阻起到限制流过稳压二极管的电流以及分担一部分电压的作用。","why": nd","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":1,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":642,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"三极管作为开关使用时，要提高开关速度，不可使用的方法是（ ）。","options":["A. 降低饱和深度","B. 增加饱和深度","C. 采用有源泄放回路","D. 采用抗饱和三极管"],"answer":"B","principle":"三极管作为开关使用时，要提高开关速度，可以采取以下措施：A 选项，降低饱和深度：减少三极管在饱和状态时存储的电荷，从而缩短从饱和到截止的转换时间，能够提高开关速度。","why":"三极管作为开关使用时，要提高开关速度，可以采取以下措施：<br>A 选项，降低饱和深度：减少三极管在饱和状态时存储的电荷，从而缩短从饱和到截止的转换时间，能够提高开关速度。<br>C 选项，采用有源泄放回路：可以加速三极管从饱和状态退出，提高开关速度。<br>D 选项，采用抗饱和三极管：抗饱和三极管在设计上能够减少饱和深度，有助于提高开关速度。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 增加饱和深度","tag":"逻辑门与电气特性","studyKind":"understand","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":2,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":643,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"对于TTL与非门闲置输入端的处理，不可以（ ）。","options":["A. 接电源","B. 通过电阻3kΩ接电源","C. 接地","D. 与有用输入端并联"],"answer":"C","principle":"对于 TTL 与非门闲置输入端的处理：A 选项，接电源是可以的，这能保证输入端处于高电平状态。","why":"对于 TTL 与非门闲置输入端的处理：<br>A 选项，接电源是可以的，这能保证输入端处于高电平状态。<br>B 选项，通过电阻 3kΩ接电源也能够使输入端处于稳定的高电平状态。<br>D 选项，与有用输入端并联，可以保证逻辑功能的正确性。<br>C 选项，接地会使输入端处于低电平状态，这可能导致逻辑错误，不是正确的处理方式。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 接地","tag":"逻辑门与电气特性","studyKind":"understand","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":3,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":644,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"三态门输出高阻状态时，（ ）是错误的说法。","options":["A. 用电压表测量指针不动","B. 相当于悬空","C. 电压不高不低","D. 测量电阻指针不动"],"answer":"C","principle":"A 选项，三态门输出高阻状态时，用电压表测量指针不动，这是因为高阻状态下相当于断路，没有电流流过，电压表指针不会有明显偏转，该说法正确。","why":"A 选项，三态门输出高阻状态时，用电压表测量指针不动，这是因为高阻状态下相当于断路，没有电流流过，电压表指针不会有明显偏转，该说法正确。<br>B 选项，高阻状态相当于悬空，即与外部电路没有有效的连接，该说法正确。<br>C 选项，电压不高不低这种说法不准确。高阻状态不是处于一个特定的电压值，而是一种不确定的状态，不能简单地用电压不高不低来描述，该说法错误。<br>D 选项，测量电阻指针不动，因为高阻状态下电阻极大，近似于断路，测量电阻时指针不动，该说法正确。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 电压不高不低","tag":"逻辑门与电气特性","studyKind":"understand","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":4,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":645,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"74HC×××系列集成电路与TTL74系列相兼容是因为（ ）。","options":["A. 引脚兼容","B. 逻辑功能相同","C. 以上两种因素共同存在"],"answer":"C","principle":"4HC×××系列集成电路属于 CMOS 集成电路，TTL74 系列属于 TTL 集成电路。","why":"4HC×××系列集成电路属于 CMOS 集成电路，TTL74 系列属于 TTL 集成电路。4HC×××系列集成电路与 TTL74 系列相兼容，是因为它们不仅引脚兼容，而且逻辑功能相同。引脚兼容使得在实际应用中可以直接替换而无需更改电路板的布线；逻辑功能相同则保证了在电路中的作用和效果一致。所以是以上两种因素共同存在使得它们相兼容。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 以上两种因素共同存在","tag":"逻辑门与电气特性","studyKind":"understand","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":5,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":646,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"如图，真值表所对应的逻辑关系是（ ）。<br><img class=\"bank-figure\" loading=\"lazy\" src=\"./assets/bank-20261107/q-image28.png\" alt=\"配套资料中的题图或公式\">","options":["A. 与","B. 或","C. 或非","D. 与非"],"answer":"D","principle":"与非逻辑是先进行与运算，然后对与运算的结果取反。","why":"与非逻辑是先进行与运算，然后对与运算的结果取反。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 与非","tag":"逻辑门与电气特性","studyKind":"understand","topic":"逻辑门与电气特性","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":6,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":647,"chapter":"数字部分 第三章《逻辑门电路》","type":"choice","q":"有一电路，全部开关断开，灯泡不亮；只要有一个开关闭合，灯泡会被点亮。这是一种（ ）逻辑关系。","options":["A. 与","B. 非","C. 或","D. 或非"],"answer":"C","principle":"或逻辑关系是指只要有一个输入为“1”，输出就为“1”。","why":"或逻辑关系是指只要有一个输入为“1”，输出就为“1 :"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19","answers":[["悬空"],["高","高电平"],["低","低电平"]],"display_answer":"悬空；高；低"},{"id":676,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"设计加法器的超前进位是为了（ ）。","options":["A. 电路简单","B. 每一级运算不需等待进位","C. 连接方便","D. 使进位运算由低位到高位逐位进行"],"answer":"B","principle":"在常规的加法器中，进位通常是从低位到高位逐位产生和传递的，这就导致高位的运算必须等待低位的进位到来，增加了运算的时间延迟。","why":"在常规的加法器中，进位通常是从低位到高位逐位产生和传递的，这就导致高位的运算必须等待低位的进位到来，增加了运算的时间延迟。而超前进位技术能够预先计算出进位的情况，使得各级的运算能够同时进行，无需等待低位的进位，显著提高了加法运算的速度。<br>A 选项，超前进位的电路结构相对复杂，而不是简单。<br>C 选项，连接方便并非超前进位的核心目的。<br>D 选项，超前进位恰恰是要改变进位运算由低位到高位逐位进行的方式，以提高效率。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 每一级运算不需等待进位","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":1,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":677,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"数据选择器不能够做（ ）使用。","options":["A. 函数发生器","B. 多路数据开关","C. 多路数据选择器","D. 数据比较器"],"answer":"D","principle":"数据选择器可以根据控制信号从多个输入数据中选择一个输出。","why":"数据选择器可以根据控制信号从多个输入数据中选择一个输出。<br>A 选项，通过适当的连接和控制信号设置，数据选择器可以实现不同的函数输出，能作为函数发生器使用。<br>B 选项，数据选择器可以根据控制信号选择接通某一路数据，能作为多路数据开关。<br>C 选项，这是数据选择器的基本功能之一，它本身就是用于从多路数据中进行选择的。<br>而数据比较器是用于比较两个数据的大小关系的，数据选择器不具备直接比较数据大小的功能。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 数据比较器","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":2,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":678,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"不属于组合逻辑电路的器件是（ ）。","options":["A. 编码器","B. 译码器","C. 数据选择器","D. 计数器"],"answer":"D","principle":"组合逻辑电路的特点是输出状态只取决于当前的输入状态，不存在存储单元，输出与输入的关系是即时的。","why":"组合逻辑电路的特点是输出状态只取决于当前的输入状态，不存在存储单元，输出与输入的关系是即时的。<br>A 选项，编码器是将输入信号编码为特定的输出代码，属于组合逻辑电路。<br>B 选项，译码器是将输入的编码转换为特定的输出信号，属于组合逻辑电路。<br>C 选项，数据选择器根据输入的控制信号从多个输入数据中选择一个输出，属于组合逻辑电路。<br>而计数器能够对脉冲进行计数，通常需要存储之前的计数状态，属于时序逻辑电路。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 计数器","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":3,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":679,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"分析组合逻辑电路时，不需要进行（ ）。","options":["A. 写出输出函数表达式","B. 判断逻辑功能","C. 列真值表","D. 画逻辑电路图"],"answer":"D","principle":"在分析组合逻辑电路时，通常的步骤包括：A 选项，写出输出函数表达式，通过对电路的逻辑关系进行分析和推导得出。","why":"在分析组合逻辑电路时，通常的步骤包括：<br>A 选项，写出输出函数表达式，通过对电路的逻辑关系进行分析和推导得出。<br>B 选项，判断逻辑功能，根据输出函数表达式或真值表来确定电路实现的具体逻辑功能。<br>C 选项，列真值表，通过列出所有可能的输入组合及其对应的输出值，能直观地展示电路的逻辑关系。<br>而画逻辑电路图一般是在设计组合逻辑电路时需要进行的，在分析时不是必需的步骤。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 画逻辑电路图","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":4,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":680,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"一块数据选择器有三个选择输入（地址输入）端，则它的数据输入端有（ ）个。","options":["A. 3","B. 6","C. 8","D. 1"],"answer":"C","principle":"本题考查组合逻辑与编码译码。","why":"配套参考答案为 C。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 8","tag":"组合逻辑与编码译码","studyKind":"understand","topic":"组合逻辑与编码译码","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":5,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":681,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"一片四位二进制译码器，它的输出函数最多可以有（ ）个。","options":["A. 1","B. 8","C. 10","D. 16"],"answer":"D","principle":"四位二进制译码器可以对 4 位二进制输入进行译码，4 位二进制数共有 16 种不同的组合（0000 到 1111），所以其输出函数最多有 16 个。","why":"四位二进制译码器可以对 4 位二进制输入进行译码，4 位二进制数共有 16 种不同的组合（0000 到 1111），所以其输出函数最多有 16 个。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"D. 16","tag":"组合逻辑与编码译码","studyKind":"understand","topic":"组合逻辑与编码译码","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":6,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":682,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"（ ）不是组合逻辑电路。","options":["A. 加法器","B. 触发器","C. 数据选择器","D. 译码器"],"answer":"B","principle":"组合逻辑电路的输出仅仅取决于当前的输入，不存在记忆功能。","why":"组合逻辑电路的输出仅仅取决于当前的输入，不存在记忆功能。<br>A 选项，加法器是根据输入的两个数值进行相加运算并输出结果，属于组合逻辑电路。<br>C 选项，数据选择器根据选择控制信号从多个输入数据中选择一个输出，属于组合逻辑电路。<br>D 选项，译码器将输入的编码转换为特定的输出信号，属于组合逻辑电路。<br>而触发器具有记忆功能，能够存储之前的状态，属于时序逻辑电路。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 触发器","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":7,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":683,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"数值比较器对A、B两数进行比较时，首先进行比较的是A、B的（ ）。","options":["A. 最高位","B. 最低位","C. 所有位","D. 低位级联输入"],"answer":"A","principle":"在比较两个数字的大小时，通常从最高位开始比较。","why":"在比较两个数字的大小时，通常从最高位开始比较。如果最高位不同，那么最高位的大小就决定了整个数字的大小关系。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 最高位","tag":"组合逻辑与编码译码","studyKind":"memory","topic":"组合逻辑与编码译码","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":8,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":684,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"16位输入的二进制编码器，其输出端有（ ）位。","options":["A. 256","B. 128","C. 4","D. 3"],"answer":"C","principle":"二进制编码器的输出端位数 n 与输入端数量 N 的关系为：2n = N。","why":"二进制编码器的输出端位数 n 与输入端数量 N 的关系为：2<sup>n</sup> = N","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"C. 4","tag":"组合逻辑与编码译码","studyKind":"understand","topic":"组合逻辑与编码译码","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":9,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":685,"chapter":"数字部分 第四章《组合逻辑电路》","type":"choice","q":"一 触发器具有两个稳定的状态，可以在外部触发信号的作用下在这两个状态之间转换并保持。","why":"双稳态触发器具有两个稳定的状态，可以在外部触发信号的作用下在这两个状态之间转换并保持。JK 触发器就是这样一种能够存储一位二进制信息（0 或 1）并且能够根据输入的 J、K 信号改变状态的双稳态触发器。<br>单稳态触发器只有一个稳定状态和一个暂稳态，经过一段时间后会自动回到稳定状态。<br>无稳态触发器则没有稳定状态，输出在两个状态之间不断地来回翻转。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 双稳态触发器","tag":"锁存器与触发器","studyKind":"memory","topic":"锁存器与触发器","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":2,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":741,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"以下错误的是（ ）。","options":["A. 数字比较器可以比较数字大小","B. 实现两个一位二进制数相加的电路叫全加器","C. 实现两个一位二进制数和来自低位的进位相加的电路叫全加器","D. 编码器可分为普通全加器和优先编码器"],"answer":"B","principle":"实现两个一位二进制数相加的电路叫半加器，而实现两个一位二进制数和来自低位的进位相加的电路叫全加器。","why":"实现两个一位二进制数相加的电路叫半加器，而实现两个一位二进制数和来自低位的进位相加的电路叫全加器。<br>A 选项，数字比较器的功能就是比较数字的大小，该选项正确。<br>C 选项的描述符合全加器的定义，该选项正确。<br>D 选项，编码器可分为普通编码器和优先编码器，该选项正确。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 实现两个一位二进制数相加的电路叫全加器","tag":"锁存器与触发器","studyKind":"understand","topic":"锁存器与触发器","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":3,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":742,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"只有暂稳态的电路是（ ）。","options":["A. 多谐振荡器","B. 单稳态电路","C. 施密特触发器","D. 定时器"],"answer":"A","principle":"多谐振荡器是唯一具有暂稳态特性的电路。","why":"多谐振荡器是唯一具有暂稳态特性的电路","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"A. 多谐振荡器","tag":"锁存器与触发器","studyKind":"memory","topic":"锁存器与触发器","classificationReason":"以概念、功能、定义或常用结论为主，适合直接记忆。","sourceBank":"electronics-continuation-20261107","source_no":4,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":743,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"施密特触发器是一个（ ）。","options":["A. 单稳态触发器","B. 双稳态触发器","C. 无稳态触发器"],"answer":"B","principle":"施密特触发器具有两个稳定的状态，并且其状态转换取决于输入信号的电平。","why":"施密特触发器具有两个稳定的状态，并且其状态转换取决于输入信号的电平。它具有滞后特性，即输入信号上升和下降时的触发阈 tag":"锁存器与触发器","studyKind":"understand","topic":"锁存器与触发器","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":8,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":747,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"仅具有保持和翻转功能的触发器是（ ）。","options":["A. JK触发器","B. T触发器","C. D触发器","D. T′触发器"],"answer":"B","principle":"T 触发器在 T = 0 时保持原状态，T = 1 时状态翻转。","why":"T 触发器在 T = 0 时保持原状态，T = 1 时状态翻转。<br>JK 触发器具有置 0、置 1、保持和翻转功能。<br>D 触发器只有置 0 和置 1 功能。<br>Tˊ触发器就是 T = 1 时的 T 触发器，每来一个时钟脉冲就翻转一次。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. T触发器","tag":"锁存器与触发器","studyKind":"understand","topic":"锁存器与触发器","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":9,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":748,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"存在“空翻”问题的触发器是（ ）。","options":["A. D触发器","B. 同步RS触发器","C. 主从JK触发器","D. T触发器"],"answer":"B","principle":"在一个时钟脉冲周期内，同步 RS 触发器的输出状态可能会发生多次变化，这种现象称为“空翻”。","why":"在一个时钟脉冲周期内，同步 RS 触发器的输出状态可能会发生多次变化，这种现象称为“空翻”。<br>D 触发器通常不存在空翻问题。<br>主从 JK 触发器通过主从结构解决了空翻问题。<br>T 触发器也不存在空翻现象。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 同步RS触发器","tag":"锁存器与触发器","studyKind":"understand","topic":"锁存器与触发器","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","source_no":10,"sourcePart":"数字部分","answerSource":"电子技术基础600题答案解析2024.08.19"},{"id":749,"chapter":"数字部分 第五章《锁存器和触发器》","type":"choice","q":"为避免“空翻”现象，应采用（ ）方式的触发器。","options":["A. 主从触发","B. 边沿触发","C. 电平触发"],"answer":"B","principle":"边沿触发方式的触发器仅在时钟脉冲的上升沿或下降沿时刻根据输入信号改变输出状态，有效地避免了空翻。","why":"边沿触发方式的触发器仅在时钟脉冲的上升沿或下降沿时刻根据输入信号改变输出状态，有效地避免了空翻。","mistake":"注意题干中的限定条件，并对照器件类型、状态和适用条件作答。","memory":"B. 边沿触发","tag":"锁存器与触发器","studyKind":"understand","topic":"锁存器与触发器","classificationReason":"需结合已知条件、逻辑关系或器件工作状态分析，或代入公式计算。","sourceBank":"electronics-continuation-20261107","sourc function startPractice(mode,limit=null,chapter=null){
  let ids=[];
  if(mode==="selection"){
    const selected=new Set(Array.isArray(limit)?limit:[]);
    ids=questions.filter(q=>selected.has(q.id)).map(q=>q.id);
    if(!ids.length){toast("当前筛选没有可练习的题目");return;}
  }else if(mode==="filtered"||mode==="filteredReview"){
    const due=new Set(dueReviewIds());
    ids=filteredQuestions().filter(q=>mode!=="filteredReview"||due.has(q.id)).map(q=>q.id);
    if(!ids.length){toast("当前范围没有可练习的题目");return;}
  }else if(mode==="chapter"){
    ids=questions.filter(q=>q.chapter===chapter).map(q=>q.id);
    if(!ids.length){toast("本章暂时没有题目");return;}
  }else if(mode==="review"){
    ids=dueReviewIds();
    if(!ids.length){toast("今天没有到期复习题");return;}
  }else if(mode==="learning"){
    ids=learningIds();
    if(!ids.length){toast("目前没有学习中的题");return;}
  }else if(mode==="wrong"){
    ids=questions.filter(q=>state.wrongIds.includes(q.id)).map(q=>q.id);
    if(!ids.length){toast("现在没有错题");return;}
  }else if(mode==="daily"){
    ids=newQuestionIdsInOrder();
    if(!ids.length){toast("当前没有新题，先完成复习任务");return;}
    const n=Math.max(1,Math.min(ids.length,parseInt(limit)||state.dailyCount||10));
    ids=ids.slice(0,n);
    if(n<(parseInt(limit)||state.dailyCount||10))toast(`当前只剩 ${n} 道新题`);
  }else{
    let base=[...questions],start=0;
    if(mode==="continue" && state.lastQuestionId){
      const i=base.findIndex(q=>q.id===state.lastQuestionId);
      if(i>=0)start=(i+1)%base.length;
    }
    const ordered=base.slice(start).concat(base.slice(0,start));
    ids=ordered.map(q=>q.id);
  }
  practice={queue:ids,pos:0,currentAnswer:"",done:false,correct:false,mode,plannedCount:ids.length,feedback:""};
  stopStudySession();studySessionBase=(state.studySecondsByDay?.[todayKey()]||0);studySessionStartedAt=null;
  view="practice";renderPractice();
}

  }
  if(v==="wrong")wrongView();
  if(v==="stats")statsView();
}

function normalize(s){return (s||"").trim().replace(/\s+/g,"").replace(/[，,；;]/g,";")}
function fillCorrect(q,v){
  if(q.sourceBank && Array.isArray(q.accepted_answers) && q.accepted_answers.some(answer=>normalize(answer)===normalize(v)))return true;
  if(q.display_answer && normalize(v)===normalize(q.display_answer)) return true;
  const p=normalize(v).split(";").filter(Boolean);
  if(q.answers.length===1)return q.answers[0].some(a=>normalize(a)===normalize(v));
  if(p.length!==q.answers.length)return false;
  return q.answers.every((g,i)=>g.some(a=>normalize(a)===normalize(p[i])));
}
function isCorrect(q,v){return (q.type==="choice"||q.type==="truefalse")?v===q.answer:fillCorrect(q,v)}
function answerText(q){return (q.type==="choice"||q.type==="truefalse")?(q.options.find(o=>o[0]===q.answer)||q.answer):q.display_answer}
function enqueueAgain(id,offset){
  if(!practice)return;
  const future=practice.queue.slice(practice.pos+1);
  if(future.includes(id))return;
  const at=Math.min(practice.pos+1+offset,practice.queue.length);
  practice.queue.splice(at,0,id);
}
function completeLearning(q,m){
  const now=Date.now();
  const wasWrong=state.wrongIds.includes(q.id);
  m.phase="review";
  m.reviewPasses=[];m.evidenceComplete=true;
  m.todayPasses=2;
  m.learningDay=todayKey();
  m.cycleStart=now;
  m.stage=0;
  m.dueTs=addDaysFrom(now,REVIEW_DAYS[0]);
  m.lastDailyComplete=todayKey();
  state.wrongIds=state.wrongIds.filter(id=>id!==q.id);
  if(wasWrong && !state.masteredIds.includes(q.id))state.masteredIds.push(q.id);
  practice.feedback=`今日学习完成 ✓ 已进入记忆曲线；下次复习：${formatDay(m.dueTs)}（第 1 天）。`;
}
function resetToLearning(q,m){
  m.reviewPasses=[];m.evidenceComplete=true;
  m.phase="learning";
  m.todayPasses=0;
  m.learningDay=todayKey();
  m.cycleStart=null;
  m.stage=0;
  m.dueTs=null;
  m.lapses=(m.lapses||0)+1;
  if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
  enqueueAgain(q.id,4);
  practice.feedback="这次忘记了：记忆曲线已重置。题目会再次推回；今天重新完成 2 次间隔答对后，再从第 1 天开始。";
}
function advanceReview(q,m){
  const now=Date.now();
  if(!Array.isArray(m.reviewPasses))m.reviewPasses=[];
  m.reviewPasses.push({day:REVIEW_DAYS[m.stage],ts:now,cycleStart:m.cycleStart});
  let next=m.stage+1;
  // 若复习明显逾期，跳过已经过去的检查点，找到下一个仍在未来的节点。
  while(next<REVIEW_DAYS.length && addDaysFrom(m.cycleStart,REVIEW_DAYS[next])<=now)next++;
  if(next>=REVIEW_DAYS.length){
    m.phase="mastered";m.stage=REVIEW_DAYS.length;m.dueTs=null;
    practice.feedback="本轮长期记忆节点全部通过 ✓ 已完成 1·3·7·14·30·60 天复习。";
  }else{
    m.stage=next;
    m.dueTs=addDaysFrom(m.cycleStart,REVIEW_DAYS[next]);
    practice.feedback=`复习通过 ✓ 下一节点：${formatDay(m.dueTs)}（第 ${REVIEW_DAYS[next]} 天）。`;
  }
}
function recordAnswer(q,value,correct){
  const existingMemory=memoryFor(q.id);
  if(existingMemory&&!Array.isArray(existingMemory.reviewPasses)){
    const evidence=QuizMastery.evidence(existingMemory,state.history,q.id);
    existingMemory.reviewPasses=evidence.passes;
    existingMemory.evidenceComplete=evidence.known;
  }
  const dl=ensureDayData();dl.answers++;if(correct)dl.correct++;else dl.wrong++;
  state.stats.total++;
  if(correct)state.stats.correct++;
  const prev=state.answers[q.id]||{};
  state.answers[q.id]={...prev,value,correct,ts:Date.now(),streak:correct?(prev.streak||0)+1:0};
  state.history.unshift({id:q.id,correct,ts:Date.now()});
  state.history=state.history.slice(0,500);
  let m=memoryFor(q.id);

  if(m?.phase==="review"){
    const isDue=!!(m.dueTs && m.dueTs<=Date.now());
    if(!correct){
      resetToLearning(q,m);
    }else if(isDue){
      advanceReview(q,m);
    }else{
      practice.feedback=`回答正确。正式复习日仍是 ${formatDay(m.dueTs)}，本次额外练习不会提前推进记忆曲线。`;
    }
  }else if(m?.phase==="mastered"){
    if(!correct)resetToLearning(q,m);
    else practice.feedback="回答正确 ✓ 这道题已完成长期记忆周期。";
  }else{
    m=m||ensureLearningMemory(q.id);
    if(m.learningDay!==todayKey()){
      m.learningDay=todayKey();m.todayPasses=0;
    }
    if(!correct){
      m.todayPasses=0;
      if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id);
      enqueueAgain(q.id,4);
      practice.feedback="回答错误：今日掌握计数已清零，稍后会再次出现。";
    }else{
      m.phase="learning";
      m.todayPasses=(m.todayPasses||0)+1;
      if(m.todayPasses>=2){
        completeLearning(q,m);
      }else{
        enqueueAgain(q.id,8);
        practice.feedback="第一次间隔验证通过 ✓ 还需要再答对 1 次才算今日完成，稍后会再次出现。";
      }
    }
  }
  state.lastQuestionId=q.id;
  save();
}
function choose(k){
  if(practice.done)return;
  const q=getQ();
  practice.currentAnswer=k;
  practice.correct=isCorrect(q,k);
  practice.done=true;
  recordAnswer(q,k,practice.correct);
  renderPractice(true);
}
function submitFill(){
  if(practice.done)return;
  const el=document.getElementById("fill");
  const v=el?el.value:practice.currentAnswer;
  if(!normalize(v)){toast("先填写答案");return;}
  const q=getQ();
  practice.currentAnswer=v;
  practice.correct=isCorrect(q,v);
  practice.done=true;
  recordAnswer(q,v,practice.correct);
  renderPractice(true);
}
function nextQuestion(){
  if(practice.pos<practice.queue.length-1){
    practice.pos++;practice.done=false;practice.correct=false;practice.currentAnswer="";
    renderPractice();window.scrollTo({top:0,behavior:"smooth"});
  }else{
    stopStudySession();
    toast("本轮完成");
    home();
  }
}
function prevQuestion(){
  if(practice.pos>0){
    practice.pos--;practice.done=false;practice.correct=false;practice.currentAnswer="";
    renderPractice();window.scrollTo({top:0,behavior:"smooth"});
  }
}
function renderPractice(scrollToAnalysis=false){
  const q=getQ();
  const done=practice.done;
  const progress=Math.round((practice.pos+1)/practice.queue.length*100);
  let input="";
  if(q.type==="choice"||q.type==="truefalse"){
    input=`<div class="options">${q.options.map(o=>{
      const k=o[0];let c="option";
      if(practice.currentAnswer===k)c+=" selected";
      if(done&&k===q.answer)c+=" correct";
      if(done&&practice.currentAnswer===k&&k!==q.answer)c+=" wrong";
      return `<button class="${c}" ${done?"disabled":""} onclick="choose('${k}')">${o}</button>`;
    }).join("")}</div>`;
  }else{
    input=`<div class="fill-row">
      <input id="fill" class="fill" placeholder="${q.sourceBank&&q.answers?.length>1?'各空用分号隔开':q.id===14?'两空用分号隔开':'请输入答案'}" value="${practice.currentAnswer||""}" ${done?"disabled":""} oninput="practice.currentAnswer=this.value" onkeydown="if(event.key==='Enter')submitFill()">
      <button class="primary" ${done?"disabled":""} onclick="submitFill()">答题</button>
    </div>`;
  }
  let answer="";
  if(done){
    answer=`<div id="analysisStart" class="answer-banner ${practice.correct?'good':'bad'}">
      <b>${practice.correct?'✓ 回答正确':'✗ 回答错误'}</b><br>正确答案：<b>${answerText(q)}</b>
    </div>
    ${practice.feedback?`<div class="reinforce-note">${practice.feedback}</div>`:""}
    <div class="analysis">
      <h3>详细原理解析</h3>
      <div class="analysis-block principle"><b>① 核心原理</b>${q.principle}</div>
      <div class="analysis-block why"><b>② 为什么是这个答案</b>${q.why}</div>
      <div class="analysis-block mistake"><b>③ 易错点</b>${q.mistake}</div>
      <div class="analysis-block memory"><b>④ 快速记忆</b>${q.memory}</div>
    </div>`;
  }
  app.innerHTML=shell(`
    ${window.QuizMasteryUI?.chapterGrid()||""}
    <div class="card">
      <div class="qhead"><span>${q.chapter} · ${q.type==="choice"?"单选题":q.type==="truefalse"?"判断题":"填空题"}${practice.mode==="daily"?" · 今日新题":practice.mode==="review"?" · 到期复习":practice.mode==="learning"?" · 学习中":practice.mode==="chapter"?" · 本章练习":""}</span><span><span class="study-timer">⏱ <span id="qTimer">00:00</span></span> ${practice.pos+1}/${practice.queue.length}</span></div>
      <div class="progress" style="margin-bottom:15px"><div style="width:${progress}%"></div></div>
      <div style="margin:12px 0"><span class="tag">${kindNames[studyKind(q)]}</span> <span class="tag">${esc(q.topic)}</span><p class="mini">知识点：${esc(q.tag)} · 第 ${q.id} 题</p><button class="ghost" style="padding:6px 10px;font-size:12px" onclick="moveStudyKind(${q.id})">移到${studyKind(q)==='memory'?'原理与计算':'直接记忆'}</button></div>
      ${window.QuizMasteryUI?.badge(q)||""}
      <h2 class="qtitle">${q.q}</h2>
      ${input}
      ${answer}
      <div class="qactions">
        <button class="ghost" onclick="prevQuestion()" ${practice.pos===0?"disabled":""}>上一题</button>
        <button class="${done?'primary':'ghost'}" onclick="nextQuestion()" ${practice.pos===practice.queue.length-1&&!done?"disabled":""}>${done?"我懂了，下一题":"下一题"}</button>
      </div>
    </div>
  `,"practice");
  if(!studySessionStartedAt)startStudySession();
  const te=document.getElementById("qTimer");if(te)te.textContent=fmtSec(currentSessionSeconds());
  if(scrollToAnalysis){
    setTimeout(()=>document.getElementById("analysisStart")?.scrollIntoView({behavior:"smooth",block:"start"}),80);
  }
}
function wrongView(){
  const list=questions.filter(q=>state.wrongIds.includes(q.id));
  app.innerHTML=shell(`
    <div class="section-title"><h2>错题本</h2><span>${list.length} 题</span></div>
    ${list.length?`<div class="list">${list.map(q=>`
      <div class="wrong-card">
        <span class="tag">${q.tag}</span>
        <h4>第 ${q.id} 题 · ${q.q}</h4>
        <div class="mini">${q.memory}</div>
      </div>`).join("")}</div>
      <button class="primary" style="width:100%;margin-top:14px" onclick="startPractice('wrong')">开始错题强化</button>`
      :`<div class="card empty">目前没有错题。连续两次答对一道错题后，它会自动移出错题本。</div>`}
  `,"wrong");
}
function statsView(){
  const mastered=state.masteredIds.length;
  const answered=Object.keys(state.answers).length;
  const due=dueReviewIds().length,learning=learningIds().length,active=activeReviewCount(),mature=longTermMasteredCount();
  const tagMap={};
  questions.forEach(q=>{
    const a=state.answers[q.id];
    if(!tagMap[q.tag])tagMap[q.tag]={total:0,correct:0};
    if(a){tagMap[q.tag].total++;if(a.correct)tagMap[q.tag].correct++;}
  });
  const tags=Object.entries(tagMap).filter(([k,v])=>v.total).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));
  app.innerHTML=shell(`
    <div class="grid2">
      <div class="metric"><b>${state.stats.total}</b><span>累计作答</span></div>
      <div class="metric"><b>${accuracy()}%</b><span>累计正确率</span></div>
      <div class="metric"><b>${answered}/${questions.length}</b><span>已接触题目</span></div>
      <div class="metric"><b>${mastered}</b><span>错题重新掌握</span></div>
    </div>
    <div class="section-title"><h2>记忆曲线状态</h2><span>1·3·7·14·30·60</span></div>
    <div class="memory-grid">
      <div class="memory-stat"><b>${due}</b><span>今日到期</span></div>
      <div class="memory-stat"><b>${learning}</b><span>学习中</span></div>
      <div class="memory-stat"><b>${active}</b><span>曲线进行中</span></div>
    </div>
    <div class="card" style="margin-top:10px"><b>长期周期完成：${mature} 题</b><p class="mini">复习节点答错会重新进入学习阶段，并从新的完成日期重新开始第 1 天。</p></div>
    <div class="section-title"><h2>知识点表现</h2><span>按当前记录</span></div>
    <div class="list">
      ${tags.length?tags.map(([tag,v])=>{
        const p=Math.round(v.correct/v.total*100);
        return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${tag}</b><span class="mini">${p}%</span></div><div class="progress"><div style="width:${p}%"></div></div></div>`;
      }).join(""):`<div class="card empty">先完成几道题，这里会显示薄弱知识点。</div>`}
    </div>
    <div class="section-title"><h2>数据状态</h2><span>固定网页版</span></div>
    <div class="card"><b>当前记录：${Object.keys(state.memory||{}).length} 道题</b><p class="mini">最后保存：${state.lastSavedAt?new Date(state.lastSavedAt).toLocaleString():"尚未在固定网页保存"}<br>以后始终使用同一个网址，更新题库不会更换存储空间。</p></div>
    <div class="section-title"><h2>数据备份</h2><span>含记忆曲线进度</span></div>
    <div class="card">
      <div class="backup-actions">
        <button class="primary" onclick="exportBackup()">导出备份</button>
        <button class="ghost" onclick="importBackup()">导入备份</button>
      </div>
      <details style="margin-top:12px">
        <summary>自动备份设置</summary>
        <p class="mini">网页打开时自动保存答题记录、错题和记忆进度，只保留最新 3 份自动备份。</p>
        <p class="mini" id="auto-backup-status" role="status">自动备份暂不可用，可手动导出。</p>
        <div style="display:flex;flex-wrap:wrap;gap:9px">
          <button class="ghost" id="auto-backup-choose" onclick="autoBackup.choose()" hidden>选择保存目录</button>
          <button class="ghost" id="auto-backup-now" onclick="autoBackup.now()" hidden>立即备份</button>
          <button class="ghost" id="auto-backup-stop" onclick="autoBackup.stop()" hidden>关闭自动备份</button>
        </div>
      </details>
    </div>
    <button class="ghost" style="width:100%;margin-top:16px" onclick="resetData()">清空学习记录</button>
  `,"stats");
  autoBackup?.render();
}
function resetData(){
  if(confirm("确定清空所有答题记录、错题、统计和记忆曲线进度吗？")){
    state=defaultState();save();toast("已清空");statsView();
  }
}
async function installApp(){
  if(!deferredPrompt){toast("请使用浏览器的“添加到主屏幕”");return;}
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  home();
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;
  if(view==="home")home();
});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("已安装到桌面");});

async function init(){
  if(window.__EMBEDDED_QUESTIONS__){
    questions=window.__EMBEDDED_QUESTIONS__;
  }else{
    try{
      const r=await fetch("questions.json");
      questions=await r.json();
    }catch(e){
      app.innerHTML=`<div class="app-shell"><div class="card" style="margin-top:30px">题库加载失败。</div></div>`;
      return;
    }
  }
  migrateMemory();
  home();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&studySessionStartedAt)saveStudySession()});
window.addEventListener("pagehide",()=>{if(studySessionStartedAt)saveStudySession()});
const autoBackup=window.ElectronicsBackup?.start(now=>backupPayload(now,JSON.parse(localStorage.getItem(STORE_KEY)||"null")||state));
init();
</script>
