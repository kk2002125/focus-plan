<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f8f67"><link rel="manifest" href="./manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>专注计划</title><style>body{margin:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#17211c}.box{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid #e2e8e4;border-radius:18px;padding:22px;text-align:center;max-width:360px;width:100%;box-sizing:border-box}.spin{width:32px;height:32px;border:4px solid #dce9e2;border-top-color:#0f9368;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6f7973}</style></head><body><div class="box"><div class="card"><div class="spin"></div><b>正在打开专注计划</b><br><small>首次加载可能需要几秒</small></div></div><script>(async()=>{try{const [a,b]=await Promise.all([fetch('./app1.txt',{cache:'no-store'}).then(r=>r.text()),fetch('./app2.txt',{cache:'no-store'}).then(r=>r.text())]);const u=Uint8Array.from(atob((a+b).trim()),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('当前浏览器版本过旧，请使用最新版 Chrome、Edge 或夸克浏览器');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><div class="card"><b>加载失败</b><p><small>'+String(e.message||e)+'</small></p><p><small>请刷新页面，或换最新版浏览器打开。</small></p></div></div>'}})();</script></body></html>
